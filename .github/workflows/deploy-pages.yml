name: Deploy Gym Local to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: Publish verified build reports
        run: |
          mkdir -p dist/reports
          pnpm run media:health -- --output=dist/reports/media-health-report.json
      - name: Stage verified nutrition pack from the GitHub Release
        env:
          PACK_URL: https://github.com/${{ github.repository }}/releases/download/nutrition-v2026.08.1/gym-local-nutrition-2026.08.1.sqlite3
          PACK_FILE_NAME: gym-local-nutrition-2026.08.1.sqlite3
        run: |
          pack_staging="$RUNNER_TEMP/$PACK_FILE_NAME"
          curl --fail --location --retry 3 "$PACK_URL" --output "$pack_staging.part"
          mv "$pack_staging.part" "$pack_staging"
          python scripts/verify-nutrition-pack.py --db "$pack_staging" --manifest public/nutrition-pack-manifest.json
          install -m 0644 "$pack_staging" "dist/$PACK_FILE_NAME"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
