    required_fix: "Replace the hook with a Node 22.13-compatible public-contract loading path using only the two authorized files, public @gym/contracts, direct dependencies, and Node built-ins. Require a real Node 22.13 validate/build CLI smoke from a verified official temporary runtime, keep candidate tests offline and deterministic, commit no runtime binary, and stop rather than claim compatibility if exact runtime evidence cannot be obtained safely."

