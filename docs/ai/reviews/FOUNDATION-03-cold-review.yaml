    required_fix: "Use realpath and filesystem-identity checks for the source, output parent, final path, and staging path, retain their identities, and recheck immediately before rename. Add Windows junction and symlink alias tests for source/output parent/final/staging paths."

  - severity: "P1"
    path: "scripts/animation-pack-v1.mjs"
    line: 511
    related_line: 584
    issue: "The source inventory is captured once, so an undeclared asset added after an asset read still succeeds."
    reproduction_or_evidence: "afterAssetRead created an undeclared regular asset and validateAnimationPackSource returned success using the earlier inventory."
    required_fix: "Snapshot the complete inventory plus pack-source and directory/file identities, then recheck them before artifact creation and again before publication. Test add, remove, replace, directory identity, file identity, and pack-source changes."

  - severity: "P1"
    path: "scripts/animation-pack-v1.mjs"
    line: 822
    issue: "Cleanup treats a missing or unreadable ownership marker as owned and deletes foreign staging content after marker removal."
    reproduction_or_evidence: "Removing the marker and adding a foreign sentinel at beforeRename caused ENOENT and recursive deletion of the sentinel and staging directory."
    required_fix: "Missing, unreadable, or mismatched ownership proof must preserve staging and surface an ownership failure. Retain and verify the created directory identity, and handle deliberate marker removal immediately before rename without deleting foreign state."

