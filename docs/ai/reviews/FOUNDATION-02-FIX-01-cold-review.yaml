findings:
  - severity: "P1"
    path: "packages/contracts/src/animation-pack.ts"
    line: 371
    issue: "Canonical HTTPS validation accepts normalization-sensitive or noncanonical URL spellings."
    reproduction_or_evidence: >-
      Both sourceUrl and termsUrl accept a URL containing a literal U+0000 after the path,
      accept /%2e%2e/license even though URL parsing normalizes it to /license, and accept
      uppercase/noncanonical IPv6 such as [2001:DB8::1] even though serialization lowercases it.
    required_fix: >-
      Reject literal control characters and require exact canonical URL serialization without
      normalization-sensitive encoded delimiters or dot segments. Add the complete bypass
      regression matrix to both source and license record parsers while preserving the existing
      strict HTTPS meaning.

  - severity: "P2"
    path: "packages/contracts/src/animation-pack.ts"
    line: 1002
    issue: "Compatibility validation can throw TypeError while parsing untrusted SemVer comparison values."
    reproduction_or_evidence: >-
      validateAnimationPackCompatibility throws for currentAppVersion = Symbol("x") and for a
      Symbol-valued descriptor.minimumAppVersion instead of returning plain deterministic issues.
    required_fix: >-
      Parse every comparison input from unknown, return deterministic invalid_semver issues at
      the runtime or descriptor field path, and never throw. Add Symbol, object, and null matrices
      for currentAppVersion and descriptor.minimumAppVersion.

  - severity: "P2"
    path: "packages/contracts/src/animation-pack.ts"
    line: 2
    related_path: "packages/contracts/src/animation-pack.test.ts"
    related_line: 2
    issue: "Placeholder Apache/MyCompany source headers contradict the repository license."
    reproduction_or_evidence: >-
      Both files identify MyCompany LLC and Apache-2.0, while LICENSE is MIT for Gym Local
      contributors and the repository contains no Apache notice.
    required_fix: >-
      Replace both headers with the repository-standard Gym Local contributors and
      SPDX-License-Identifier: MIT header. Assert that MyCompany LLC and the Apache contradiction
      are absent from both files.

