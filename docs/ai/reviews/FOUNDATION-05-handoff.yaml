state_machine_evidence:
  initial_and_dispose: "The exact frozen idle state is returned initially and after idempotent dispose; dispose cancels work, clears viewport/retry request/subscribers, and leaves later commands inert."
  exact_identity: "Requests are parsed before loading; resolved entry/asset/blob relations are parsed and compared byte-for-byte; no aliasing, lowercasing, search, redirect, or cross-variant fallback exists."
  load_and_mount: "Loading publishes synchronously; ready publishes only after exact source validation and an interface-valid renderer session; no load path calls play."
  commands: "Play is ready/paused only, pause is playing only, seek is finite and clamped, ended pauses at duration, and replay explicitly seeks to zero before play."
  cancellation: "Generation, expected viewport, abort signal, current-session identity, and one-time WeakSet disposal guard every loader, mount, frame, ended, failure, detach, reattach, replacement load, and dispose race."
  failure_mapping: "Public AnimationPackError values are preserved; unknown loader errors become missing_asset; malformed input and renderer/session failures become activation_failed; every failure selects text fallback."

accessibility_evidence:
  subscription: "React uses useSyncExternalStore for controller state and OS reduced-motion state; no polling mirrors snapshots."
  semantics: "The figure is an accessible group, viewport has an exercise-specific image label and written-description relation, lifecycle uses one polite atomic status region, and position changes are not live-announced."
  controls: "Play, pause, replay, retry, and seek are native controls with localized visible/accessibility text and semantic disabled states; no global keyboard handler or programmatic focus move exists."
  fallback: "Localized written guidance remains in the DOM for every state and is emphasized for failed/static-reference modes; raw exception text and paths are never rendered."
  evidence_scope: "Automated evidence is jsdom/DOM/source coverage only; physical VoiceOver, Safari, contrast instrumentation, and device behavior remain pilot gates."

responsive_evidence:
  source_rules: "The component owns no fixed width above 320 px; root/viewport/controls use width 100%, min-width 0, overflow containment, wrapped controls, and overflow-wrap."
  touch_and_focus: "Buttons and range input use at least 44 px dimensions and visible 3 px focus-visible outlines on the dark surface."
  mobile: "At max-width 390 px controls and metadata stack and the seek control stays width 100%; source tests reject fixed-width and overflow regressions."
  reduced_motion: "The media query disables animation, transition, and smooth scrolling; controller/component behavior independently prevents renderer play."
  evidence_scope: "No physical 320/390 Safari rendering claim is made."

