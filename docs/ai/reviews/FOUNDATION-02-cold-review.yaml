findings:
  - severity: "P1"
    path: "packages/contracts/src/animation-pack.ts"
    line: 598
    issue: "Sparse array holes are accepted, produce lossy success data, and can make manifest parsing throw."
    reproduction_or_evidence: >-
      A trailing hole in reviews, licenses, sources, or entries, and a hole in equipmentProps,
      produced success; JSON round-trip changed each hole to null. A trailing hole in assets
      threw TypeError at the Map construction on line 662 instead of returning validation issues.
    required_fix: >-
      Explicitly reject missing own indices in every accepted array before mapping, including
      equipmentProps, and never construct referential maps until every array element is defined.
      Add sparse-array and JSON-round-trip regression tests for every array field.

  - severity: "P2"
    path: "packages/contracts/src/animation-pack.ts"
    line: 599
    issue: "All-or-nothing array parsing causes false referential issues and suppresses safely detectable issues."
    reproduction_or_evidence: >-
      Making sources[0].author empty reported invalid_string plus false missing_source issues for
      the asset and entry even though source.one was declared. Conversely, with one structurally
      invalid entry and another valid entry referencing asset.missing-too, parsing reported only
      invalid_id and omitted the safely detectable missing_asset.
    required_fix: >-
      Preserve per-element structural results and independently validated identities while
      collecting issues. Run referential checks for every safely inspectable record, without
      treating an existing but malformed declaration as absent.

  - severity: "P1"
    path: "packages/contracts/src/animation-pack.ts"
    line: 663
    issue: "The bound release review can disagree with the manifest's declared review record."
    reproduction_or_evidence: >-
      A manifest whose review and reviews[0] shared review.release-1 but had different reviewer
      and reviewedAt values parsed successfully; compatibility with the descriptor also returned
      success. Only review-ID membership is checked.
    required_fix: >-
      Require the bound manifest review to equal the unique reviews entry with that ID across
      id, reviewer, reviewedAt, and status, or remove the duplicate representation. Test each
      disagreement with stable paths.

  - severity: "P2"
    path: "packages/contracts/src/animation-pack.ts"
    line: 288
    issue: "Accepted negative-zero numbers do not survive JSON round-trip without loss."
    reproduction_or_evidence: >-
      parseAnimationPackEntry accepted -0 for loop.startSeconds and a camera component, and
      parseAnimationPlayerState accepted -0 for positionSeconds. Object.is confirmed -0 in the
      returned data, while JSON.stringify/JSON.parse changed every value to +0.
    required_fix: >-
      Reject Object.is(value, -0) in numeric positions where zero is permitted, consistent with
      the no-coercion rule, and add negative-zero serialization tests for loop, camera, and player
      position fields.

  - severity: "P2"
    path: "packages/contracts/src/animation-pack.ts"
    line: 322
    issue: "Valid ISO years 0001 through 0099 are rejected."
    reproduction_or_evidence: >-
      reviewedAt 0099-12-31 returned invalid_date. Installed and verified timestamps using
      0099-12-31T23:59:59Z also returned invalid_timestamp. Date.UTC interprets years 0-99 as
      1900-1999, so the real-date comparison fails.
    required_fix: >-
      Validate Gregorian date parts without Date.UTC's 0-99 remapping, and avoid Date.parse as
      the validity authority. Add boundary and leap-year tests covering 0001, 0004, and 0099 for
      dates and timestamps.

  - severity: "P2"
    path: "docs/ai/reviews/FOUNDATION-02-handoff.yaml"
    line: 11
    issue: "The handoff does not record the exact metadata commit required by the packet."
    reproduction_or_evidence: >-
      handoff_commit remains an unresolved SELF expression and review_target.handoff_metadata
      still ends at handoff_commit. The actual metadata commit is
      e05f5d5ebf5485e5ed7a3064c7f65d2457e5837f, contradicting AC-11's requirement that immutable
      ranges be recorded with exact SHAs in the handoff.
    required_fix: >-
      Establish an authorized non-self-referential evidence mechanism that binds the exact
      metadata SHA, record the exact candidate-to-metadata range, and do not claim AC-11 until
      that evidence exists.

  - severity: "P1"
    path: "packages/contracts/src/animation-pack.ts"
    line: 368
    issue: "Malformed HTTPS strings are accepted as source and license URLs."
    reproduction_or_evidence: >-
      Both record parsers accepted https://[, https://example.test:99999/path, and
      https://user@:443/path, while the platform URL parser rejected each with TypeError.
    required_fix: >-
      Perform deterministic syntactic HTTPS URL validation with a valid hostname and port,
      document the canonical form, and add malformed-host, malformed-authority, and invalid-port
      regression tests.

