    - "Confirm no test weakens or deletes an original negative assertion merely to pass."

stop_gates:
  - id: "F04-FIX-01-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, or preflight branch/parent/cleanliness/coordinator-delta checks fail."
    action: "Stop and write a BLOCKED handoff; do not substitute a model, clean, amend, rebase, or guess."
  - id: "F04-FIX-01-STOP-02"
    condition: "A fix needs any path outside the six candidate files or requires a dependency, contract/schema/version, DB/backup, configuration, archive-format, UI, or runtime-network change."
    action: "Stop without widening scope and record the exact owning packet needed."
  - id: "F04-FIX-01-STOP-03"
    condition: "The supported browser FileSystemHandle.isSameEntry API or TypeScript environment cannot provide the required identity recheck within authorized paths."
    action: "Stop with the exact API/type gap; do not add a polyfill, dependency, private API, or weaken cleanup safety."
  - id: "F04-FIX-01-STOP-04"
    condition: "Foreign replacement can still be deleted in the deterministic cleanup race, or any active/previous/referenced/personal object can be removed before a valid journal commit."
    action: "Stop with exact reproduction and preserve questionable bytes."
  - id: "F04-FIX-01-STOP-05"
    condition: "Any finding remains reproducible, any inherited acceptance/test regresses, exact 64 MiB boundary cannot be tested without unsafe allocation, or a required check fails beyond authorized repair."
    action: "Stop before candidate completion and write a BLOCKED handoff; do not weaken tests or redefine limits."
  - id: "F04-FIX-01-STOP-06"
    condition: "The candidate needs multiple implementation commits, contains an unexpected path, or the handoff cannot state exact non-circular evidence."
    action: "Stop without amending/rebasing and record the boundary failure in the authorized handoff."

