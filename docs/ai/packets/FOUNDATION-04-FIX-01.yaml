outcome:
  objective: "Correct exactly the three coordinator findings without weakening any original FOUNDATION-04 invariant, acceptance criterion, public boundary, or test."
  non_goals:
    - "No UI, renderer, catalog, media, workout, nutrition, production asset, network, dependency, contract, schema, DB6, backup, service-worker, or PWA change."
    - "No DEFLATE, ZIP64, encryption, arbitrary ZIP compatibility, cross-tab coordinator, or changed archive format."

implementation_requirements:
  eocd:
    - "Treat the final fixed 22 bytes as the version-1 EOCD because comments and trailing bytes are forbidden."
    - "Validate its signature, zero comment, single-disk fields, entry counts, central size/offset, and exact adjacency to the terminal EOCD before trusting any central or local record."
    - "Ignore PK 05 06 lookalikes inside payload bytes; do not weaken rejection of malformed actual terminal records or impossible central-directory topology."
  opfs_cleanup:
    - "Keep the originally resolved owned directory handle. Immediately before removeEntry, relookup the current directory entry and require await current.isSameEntry(original) to be true."
    - "Reread and compare owner.json from the current same entry immediately before removal. Missing API, lookup failure, type mismatch, alias, replacement, marker failure, or marker mismatch preserves bytes and returns a bounded warning."
    - "Tests use standards-shaped fake handles with isSameEntry and a deterministic pre-remove replacement hook; no production test-only hook is exported."
  aggregate_budget:
    - "Define or reuse one explicit 64 * 1024 * 1024 byte storage aggregate asset limit consistent with FOUNDATION-03."
    - "Sum manifest.assets[].byteSize only, reject unsafe arithmetic, and reject an excess before reading or hashing the first asset that crosses the limit."
    - "The descriptor-selected manifest is not counted as an asset. Exactly 64 MiB passes; 64 MiB plus one byte fails with the stable resource_limit error."
  preservation:
    - "All original FOUNDATION-04 F04-AC-01 through F04-AC-18 remain satisfied."
    - "Do not change public contracts, IDs, versions, OPFS layout, journal format, backup exclusion, exact variant isolation, or error-code semantics beyond mapping the new aggregate rejection to the existing resource_limit code."

acceptance_tests:
  - id: "F04-FIX-01-AC-01"
    requirement: "A valid STORE archive whose asset payload contains EOCD signature bytes parses successfully."
    evidence: "Positive payload-lookalike test plus all prior archive corruption tests."
  - id: "F04-FIX-01-AC-02"
    requirement: "Malformed actual terminal EOCD, comments, trailing bytes, count/offset/size corruption, and invalid central topology remain rejected."
    evidence: "Focused archive suite with explicit actual-terminal mutations."
  - id: "F04-FIX-01-AC-03"
    requirement: "Cleanup removes only the exact directory identity that passed ownership checks immediately before removal."
    evidence: "isSameEntry positive test and deterministic replacement race preserving a foreign sentinel."
  - id: "F04-FIX-01-AC-04"
    requirement: "Missing or failing isSameEntry, lookup/type changes, and changed/unreadable/missing owner marker preserve the object and report a cleanup warning."
    evidence: "Expanded OPFS cleanup matrix."
  - id: "F04-FIX-01-AC-05"
    requirement: "Declared assets totaling exactly 64 MiB are allowed without requiring retained 64 MiB allocations in the unit test."
    evidence: "Instrumented StoreZipEntry stubs or equivalent bounded test doubles."
  - id: "F04-FIX-01-AC-06"
    requirement: "64 MiB plus one byte is rejected before reading or hashing the first exceeding asset."
    evidence: "Read/hash counter remains unchanged for the crossing entry."
  - id: "F04-FIX-01-AC-07"
    requirement: "All 115 original focused tests and all original repository/storage/backup/DB/PWA gates remain passing."
    evidence: "Fresh immutable-candidate command output and exact handoff counts."
  - id: "F04-FIX-01-AC-08"
    requirement: "The candidate changes only six finding-scoped files and the direct-child metadata commit adds only the FIX-01 handoff."
    evidence: "Exact parent, range, name-only, diff-check, and YAML assertions."

