  dependency_rules:
    - "Registry version, integrity, package license, repository license, transitive closure, and NOTICE data must match before installation. Any drift requires a new coordinate packet."
    - "Keep exact benchmark candidates as development dependencies through owner verification so desktop comparison is reproducible. Only the selected winner may be a runtime dependency or production adapter import."
    - "Rejected candidate code must not enter the normal production build or service-worker precache."
  same_workload_protocol:
    - "All candidates use the same 12 immutable GLBs, source Blob bytes, clip/camera request, canvas CSS size, device pixel ratio cap, lighting, background, variant order, warmup, sample duration, and cache state."
    - "Run desktop smoke/feature/leak gates for all candidates, then a short physical low-end iPhone comparison for every hard-gate survivor, then two complete chosen-renderer release runs."
    - "Record raw timing samples rather than screenshots alone: Blob read, parse/decode, scene mount, first drawn frame, 30-second frame intervals, long frames, play/pause/seek accuracy, and dispose/reload cycles."
    - "Record unminified and production chunk bytes, gzip bytes, dependency closure, WebGL contexts, draw calls, triangles, and material/texture counts."
  hard_gates:
    - "Pinned license and redistribution obligations are compatible and fully recorded."
    - "Consumes the verified Blob with no runtime network or CDN and never substitutes another entry, clip, or equipment variant."
    - "Implements mount, static first frame, exact clip, play, pause, seek, loop window, playbackSpeed, camera preset, horizontal mirror, reduced motion, resize, failure, and dispose behind the existing interface."
    - "No autoplay; reduced motion draws at most a static frame and never advances the clip."
    - "Ten sequential mount/play/seek/dispose cycles leave no live RAF, observer, event listener, canvas, object URL, scene, mixer, material, geometry, texture, skeleton, or WebGL context owned by the disposed session."
    - "Passes Safari/WebGL2 support on the physical baseline and all locked performance budgets."
