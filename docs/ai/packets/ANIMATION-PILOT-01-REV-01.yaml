  source_or_license_impact: "bundled_assets"
  renderer_decision: "Select exactly one winner only after all hard gates and the locked benchmark matrix. Do not preselect by popularity."
  distribution_trust: "The pilot harness accepts an explicitly selected reviewed local descriptor sidecar and archive. Production authentication remains out of scope."

