representative_variant_matrix:
  exact_count: 12
  selection_rule: "The listed exerciseVariantId, animationId, pattern, clipName, default camera preset, and equipment props are exact. Calibrated camera coordinates/FOV are reviewed per asset. Replacing a row requires a new coordinate packet."
  coverage_assertions:
    required_equipment:
      - "bodyweight"
      - "dumbbell"
      - "barbell"
      - "cable"
      - "machine"
      - "smith"
      - "resistance_band"
    required_motion_characteristics:
      - "unilateral"
      - "seated"
      - "compound"
      - "isolation"
      - "ground_contact"
      - "isometric_hold"
      - "locomotion"
    required_patterns:
      - "push"
      - "pull"
      - "squat"
      - "hinge"
      - "lunge"
      - "isolation"
      - "core"
      - "carry"
  variants:
    - exercise_variant_id: "push_up__bodyweight"
      animation_id: "animation.pilot-01.push-up.bodyweight"
      pattern: "push"
      clip_name: "PushUpBodyweightLoop"
      default_camera: "side"
      equipment_props: []
      coverage: ["bodyweight", "compound", "ground_contact", "closed_chain"]
      visual_gate: "Hands and feet remain planted; trunk stays braced; elbows and shoulders follow the reviewed bodyweight setup."
    - exercise_variant_id: "plank__bodyweight"
      animation_id: "animation.pilot-01.plank.bodyweight"
      pattern: "core"
      clip_name: "PlankBodyweightHold"
      default_camera: "side"
      equipment_props: []
      coverage: ["bodyweight", "isometric_hold", "ground_contact", "reduced_motion_reference"]
      visual_gate: "The hold has no rep-like pumping; neutral trunk and supported forearms remain clear at the static first frame."
    - exercise_variant_id: "one_arm_row__dumbbell"
      animation_id: "animation.pilot-01.one-arm-row.dumbbell"
      pattern: "pull"
      clip_name: "OneArmRowDumbbellLoop"
      default_camera: "three_quarter"
      equipment_props: ["prop.dumbbell"]
      coverage: ["dumbbell", "unilateral", "pull", "mirror_mode"]
      visual_gate: "One dumbbell remains attached to the working hand; the torso does not rotate into a bilateral row."
    - exercise_variant_id: "squat__barbell"
      animation_id: "animation.pilot-01.squat.barbell"
      pattern: "squat"
      clip_name: "SquatBarbellLoop"
      default_camera: "side"
      equipment_props: ["prop.barbell"]
      coverage: ["barbell", "compound", "squat", "loaded_large_range"]
      visual_gate: "The bar remains fixed to the reviewed back position and the feet, knees, hips, and trunk remain coherent through the loop."
    - exercise_variant_id: "face_pull__cable"
      animation_id: "animation.pilot-01.face-pull.cable"
      pattern: "pull"
      clip_name: "FacePullCableLoop"
      default_camera: "three_quarter"
      equipment_props: ["prop.cable-station", "prop.rope-handle"]
      coverage: ["cable", "pull", "standing", "linked_prop"]
      visual_gate: "The rope remains connected to the cable anchor and finishes near eye level without becoming a band or free-weight motion."
    - exercise_variant_id: "leg_press__machine"
      animation_id: "animation.pilot-01.leg-press.machine"
      pattern: "squat"
      clip_name: "LegPressMachineLoop"
      default_camera: "side"
      equipment_props: ["prop.leg-press-machine"]
      coverage: ["machine", "seated", "compound", "moving_sled"]
      visual_gate: "Back and hips remain supported; the sled path and knee range visibly belong to a leg-press machine."
    - exercise_variant_id: "leg_extension__machine"
      animation_id: "animation.pilot-01.leg-extension.machine"
      pattern: "isolation"
      clip_name: "LegExtensionMachineLoop"
      default_camera: "side"
      equipment_props: ["prop.leg-extension-machine"]
      coverage: ["machine", "seated", "isolation", "single_joint"]
      visual_gate: "The knee axis aligns with the machine pivot and the motion cannot be mistaken for a squat or cable kick."
    - exercise_variant_id: "split_squat__smith"
      animation_id: "animation.pilot-01.split-squat.smith"
      pattern: "lunge"
      clip_name: "SplitSquatSmithLoop"
      default_camera: "three_quarter"
      equipment_props: ["prop.smith-machine", "prop.smith-bar"]
      coverage: ["smith", "unilateral", "compound", "guided_bar"]
      visual_gate: "The staggered stance and vertical Smith guide remain explicit; it must not look like the bodyweight, dumbbell, or barbell variant."
    - exercise_variant_id: "anti_rotation__resistance_band"
      animation_id: "animation.pilot-01.anti-rotation.resistance-band"
      pattern: "core"
      clip_name: "AntiRotationBandLoop"
      default_camera: "front"
      equipment_props: ["prop.resistance-band", "prop.band-anchor"]
      coverage: ["resistance_band", "core", "elastic_link", "anti_rotation"]
      visual_gate: "The band stays attached to the side anchor with visible tension while the chest and hips resist rotation."
    - exercise_variant_id: "lateral_raise__dumbbell"
      animation_id: "animation.pilot-01.lateral-raise.dumbbell"
      pattern: "isolation"
      clip_name: "LateralRaiseDumbbellLoop"
      default_camera: "front"
      equipment_props: ["prop.dumbbell-pair"]
      coverage: ["dumbbell", "isolation", "bilateral", "upper_body"]
      visual_gate: "Both dumbbells track with the hands and the shoulder motion remains a lateral raise without torso heave."
    - exercise_variant_id: "hip_thrust__barbell"
      animation_id: "animation.pilot-01.hip-thrust.barbell"
      pattern: "hinge"
      clip_name: "HipThrustBarbellLoop"
      default_camera: "side"
      equipment_props: ["prop.barbell", "prop.bench"]
      coverage: ["barbell", "compound", "bench_supported", "horizontal_torso"]
      visual_gate: "Upper back remains supported by the bench and the bar tracks the hips without substituting spinal hyperextension."
    - exercise_variant_id: "farmer_carry__kettlebell"
      animation_id: "animation.pilot-01.farmer-carry.kettlebell"
      pattern: "carry"
      clip_name: "FarmerCarryKettlebellLoop"
      default_camera: "three_quarter"
      equipment_props: ["prop.kettlebell-pair"]
      coverage: ["kettlebell", "locomotion", "duration_distance", "full_body"]
      visual_gate: "Two kettlebells stay at the sides through a seamless walking cycle with no treadmill drift or camera jump."

source_asset_and_license_policy:
  pack:
    pack_id: "gym-local.animation-pilot-01"
    releases: ["1.0.0", "1.0.1"]
    rig_id: "rig.gym-local-pilot-v1"
    media_type: "model/gltf-binary"
    compression: "none"
    one_asset_per_variant: true
    exact_asset_count_per_release: 12
    exact_primary_entry_count_per_release: 12
  authorship:
    rule: "Every geometry primitive, rig node, keyframe, material color, and equipment prop is derived deterministically from committed Gym Local declarative source."
    prohibited_sources:
      - "web-downloaded model or animation"
      - "Mixamo or another hosted motion library"
      - "ExerciseDB or video/image tracing"
      - "BlenderKit or marketplace asset"
      - "generative image, video, 3D, or motion service"
      - "font, texture, environment map, audio, or opaque binary template"
    external_media_bytes: 0
  required_license_record:
    id: "license.mit-gym-local"
    name: "MIT License"
    terms_url: "https://github.com/luutru433-coder/gym-local/blob/main/LICENSE"
    redistribution_scope: "offline"
    attribution: "Copyright (c) 2026 Gym Local contributors"
  provenance:
    - "Use one exact source record per GLB and release sentinel. Each record names the author, committed source path URL, license, attribution, explicit modifications, review date, and approved review ID."
    - "A named rights reviewer and a named motion/equipment reviewer, both distinct from the producer invocation, approve records before releaseReviewId can be approved."
    - "Every release, license, source, asset, and entry relation passes the v1 parser and deterministic builder; unresolved or self-contradictory rights fail closed."
    - "Copy exact third-party renderer license texts from installed pinned packages to docs/licenses/animation-pilot-01 and record package integrity plus NOTICE obligations."
    - "THIRD_PARTY_NOTICES distinguishes benchmark-only packages from the selected runtime renderer and includes the complete selected dependency closure."
  glb_requirements:
    - "Generate self-contained GLB 2.0 only. No external URI, data URI, image, texture, audio, compression extension, decoder, network reference, hidden payload, or unknown required extension."
    - "Each GLB contains exactly the declared clip name, finite monotonic keyframes, the declared duration/loop, the shared rig ID metadata, and nodes matching every equipmentProps ID."
    - "The source validator proves scene, node, mesh, accessor, animation channel, target, buffer view, duration, and prop relationships that the FOUNDATION-03 envelope intentionally did not prove."
    - "Use representative low-poly production intent rather than empty fixtures: record triangles, vertices, nodes, animated tracks, keyframes, materials, bytes, and decode complexity for every asset."
    - "Each asset is at most 4 MiB; all 12 asset bytes are at most 24 MiB. At least one stress asset exercises the declared upper production complexity without artificial invisible geometry."
    - "No generated GLB, ZIP, manifest, or release descriptor is tracked. Two clean materializations from committed source must produce byte-identical GLBs and release artifacts."
  visual_review:
    - "Render start, mid, end, front/side or required three-quarter contact sheets for all 12 variants at 320 and 390 CSS-pixel layouts."
    - "The named motion/equipment reviewer records pass/fail against every visual_gate; uncertainty, clipping that obscures setup, detached props, joint discontinuity, or wrong equipment blocks release."
    - "Mirrored one_arm_row and split_squat are separately reviewed. Mirror mode changes presentation only and never changes variant identity."
    - "The review is instructional clarity evidence only and makes no medical or universal biomechanics claim."

