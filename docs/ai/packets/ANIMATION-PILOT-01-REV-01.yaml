stop_gates:
  - id: "AP01R1-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, or authoritative invocation metadata cannot be verified."
    action: "Stop without model substitution and write a BLOCKED handoff."
  - id: "AP01R1-STOP-02"
    condition: "Base/checkpoint, coordinator parent, branch, cleanliness, instructions, required reads, catalog counts, accepted versions, or protected baseline does not match."
    action: "Stop before editing; do not clean, rebase, amend, infer, or widen scope."
  - id: "AP01R1-STOP-03"
    condition: "A named rights reviewer, named motion/equipment reviewer, secure installable test path, physical qualifying iPhone, or reviewable memory/energy/thermal tooling is unavailable."
    action: "Stop before claiming a candidate. A simulator, desktop emulation, self-approval, or not_applicable field is not a substitute."
  - id: "AP01R1-STOP-04"
    condition: "Any source or bundled byte has unclear authorship, source, license, terms, offline redistribution right, attribution, modification record, review date, or approved reviewer; or any asset derives from external/generative media."
    action: "Exclude the byte and stop if the exact 12-row pilot can no longer be completed. Do not scrape, replace with a similar variant, or invent provenance."
  - id: "AP01R1-STOP-05"
    condition: "Pinned package version/integrity/license/NOTICE differs, a transitive license is incompatible or unresolved, or a candidate requires CDN/runtime network/telemetry."
    action: "Stop renderer acquisition/selection and report the exact package evidence; do not float versions, use legacy peer overrides, or vendor opaque code."
  - id: "AP01R1-STOP-06"
    condition: "Correctness requires a contract/schema/protocol/version change, builder/ZIP/OPFS/controller/shell fix, DB6, backup change, feature integration, public asset, PWA update change, or any unlisted path."
    action: "Stop and name the required foundation/fix/integration packet; do not widen ANIMATION-PILOT-01-REV-01."
  - id: "AP01R1-STOP-07"
    condition: "The exact 12 IDs, primary count, clip, prop, camera, source/license relation, or 199/187 mapping partition cannot be proven, or any lookup falls back across variant/equipment/case/version."
    action: "Stop without substituting a nearby animation or editing catalog semantics."
  - id: "AP01R1-STOP-08"
    condition: "Generated GLB is not self-contained, exceeds size limits, lacks declared semantic content, uses an unapproved extension/resource, fails visual review, or cannot be reproduced byte-for-byte."
    action: "Repair only committed declarative source/tooling within allowed paths; otherwise stop with hashes and the exact failed row."
  - id: "AP01R1-STOP-09"
    condition: "No renderer candidate passes every hard gate, candidate measurements are not comparable, selection changes the locked workload, or the winner cannot fully dispose resources."
    action: "Stop without selecting a renderer or adding a runtime dependency. Record raw evidence and issue a new coordination decision."
  - id: "AP01R1-STOP-10"
    condition: "Install, corrupt/interrupted/quota failure, update, relaunch, rollback, or removal changes the wrong journal identity, loses the prior verified pack, searches a similar pack, or mutates personal/backup data."
    action: "Stop at the last verified release; do not weaken storage verification, rollback, or personal-data assertions."
  - id: "AP01R1-STOP-11"
    condition: "Network-disabled cold relaunch cannot recover and play all 12 exact variants, any runtime request is attempted, or pack bytes enter public/default bundle/service-worker precache."
    action: "Stop and preserve text fallback. Do not cache the pack in the PWA or re-enable network to claim offline success."
  - id: "AP01R1-STOP-12"
    condition: "Either physical chosen-renderer trial misses any first-frame, frame, memory, storage, battery, thermal, endurance, crash, context, accessibility, reduced-motion, or layout budget."
    action: "Do not average away or relax the failure. Optimize only inside allowed paths and rerun both complete trials; otherwise write BLOCKED with raw evidence."
  - id: "AP01R1-STOP-13"
    condition: "External video, active workout, PWA update deferral, historical exact-variant semantics, nutrition, contracts, versions, default app behavior, or any protected object regresses."
    action: "Stop and restore the pilot boundary without modifying the protected owner; if impossible, issue a separate packet."
  - id: "AP01R1-STOP-14"
    condition: "A required check/evidence validator fails beyond allowed repair, evidence is missing/nonfinite/circular, an unexpected path changes, or the single-candidate/handoff lineage cannot be preserved."
    action: "Stop before candidate completion and write a BLOCKED handoff; do not amend, split implementation commits, invent evidence, or claim PASS."

handoff:
  report_path: "docs/ai/reviews/ANIMATION-PILOT-01-REV-01-handoff.yaml"
  candidate_commit_excludes_handoff_and_approval_metadata: true
  post_candidate_metadata_paths:
    - "docs/ai/reviews/ANIMATION-PILOT-01-REV-01-handoff.yaml"
  metadata_commit_rule: "After candidate_commit, only the declared post_candidate_metadata_paths may change before merge. The handoff names the immutable candidate and records owner verification; it must not name its own metadata commit."
  required_fields:
    - "schema_version"
    - "packet_id"
    - "status"
    - "producer_model"
    - "model_gate_evidence"
    - "subagents_used"
    - "base_commit"
    - "coordinator_commit"
    - "candidate_parent_commit"
    - "candidate_commit"
    - "branch"
    - "changed_paths"
    - "versions"
    - "variant_matrix"
    - "release_artifacts"
    - "determinism_evidence"
    - "renderer_candidates"
    - "renderer_selection"
    - "dependency_and_license_evidence"
    - "source_and_motion_reviews"
    - "acceptance_evidence"
    - "offline_relaunch_evidence"
    - "rollback_evidence"
    - "personal_data_evidence"
    - "device_runs"
    - "performance_budget_results"
    - "accessibility_evidence"
    - "visual_evidence"
    - "checks"
    - "protected_path_audit"
    - "known_risks"
    - "review_target"
    - "owner_verification"
  prohibited_fields:
    - "handoff_commit"
    - "metadata_commit"
    - "self_sha"
    - "cold_review_pass"
    - "owner_waiver"
  exact_fact_requirements:
    - "Record exact package versions/integrities/licenses, generated artifact hashes/sizes, selected IDs, device/tool builds, sample counts, raw evidence paths/hashes, commands, exit codes, Git ranges, and measured budgets only."
    - "Distinguish automated/jsdom/responsive-mode evidence from physical iPhone, Safari, VoiceOver, memory, energy, and thermal evidence."
    - "Do not claim renderer superiority, biomechanics, offline behavior, disposal, or performance beyond the exact measured assets/devices/conditions."
    - "Do not infer approval from chat, an optional cold-review verdict, or a historical waiver; only the committed owner_verification record may authorize merge."

owner_verification:
  required: true
  record_location: "docs/ai/reviews/ANIMATION-PILOT-01-REV-01-handoff.yaml#owner_verification"
  schema:
    schema_version: 1
    packet_id: "ANIMATION-PILOT-01-REV-01"
    candidate_commit: "40-character commit SHA"
    status: "APPROVED|REJECTED|BLOCKED"
    approved_by: "repository-owner identity or null"
    approved_at: "ISO-8601 timestamp or null"
    checks_verified:
      - command: "command"
        result: "pass|fail|not_run"
        evidence: "summary or report path"
    accepted_risks: []
    merge_authorized: false
  authorization_rule: "Only status APPROVED with non-null owner identity/time and passing evidence for every required check may set merge_authorized true. REJECTED or BLOCKED requires false."
  mandatory_verification_focus:
    - "Exact 12/199 mapping and no cross-variant fallback."
    - "Every asset byte and dependency license/provenance/review relationship."
    - "Deterministic GLB and release reproduction."
    - "Same-workload renderer benchmark, hard gates, score, selected dependency, and rejected-code build exclusion."
    - "Storage exact source read, install/update/failure/relaunch/rollback identity, personal data, and backup isolation."
    - "Raw physical iPhone first-frame/frame/memory/storage/battery/thermal/endurance evidence and both-trial budget pass."
    - "Physical VoiceOver/reduced motion plus correctly scoped 320/390/visual evidence."
    - "Normal app, external video, active workout, PWA update deferral, nutrition, public/precache, contracts, and versions remain protected."

cold_review:
  required: false
  requested: false
  advisory_only: true
  may_edit_files: false
  allowed_verdicts:
    - "PASS"
    - "FAIL"
    - "BLOCKED"
  report_path: null
  merge_gate_effect: "none"

merge:
  allowed_only_after: "owner_verification.status == APPROVED and owner_verification.merge_authorized == true"
  target: "main"
  squash_policy: "Keep the packet-only coordinator, immutable candidate, handoff/owner-verification metadata, and later coordinator-ledger checkpoint commits distinct."
  checkpoint_tag_after_merge: "checkpoint/animation-pilot-01-rev-01-owner-approved"
  next_packet_gate: "No ANIMATION-WAVE packet may be created until this checkpoint exists and every measured complexity/license constraint is carried forward."
