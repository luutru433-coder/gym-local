implementation_requirements:
  catalog_mapping:
    - "Export an immutable 12-record animation catalog from public @gym/catalog with exact variant ID, animation ID, pack ID, animationCatalogVersion 1, and availability status."
    - "Validate every variant against EXERCISE_VARIANTS and the locked matrix. IDs are case-sensitive; lookups return undefined for all other 187 variants, case changes, or equipment neighbors."
    - "Do not edit movement seeds, variant instructions, tracking profiles, videos, images, load modes, laterality, history, or app catalog version."
  storage_source_read:
    - "Add an exact public storage operation that accepts exerciseVariantId and animationId, selects only the verified active pack, uses animationCatalogVersion 1, and returns a contract-shaped entry, asset descriptor, and exact verified Blob."
    - "Resolve exactly one primary entry from the stored manifest. Require requested animationId, entry/asset IDs, path, duration, source, license, byte size, media type, and active pack identity to match before returning."
    - "AbortSignal cancellation may stop the read, but cancellation never changes journal state. No OPFS handle, archive index, path join, manifest mutator, fallback search, alias, redirect, lowercase conversion, or network API crosses the public boundary."
    - "Retain current full-object revalidation and serialized lifecycle guarantees. Do not weaken install, readAsset, recovery, rollback, cleanup, quota, or corruption tests."
  selected_renderer_adapter:
    - "Implement only the benchmark winner in packages/media/src/gltf-renderer.ts and export it through public @gym/media."
    - "Read the Blob as bounded bytes and parse the exact self-contained GLB. Reject missing/duplicate clip, external resource request, unsupported extension, invalid camera/loop/duration, or missing prop before publishing ready."
    - "Mount resolves only after the first static frame is drawn. The session uses the request speed/camera/mirror values and reports finite clamped frame positions to the controller."
    - "Cap device pixel ratio at the benchmarked value, resize without layout feedback loops, pause RAF while hidden or paused, and recover to text fallback on context loss."
    - "Dispose all renderer-owned CPU/GPU/DOM/timer/listener/observer/object-URL resources exactly once. Unit tests inject controllable platform seams; physical evidence proves the real library path."
  pilot_harness:
    - "A compile-time animation-pilot mode bypasses normal onboarding only for the dedicated harness. The normal production mode contains no reachable pilot route, navigation item, or automatic renderer load."
    - "Use ExerciseAnimationPlayer with the public controller, selected renderer, public catalog mapping, and public storage source read. Do not duplicate controller or storage logic in UI."
    - "The harness accepts descriptor JSON and ZIP through explicit local file inputs, shows exact pack/version/hash/status, installs v1.0.0 and v1.0.1, rolls back, removes, and selects all 12 exact variants."
    - "No fetch, XMLHttpRequest, WebSocket, EventSource, CDN, remote font, remote model, analytics, or telemetry exists in the harness or renderer."
    - "The pilot PWA shell and selected renderer JavaScript may be precached. Descriptor, manifest, ZIP, GLB, source specs, benchmark traces, and evidence never enter public or the service-worker precache."
    - "The normal production App, active workout, update prompt, external video, and PWA update-deferral behavior remain byte-identical except for the compile-time-dead pilot branch in App.tsx."
  content_and_evidence_tooling:
    - "The asset tool materializes both releases into fresh ignored directories, invokes the accepted v1 builder without modifying it, validates semantic GLB content, and emits exact hashes/complexity inventories."
    - "content:validate and content:audit run the pilot mapping, source/license, semantic GLB, exact-count, and no-generated-output checks in addition to existing content checks."
    - "The evidence validator uses exact JSON schemas and fails missing samples, invented devices, duplicate run IDs, nonfinite metrics, budget failures, missing hashes/screenshots, unapproved reviews, or claims outside the measured environment."
    - "Evidence records command, candidate commit, tool/library versions, device model, hardware identifier class, RAM class, iOS/Safari build, viewport, DPR, battery health/level, brightness, ambient temperature, cache state, network state, sample timestamps, raw-file hashes, and reviewer identity without device serials or personal data."
  protected_boundaries:
    - "No personal IndexedDB table, APP_VERSIONS field, backup payload, custom exercise, routine, session, nutrition record, or historical snapshot changes during install, update, relaunch, rollback, or removal."
    - "No contract parser, builder, ZIP reader, OPFS backend/layout, animation controller, accessible shell, feature page, PWA update code, external-video code, or public asset changes."
    - "Default production build and service-worker audit must show zero pilot GLB/ZIP/descriptor/manifest/source/evidence bytes and zero rejected renderer candidate bytes."

release_offline_and_rollback_protocol:
  releases:
    - version: "1.0.0"
      role: "initial verified pilot"
    - version: "1.0.1"
      role: "rollback probe using the same matrix and a declared project-authored visible revision sentinel without changing motion identity"
  deterministic_reproduction:
    - "Build each version twice from separate clean temporary roots with the pinned Node/pnpm/builder/dependency state."
    - "For a given version, every generated GLB, canonical manifest, ZIP, and descriptor byte plus every SHA-256 must be identical across builds."
    - "Between versions, only reviewed release metadata and the declared sentinel may differ. The validator emits an exact expected-difference inventory."
  install_update_rollback:
    - "Install 1.0.0 and play all 12 exact entries; capture active identity and asset hashes."
    - "Attempt corrupt, wrong-size, wrong-hash, incompatible, interrupted, quota-failed, missing-license, and wrong-variant updates and prove 1.0.0 remains active."
    - "Install 1.0.1, prove it is active and 1.0.0 is previous, relaunch, then rollback and prove exact 1.0.0 identity/assets return while 1.0.1 becomes previous."
    - "Repeat rollback after network disable and cold PWA relaunch. Never search another pack/version/variant when either exact object is unavailable."
  offline_relaunch:
    - "Install the pilot PWA shell and pack while online or from local Files, successfully play every row once, then fully terminate it."
    - "Disable Wi-Fi and cellular data, preserve airplane/offline state, cold-launch the installed PWA from the Home Screen, recover the active OPFS journal, and play all 12 variants."
    - "Network instrumentation must record zero runtime request attempt during the offline launch/play sequence. Written bilingual fallback remains available for every variant and forced renderer failure."
    - "Repeat the full offline relaunch after update and after rollback."
  personal_data_proof:
    - "Seed representative profile, routine, program, active/completed sessions, custom variant, nutrition, pantry, plan, body metric, settings, and recovery data before lifecycle tests."
    - "Record canonical counts and hashes before and after install, failed updates, successful update, relaunch, rollback, and removal; every personal object remains byte-equivalent."
    - "Export/restore backup v5 before and after and prove animation pack bytes/references are absent and personal restore remains identical."

iphone_performance_gate:
  device_requirement:
    - "Use at least one physical low-end supported iPhone with A12/A13-class SoC and 3 GiB RAM, such as iPhone XR/XS or iPhone SE (2nd generation), not a simulator or desktop emulation."
    - "Run at least two independent complete chosen-renderer trials. Reset the app process and declared cache state between trials; record whether both trials use the same or different devices."
    - "Record exact device model, iOS build, Mobile Safari build, free storage, battery health, viewport/DPR, and measurement tooling. Omit serial, Apple ID, filenames containing personal data, and unrelated screen content."
  controlled_conditions:
    - "Screen brightness fixed at 50 percent, Low Power Mode off, unplugged, battery start 40-80 percent, ambient 20-26 C, no other foreground app, and the declared network state fixed per phase."
    - "Use Safari Web Inspector/Instruments or an equivalently reviewable physical-device tool for memory, energy, frame, and thermal evidence. Web timing alone cannot satisfy memory or thermal gates."
    - "Run every variant for 30 seconds and the mixed 12-variant endurance loop for 15 minutes. Include mount/dispose cycling and background/foreground once."
  budgets:
    archive_bytes_max: 25165824
    largest_asset_bytes_max: 4194304
    default_initial_graph_delta_bytes_max: 5120
    selected_renderer_lazy_chunk_gzip_bytes_max: 358400
    cold_first_frame_p95_ms_max: 2500
    cold_first_frame_single_sample_ms_max: 4000
    warm_first_frame_p95_ms_max: 1000
    warm_first_frame_single_sample_ms_max: 2000
    steady_median_fps_min: 30
    steady_p95_frame_time_ms_max: 50
    frames_over_100ms_percent_max: 1
    peak_process_memory_delta_mib_max: 160
    post_dispose_retained_memory_delta_mib_max: 30
    endurance_minutes: 15
    endurance_battery_drop_percentage_points_max: 6
    surface_temperature_delta_c_max: 8
    storage_three_archive_peak_multiplier_max: 3.1
  pass_rules:
    - "Every budget passes in both complete chosen-renderer trials; averaging cannot hide a failed trial or variant."
    - "No Safari/PWA reload, crash, WebGL context exhaustion, blank frame, runaway RAF, thermal warning, OS termination, animation drift, or unrecovered text fallback occurs."
    - "Thermal state remains nominal or fair. If the tool cannot expose thermal state, an external surface-temperature trace plus no-warning evidence is mandatory; neither may be marked not_applicable."
    - "Memory is measured after a consistent settling interval. Explicit GC is not assumed on iPhone; report both peak and retained deltas with the same method."
    - "If a budget is infeasible for a justified reason, stop and issue a new coordination decision. The producer may not relax, re-average, omit, or redefine it."
  accessibility_and_layout:
    - "Physical VoiceOver covers group, viewport, status, play/pause/replay/retry, seek value, static-reference text, failure text, focus order, and no focus theft."
    - "Physical reduced-motion preference proves no playback call and a usable static/text reference after relaunch."
    - "Capture 320 and 390 CSS-pixel responsive layouts with no horizontal scrolling, clipped controls, detached canvas, or sub-44-pixel target. Clearly distinguish responsive-mode evidence from physical-device evidence."
    - "Review contrast and both Vietnamese and English text; nutrition presentation remains untouched."

acceptance_tests:
  - id: "AP01R1-AC-01"
    requirement: "Lineage is base checkpoint -> packet-only coordinator commit -> one candidate commit -> handoff-only commit, and every changed path is authorized."
    evidence: "Git parent/range/name-only assertions, YAML parse, and clean worktree."
  - id: "AP01R1-AC-02"
    requirement: "The public catalog exposes exactly the locked 12 references over the 199 reviewed variants and returns no mapping for all other variants or near matches."
    evidence: "Catalog matrix test covering exact count, IDs, equipment/pattern characteristics, uniqueness, and 187 negative variants."
  - id: "AP01R1-AC-03"
    requirement: "Each release contains exactly 12 primary entries and 12 exact self-contained GLBs with the declared clips, props, cameras, loops, sources, licenses, and accessibility keys."
    evidence: "Semantic GLB inventory, v1 parser/builder output, and exact manifest audit."
  - id: "AP01R1-AC-04"
    requirement: "Every authored byte and renderer dependency is source-, license-, attribution-, modification-, review-, integrity-, and NOTICE-traceable with explicit offline redistribution rights."
    evidence: "License audit JSON, source records, copied license texts, THIRD_PARTY_NOTICES, package closure, and named reviewer approvals."
  - id: "AP01R1-AC-05"
    requirement: "Two clean materializations of each release produce identical GLB, manifest, ZIP, descriptor, byte-size, and SHA-256 results."
    evidence: "Reproducibility command plus exact file/hash manifests for 1.0.0 and 1.0.1."
  - id: "AP01R1-AC-06"
    requirement: "All pinned candidates run the same workload; hard gates and raw measurements select one renderer without unsupported claims."
    evidence: "Renderer benchmark JSON/CSV, candidate build reports, device comparison, scored matrix, and ADR 0019."
  - id: "AP01R1-AC-07"
    requirement: "The selected adapter parses verified bytes offline, draws before ready, honors exact clip/camera/mirror/speed/loop/reduced motion, reports frames, handles context loss, and disposes all resources."
    evidence: "Unit/browser tests, resource counters, ten-cycle leak trace, screenshots, and physical run."
  - id: "AP01R1-AC-08"
    requirement: "The storage source read returns only the exact active entry/asset/Blob and rejects wrong pack state, variant, animation, asset relation, cancellation, corruption, and case/equipment neighbors."
    evidence: "Focused store exact-source matrix plus unchanged storage regression suite."
  - id: "AP01R1-AC-09"
    requirement: "Install 1.0.0, failed-update retention, update to 1.0.1, relaunch, rollback to exact 1.0.0, second relaunch, and removal follow the accepted journal semantics."
    evidence: "Automated storage tests plus physical offline rollback log with exact pack/version/hash/generation."
  - id: "AP01R1-AC-10"
    requirement: "Network-disabled cold PWA relaunch plays all 12 installed variants from OPFS with zero runtime request attempt and usable bilingual fallback."
    evidence: "Two complete offline run records, network capture, per-variant state/timing, and rendered evidence."
  - id: "AP01R1-AC-11"
    requirement: "Install, failures, update, relaunch, rollback, and removal do not alter personal data or backup v5."
    evidence: "Seeded canonical before/after hashes/counts, backup round-trip, database version assertion, and pack-exclusion audit."
  - id: "AP01R1-AC-12"
    requirement: "Both complete physical low-end iPhone trials pass every first-frame, frame-time, memory, storage, battery, thermal, endurance, and disposal budget."
    evidence: "Validated device-runs JSON, raw timing/energy/memory/thermal exports, hashes, screenshots, and reviewer sign-off."
  - id: "AP01R1-AC-13"
    requirement: "VoiceOver, reduced motion, keyboard/native controls, 320/390 layout, contrast, fallback, and focus behavior pass within the measured evidence scope."
    evidence: "Physical VoiceOver checklist, responsive contact sheets, reduced-motion trace, and DOM tests."
  - id: "AP01R1-AC-14"
    requirement: "Visual review passes every exact variant/equipment gate, both mirrored unilateral presentations, prop attachment, loop continuity, and reviewed instructional clarity."
    evidence: "Named motion-review record and hashed start/mid/end contact sheets."
  - id: "AP01R1-AC-15"
    requirement: "The normal production app has no reachable pilot route, renderer execution, rejected candidate code, pack byte, or pack precache entry; active-workout update deferral and external video remain unchanged."
    evidence: "Default build manifest/chunk/precache audit, protected hashes, and existing App/Workout/PWA/media regression tests."
  - id: "AP01R1-AC-16"
    requirement: "Versions and protected boundaries remain app 0.7.0/database 5/backup 5/catalog 3/animation versions 1 with no contract, DB, backup, feature, public, video, or nutrition change."
    evidence: "Exact constants, Git object/tree checks, architecture audit, and backup/database tests."
  - id: "AP01R1-AC-17"
    requirement: "Focused tests, content validation/audit, lint, typecheck, architecture, default/pilot builds, affected verification, and full verification pass on immutable candidate bytes."
    evidence: "Exact command results and artifact hashes recorded in the handoff."
  - id: "AP01R1-AC-18"
    requirement: "The repository owner verifies the immutable candidate and complete evidence under ADR 0020, records APPROVED with merge_authorized true, and explicitly accepts any residual risks."
    evidence: "Schema-valid owner_verification in docs/ai/reviews/ANIMATION-PILOT-01-REV-01-handoff.yaml, committed only after the candidate; optional cold review is advisory and has no merge-gate effect."

