outcome:
  objective: "Produce and owner-verify a deterministic, licensed, 12-variant offline animation pilot; select a production renderer by reproducible comparison; prove exact mapping, install, relaunch, update, rollback, accessibility, and agreed low-end iPhone budgets before any 199-variant wave."
  user_visible_result: "No normal product route changes. A mode-gated installable pilot PWA can load reviewed sidecar/archive files, play the 12 exact variants from OPFS, and exercise update/rollback while offline."
  deliverables:
    - "Exactly 12 catalog references and exactly 12 primary pack entries matching the locked representative matrix."
    - "Project-authored declarative animation/prop sources, a deterministic GLB materializer, two reproducible release inputs, and v1.0.0/v1.0.1 descriptor-manifest-archive artifacts generated only under ignored output directories."
    - "Complete per-byte author/source/license/attribution/modification/review records plus dependency license texts and THIRD_PARTY_NOTICES updates."
    - "A same-assets benchmark of three pinned renderer candidates, raw desktop/device measurements, a scored selection, and ADR 0019 recording the winner and rejected alternatives."
    - "A production renderer adapter behind the FOUNDATION-05 interface, with exact clip/camera/mirror/speed/reduced-motion behavior and complete GPU/DOM/timer disposal."
    - "A storage-owned exact player-source read returning the active manifest entry, descriptor, and verified Blob without exposing OPFS or accepting a similar variant."
    - "A mode-gated PWA pilot harness using the public catalog, storage, media, and player boundaries, with no pilot pack byte in public assets or service-worker precache."
    - "Automated, visual, VoiceOver, offline relaunch, rollback, personal-data isolation, and two-run physical iPhone evidence validated against explicit budgets."
    - "One immutable candidate commit followed only by declared handoff and owner-verification metadata."
  non_goals:
    - "No production wave beyond these 12 entries and no animation mapping for the other 187 catalog variants."
    - "No CatalogPage, WorkoutPage, routine, plan, discovery, substitution, active-workout, or settings product integration."
    - "No new contract/schema/protocol/database/backup/app/catalog version and no reinterpretation of v1 bytes."
    - "No remote release index, authentication, CDN, analytics, telemetry, runtime fetch, upload, publishing, or service account."
    - "No third-party exercise model, Mixamo motion, scraped media, image/video/audio/font/texture download, generative asset service, or ownership-unclear byte."
    - "No pack ZIP, GLB, descriptor, manifest, or release output committed to public, bundled into the default app, or added to service-worker precache."
    - "No claim of medical advice, universal biomechanics, or coverage outside the reviewed pilot matrix and measured complexity envelope."
    - "No external-video behavior change; YouTube remains optional and online-only."

