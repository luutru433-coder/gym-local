stop_gates:
  - id: "F02-FIX-02-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, or the producer cannot verify the mandated invocation metadata."
    action: "Stop without substitution and write a BLOCKED FIX-02 handoff at the authorized handoff path."
  - id: "F02-FIX-02-STOP-02"
    condition: "The target branch, clean state, producer start HEAD, exact parent 9177484dbf67aec669747be8e0ea49e34173c6a4, ancestry, or exact two-file coordinator delta does not match execution.producer_start_rule."
    action: "Stop before implementation and write a BLOCKED handoff with exact branch, HEAD, parent, status, ancestry, and unexpected paths; do not clean, rebase, or amend."
  - id: "F02-FIX-02-STOP-03"
    condition: "Any dependency, package, lockfile, configuration, LICENSE, index.ts, documentation other than the new handoff, or other path outside authority.allowed_paths must change."
    action: "Stop without widening scope and write a BLOCKED handoff naming the required change."
  - id: "F02-FIX-02-STOP-04"
    condition: "Correctness requires storage, network lookup, media, app, catalog, backup, content, builder, fixture, archive, asset, PWA, hashing, authentication, renderer, or another owning module."
    action: "Stop and write a BLOCKED handoff; defer the change to its owning packet."
  - id: "F02-FIX-02-STOP-05"
    condition: "A URL fix would normalize an input into acceptance, add a new accepted URL form, redefine the existing canonical HTTPS contract, or require an ambiguous policy beyond strict control/serialization/encoded-structure rejection."
    action: "Stop and write a BLOCKED handoff describing the ambiguity; do not widen or reinterpret the contract."
  - id: "F02-FIX-02-STOP-06"
    condition: "Compatibility cannot handle the specified unknown comparison values without coercion, thrown exceptions, nondeterministic issue order, a public surface change, or weakening strict SemVer."
    action: "Stop and write a BLOCKED handoff with the exact unsafe runtime case; do not coerce or weaken validation."
  - id: "F02-FIX-02-STOP-07"
    condition: "The exact repository-standard MIT header cannot be applied to both authorized files without changing LICENSE or introducing a conflicting notice."
    action: "Stop and write a BLOCKED handoff with the conflicting policy evidence; do not invent or alter license terms."
  - id: "F02-FIX-02-STOP-08"
    condition: "Any prior seven-defect probe regresses, any new finding probe remains reproducible, or a stable ID/error/issue/version/public export/exact-variant invariant would change."
    action: "Stop and write a BLOCKED handoff; do not weaken prior behavior or widen scope to make checks pass."
  - id: "F02-FIX-02-STOP-09"
    condition: "The candidate contains anything beyond the two contract files, candidate parentage is not exact, or the post-candidate commit contains anything beyond the new FIX-02 handoff."
    action: "Stop without amending, cleanup, or additional commits and write a BLOCKED handoff if the authorized report remains the sole safe metadata change."
  - id: "F02-FIX-02-STOP-10"
    condition: "A non-circular candidate, handoff, metadata, or later cold-review attestation boundary would require the handoff to contain its own commit SHA or would leave an immutable endpoint unresolved."
    action: "Stop and write a BLOCKED handoff describing the evidence gap; do not use SELF, placeholders, or inferred commit identity."

