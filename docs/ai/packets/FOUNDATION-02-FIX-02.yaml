implementation_requirements:
  canonical_https:
    - "Treat sourceUrl and termsUrl as untrusted unknown input and continue to accept only absolute HTTPS URLs under the existing canonical v1 policy."
    - "Reject every literal control character before URL parsing or serialization checks; the regression must include a literal U+0000 appended after an otherwise valid path."
    - "Require the platform parser's exact canonical serialized URL to equal the supplied string byte-for-byte; do not accept a spelling that the URL parser changes, removes, inserts, case-normalizes, or resolves."
    - "Reject normalization-sensitive percent-encoded path delimiters and dot segments, case-insensitively, before they can be resolved or interpreted differently downstream; /%2e%2e/license must fail rather than normalize to /license."
    - "Reject uppercase or otherwise noncanonical bracketed IPv6 spellings such as https://[2001:DB8::1]/ even when URL parsing would lowercase or compress them."
    - "Apply one shared policy to source and license records and retain deterministic invalid_url codes and exact field paths."
    - "Preserve the already documented accepted lowercase DNS, non-default decimal port, query/fragment, and canonical lowercase bracketed IPv6 controls when their input already equals canonical serialization."
  compatibility_no_throw:
    - "Parse currentAppVersion and every minimumAppVersion used for comparison from unknown rather than assuming a JavaScript string at runtime."
    - "For Symbol, object, or null currentAppVersion, return a deterministic invalid_semver issue at [currentAppVersion] and never throw."
    - "For Symbol, object, or null descriptor.minimumAppVersion, return a deterministic invalid_semver issue at [descriptor, minimumAppVersion] and never throw."
    - "Do not stringify, coerce, trim, case-fold, or otherwise convert invalid comparison inputs."
    - "Preserve strict SemVer 2.0 precedence, arbitrarily large numeric components, existing descriptor/manifest identity diagnostics, deterministic issue order, plain-data JSON-lossless results, and valid-input success."
  license_headers:
    - "Replace the first comment block in both authorized files with the repository-standard four-line block naming Copyright (c) 2026 Gym Local contributors and SPDX-License-Identifier: MIT."
    - "Remove every MyCompany LLC, Apache License, Apache-2.0, and apache.org/licenses/LICENSE-2.0 reference from both authorized files."
    - "Do not edit LICENSE; the header correction must align to its existing MIT/Gym Local contributors text."

prior_seven_defect_probes:
  - "Sparse array holes at leading, interior, and trailing positions across all parser-owned arrays: exact issues, no throw, no mutation, deterministic and JSON-lossless results."
  - "Malformed declarations retain safe identities without false missing-reference issues while independent missing review/license/source/asset relations remain detectable."
  - "Manifest bound review uniquely resolves and equals the declared record across id, reviewer, reviewedAt, and status, including compatibility bypass probes."
  - "Negative zero fails across every zero-permitting numeric field while positive-zero controls remain JSON-lossless."
  - "Dates and RFC 3339 timestamps accept valid years 0001, 0004, and 0099 and reject leap, impossible-date, time, and year-zero boundaries."
  - "The governing packet/handoff contract remains non-circular, the historical failed handoff remains unchanged, and exact metadata SHA attestation remains assigned to the later cold review."
  - "The earlier malformed HTTPS bracket, authority, credential, hostname, empty/malformed/out-of-range port, and scheme matrix continues to fail for both source and license records while canonical controls pass."

acceptance_tests:
  - id: "F02-FIX-02-AC-01"
    requirement: "Both sourceUrl and termsUrl reject literal controls, normalization-sensitive encoded delimiters or dot segments, and any URL whose exact canonical serialization differs from its input."
    evidence: "Source-plus-license table tests include a literal U+0000 suffix, /%2e%2e/license and case variants, encoded delimiter cases, uppercase/noncanonical IPv6, and exact invalid_url paths with no throw."
  - id: "F02-FIX-02-AC-02"
    requirement: "The HTTPS correction preserves the existing accepted canonical contract and does not add normalization, coercion, network access, or a broader URL capability."
    evidence: "Positive source-plus-license controls cover lowercase DNS, a non-default canonical port, query/fragment, and canonical lowercase IPv6; repeated results are deterministic and input remains unchanged."
  - id: "F02-FIX-02-AC-03"
    requirement: "validateAnimationPackCompatibility returns deterministic plain invalid_semver results and never throws for Symbol, object, and null currentAppVersion values."
    evidence: "Unknown runtime-value matrix asserts no throw, exact [currentAppVersion] path, stable repeated equality, JSON round trip, and no input mutation."
  - id: "F02-FIX-02-AC-04"
    requirement: "validateAnimationPackCompatibility returns deterministic plain invalid_semver results and never throws for Symbol, object, and null descriptor.minimumAppVersion values."
    evidence: "Descriptor-value matrix asserts no throw, exact [descriptor, minimumAppVersion] path, stable repeated equality, JSON round trip, and no descriptor mutation."
  - id: "F02-FIX-02-AC-05"
    requirement: "Valid compatibility behavior remains strict SemVer 2.0, lossless for arbitrarily large components, fail-closed for unsupported versions, and exact for descriptor/manifest identity."
    evidence: "Existing valid, prerelease, large-number, incompatibility, mismatch, and exact-variant tests remain byte-for-byte meaningful and pass."
  - id: "F02-FIX-02-AC-06"
    requirement: "Both authorized files carry the exact repository-standard Gym Local contributors / SPDX MIT header and contain no MyCompany or Apache contradiction."
    evidence: "Header text assertions inspect both file prefixes, repository LICENSE, and absence of MyCompany LLC, Apache License, Apache-2.0, and apache.org license text."
  - id: "F02-FIX-02-AC-07"
    requirement: "All seven findings from the earlier FOUNDATION-02 cold review remain resolved under their full prior probe matrices."
    evidence: "The focused suite and explicit prior-seven cold-review probes all pass with deterministic, no-throw, no-mutation, JSON-lossless results."
  - id: "F02-FIX-02-AC-08"
    requirement: "All earlier FOUNDATION-02 and FOUNDATION-02-FIX-01 positive and negative behavior remains passing with no public export, stable code, version, cross-variant, or contract-meaning change."
    evidence: "Focused tests, scoped lint, typecheck, full pnpm run verify, index/public-boundary inspection, and exact candidate diff."
  - id: "F02-FIX-02-AC-09"
    requirement: "The candidate commit has the coordinator start commit as its exact parent and changes only animation-pack.ts and animation-pack.test.ts."
    evidence: "Exact git parent, name-only, stat, and diff-check assertions recorded in the handoff."
  - id: "F02-FIX-02-AC-10"
    requirement: "A separate direct-child metadata commit changes only FOUNDATION-02-FIX-02-handoff.yaml, which remains non-circular; the later independent cold review attests its exact SHA and range."
    evidence: "Candidate-to-metadata parent/name-only checks, parsed handoff with no self-SHA field, and later cold-review exact metadata attestation."

required_regression_tests:
  - "Source and license URL matrices both cover literal U+0000 after a valid path, /%2e%2e/license with percent-encoding case variants, normalization-sensitive encoded path delimiters, uppercase IPv6, and any other spelling the implementation specifically guards."
  - "URL failure results assert invalid_url at sourceUrl or termsUrl, no throw, deterministic repeat equality, JSON round-trip equality, and no mutation."
  - "Canonical URL success controls remain accepted only when the parser's serialized href equals the input exactly."
  - "Compatibility matrices cover Symbol, object, and null independently for currentAppVersion and descriptor.minimumAppVersion with exact invalid_semver paths, deterministic issue order, no throw, JSON round trip, and no mutation."
  - "Existing strict SemVer, prerelease precedence, arbitrarily large component, future-version, identity mismatch, review binding, and exact-variant probes continue to pass."
  - "All prior seven-defect regression matrices run again, not merely the three new tests."
  - "Both file prefixes match the exact repository-standard MIT SPDX header and forbidden placeholder/Apache strings are absent."

