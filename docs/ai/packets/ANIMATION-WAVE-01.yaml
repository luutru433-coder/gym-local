  selection_rationale:
    - "This finite first wave covers common push, pull, squat, lunge, hinge, isolation, and core patterns while keeping the production-quality workload to 18 assets rather than treating the remaining 187 as one deliverable."
    - "Dumbbell, barbell, cable, machine, trap-bar, bodyweight, bench, rack, fixed-bar, and platform geometry create useful equipment-fidelity coverage without reopening the renderer or storage architecture."
    - "chest_press__dumbbell versus chest_press__barbell, squat__bodyweight versus pilot squat__barbell, pull_up__bodyweight versus lat_pulldown__cable, and deadlift__trap_bar versus other hinge variants are deliberate negative-fallback boundaries."
    - "The matrix includes a few higher-risk anchors (trap-bar deadlift, machine leg curl, inclined bench, cable stations) but defers the other 169 variants so rights, fidelity, and size findings stay bounded."
