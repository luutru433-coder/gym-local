outcome:
  objective: "Produce and automatically verify exactly 18 rights-cleared, production-suitable animation assets for the declared Wave 01 exact variants, with two deterministic release descriptors over the same production payload and no runtime, catalog, contract, storage, backup, or UI change."
  user_visible_result: "No normal product route changes in this packet. Wave 01 contributes installable production pack content and reproducible release metadata for 18 exact variants; a later authorized integration packet may expose availability in product UI."
  deliverables:
    - "Exactly 18 non-pilot production GLB source assets, one immutable animation ID per exact variant, and no asset for the other 181 catalog variants."
    - "A per-asset provenance ledger containing exact HTTPS source URL, retrieved source content SHA-256, final asset SHA-256, author, license/terms URL, explicit offline redistribution and modification rights, attribution, modifications, and review record."
    - "Production suitability records and machine checks proving exact equipment props, clip, rig compatibility, finite motion tracks, self-contained payloads, and rejection of pilot fixtures, placeholders, synthetic stand-ins, external URIs, and cross-variant substitutions."
    - "Canonical tracked manifests and external release descriptors for gym-local.animation-production versions 1.0.0 and 1.0.1; generated ZIP archives stay under ignored outputs and out of public/PWA assets."
    - "Two clean isolated builds per release that reproduce asset, manifest, archive, and descriptor bytes and checksums exactly."
    - "Automated exact mapping, offline OPFS install/relaunch/update/rollback/remove, corruption/quota/error, cleanup, personal-data, backup-isolation, zero-network, renderer, PWA exclusion, and size/performance evidence."
    - "One immutable candidate commit followed by one handoff-only direct-child commit with automated PASS evidence."
  non_goals:
    - "No asset or mapping for the 12 pilot variants or the remaining 169 variants outside Wave 01."
    - "No promise that Wave 01 completes the 199-variant catalog and no implicit selection of Wave 02 or later scope."
    - "No @gym/catalog mapping addition, stable catalog ID change, alias, redirect, fuzzy match, case normalization, or equipment fallback."
    - "No renderer benchmark reopening, renderer dependency change, player/controller change, storage change, contract/schema/protocol change, database/migration change, backup change, route/UI change, or service-worker policy change."
    - "No remote index, CDN, runtime network dependency, external video change, upload, publication, analytics, or telemetry."
    - "No scraped, ownership-unclear, provider-restricted, marketplace-only, generative, pilot-fixture-derived, generated-placeholder, or synthetic stand-in asset."
    - "No release ZIP, generated staging tree, cache, or output directory tracked in Git or copied into public or the service-worker precache."
    - "No claim that optional human, cold, owner, independent-review, legal, visual, biomechanics, VoiceOver, manual, or physical-device evidence ran."

