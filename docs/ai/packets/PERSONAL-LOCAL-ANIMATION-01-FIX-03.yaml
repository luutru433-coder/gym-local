stop_gates:
  - id: "PLA01-FIX-03-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, the worktree is dirty, branch/parent/coordinator delta is wrong, required reads are incomplete, prior lineage cannot be resolved, or a locked version differs."
    action: "Stop before implementation and write a BLOCKED handoff only if it can be the sole authorized metadata change. Do not substitute a model, clean user work, amend, rebase, or widen scope."
  - id: "PLA01-FIX-03-STOP-02"
    condition: "A deterministic fix requires any path outside the three candidate files, including animation-pilot assets, package scripts, global test setup, runner/configuration, product code, NutritionPage, or tracked evidence."
    action: "Stop BLOCKED and report the exact owning path and separate packet needed. Do not widen this fixer."
  - id: "PLA01-FIX-03-STOP-03"
    condition: "Any test or ordinary default build still writes, deletes, truncates, renames, stages, locks, or otherwise mutates a docs/ai/evidence path, or correctness depends on restoring tracked bytes after execution."
    action: "Stop FAIL. Preserve the dirty state for the handoff record; do not restore, delete, ignore, or normalize the evidence."
  - id: "PLA01-FIX-03-STOP-04"
    condition: "A historical evidence byte would change, or the proposed repair deletes, untracks, ignores, rewrites, or regenerates historical evidence without a separately authorized deterministic regenerated-byte contract."
    action: "Stop BLOCKED or FAIL as appropriate. Historical evidence is immutable in this packet."
  - id: "PLA01-FIX-03-STOP-05"
    condition: "A caller-supplied output root can resolve to a tracked path, repository root, foreign/pre-existing path, shared deletable root, or another invocation's root; ownership ends before the last read; or cleanup is not guaranteed and limited to the exact owned root."
    action: "Stop FAIL; unsafe output handling cannot authorize merge."
  - id: "PLA01-FIX-03-STOP-06"
    condition: "The repair uses timeout/budget padding, retry, rerun-on-failure, sleep/backoff, polling delay, skip/only/todo, failure swallowing, removed/weakened assertions, reduced workers, disabled file parallelism, suite serialization, changed pool/configuration, hidden dirty-state cleanup, or dependence on pre-existing generated output."
    action: "Stop FAIL; the evidence isolation failure remains unresolved."
  - id: "PLA01-FIX-03-STOP-07"
    condition: "The benchmark reduces or mocks the two-release, 12-variant, ten-cycle real renderer workload; changes pinned candidates, operation counts, score vector, three-direct selection, timing policy, zero-network behavior, disposal/leak derivation, or deterministic bytes; or replaces operation-derived evidence with literals."
    action: "Stop FAIL; output isolation cannot weaken the animation-pilot release gate."
  - id: "PLA01-FIX-03-STOP-08"
    condition: "Candidate bcc3a88f's NutritionPage source/test bytes or regression semantics change, Vietnamese-only nutrition changes, or any personal-local/release contract, storage, media, Settings, backup, exact-variant, zero-egress, personal data, source/license/provenance, offline, build/precache, module-boundary, or active-workout PWA invariant changes."
    action: "Stop FAIL, record the protected-object or behavioral difference, and do not authorize merge."
  - id: "PLA01-FIX-03-STOP-09"
    condition: "The base-failing/candidate-passing regression is absent, can pass while a test touches tracked evidence, does not verify temporary report bytes and cleanup, or the repeat/parallel/build/full-verify matrix does not begin clean and finish clean by construction."
    action: "Stop FAIL; a single clean rerun or repository-wide status assertion is insufficient."
  - id: "PLA01-FIX-03-STOP-10"
    condition: "Any of the 30 required commands or an iteration fails or is not run; a failed command is retried; pnpm run verify is interrupted or split; an unexpected path changes; the candidate is empty or mutates; temporary state remains; optional evidence is invented; or the handoff is schema-invalid."
    action: "Record FAIL or BLOCKED with merge_authorized false. Do not amend or replace the candidate, merge, tag, push, update the coordinator ledger, or clean/restore failed-command state."

handoff:
  report_path: "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-FIX-03-handoff.yaml"
  candidate_commit_excludes_handoff_and_verification_metadata: true
  post_candidate_metadata_paths:
