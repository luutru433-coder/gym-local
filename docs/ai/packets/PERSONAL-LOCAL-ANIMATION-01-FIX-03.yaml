  metadata_commit_rule: "For PASS or post-candidate FAIL, add and commit only the FIX-03 handoff as the immutable candidate's direct child. For pre-candidate BLOCKED, add and commit only the handoff as the producer start commit's direct child. Never amend or replace any prior artifact or the FIX-03 candidate, and never name the handoff's own metadata commit inside the handoff."
  required_fields:
    - "schema_version"
    - "packet_id"
    - "status"
    - "producer_model"
    - "model_gate_evidence"
    - "subagents_used"
    - "base_commit"
