  candidate_mode_rule: "candidate_mode is exactly deterministic_fix for PASS. It requires a non-empty candidate, proved cause, base-failing/candidate-passing regression, and diff limited to authority.candidate_paths. Pre-candidate BLOCKED uses candidate_commit null and candidate_mode blocked_before_candidate. Empty or verification_only candidates are forbidden."
  disclosure_rule: "Retain the disclosure that personal-local imports are unreviewed device-only material, absent from backup and transfer, and never eligible for distribution; strict release-grade source/license/provenance evidence remains mandatory for every committed or distributable byte."

automated_verification:
  required: true
  record_location: "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-FIX-03-handoff.yaml#automated_verification"
  schema:
    schema_version: 1
    packet_id: "PERSONAL-LOCAL-ANIMATION-01-FIX-03"
    candidate_commit: "40-character SHA or null only for pre-candidate BLOCKED"
    status: "PASS|FAIL|BLOCKED"
    checks:
      - command: "exact required command"
        result: "pass|fail|not_run"
        evidence: "exact output or immutable artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only PASS with all 30 required commands recorded exactly once as pass, candidate_mode deterministic_fix, a non-empty immutable candidate, base-failing/candidate-passing output-isolation regression, byte-identical tracked evidence, safe cleaned temporary roots, preserved FIX-02 NutritionPage bytes, all stress/build/three full-verify iterations passed without retry, and no active stop gate may set merge_authorized true. FAIL or BLOCKED always sets merge_authorized false."
  optional_evidence_rule: "Cold, owner, independent, legal, visual, biomechanics, manual, named-reviewer, VoiceOver, and physical-device review are optional evidence only. They never complete, block, or authorize the candidate, and an unperformed optional check is never reported as passed."

optional_evidence:
  cold_review: "optional; no gate effect"
  owner_review: "optional; no gate effect"
  independent_review: "optional; no gate effect"
  named_reviewers: "optional; no gate effect"
  manual_review: "optional; no gate effect"
  physical_device_review: "optional; no gate effect"
  reporting_rule: "Keep optional_manual_evidence empty unless evidence was actually supplied. Never infer or claim PASS for an unperformed optional check."

merge:
  allowed_only_after: "automated_verification.status == PASS, all 30 exact automated command records are pass, candidate_mode is deterministic_fix, the candidate is non-empty, tracked evidence is byte-identical, no stop gate is active, and automated_verification.merge_authorized == true"
  target: "main"
  method: "fast-forward"
  squash_policy: "forbidden"
  checkpoint_tag_after_merge: "checkpoint/personal-local-animation-01-fix-03-automated-pass"
  automated_checkpoint_rule: "Only after a PASS fast-forward merge, record the complete original-plus-FIX-01-plus-FIX-02-plus-FIX-03 lineage and automated result in docs/ai/reviews/coordinator-ledger.yaml in a separate coordinator checkpoint commit, then create checkpoint/personal-local-animation-01-fix-03-automated-pass. Never create or reuse an earlier personal-local checkpoint tag for this lineage."
  next_packet_rule: "No downstream packet may consume the personal-local API until checkpoint/personal-local-animation-01-fix-03-automated-pass exists. Any later WORKOUT-INTEGRATION packet must preserve exact variant identity, release-pack separation, zero egress, backup exclusion, and active-workout PWA update deferral."
  producer_instruction: "Start from the packet-only coordinator commit, use gpt-5.6-sol with no subagents, preserve bcc3a88f's NutritionPage correction byte-for-byte, implement only the three authorized output-isolation files, create one non-empty immutable candidate, run all 30 commands in order without retry or cleanup, and create only the direct-child handoff commit. Do not merge, tag, push, amend history, or update the ledger."
  current_coordinator_task_prohibitions:
    - "Do not implement the evidence isolation fix."
    - "Do not create a FIX-03 candidate or handoff."
    - "Do not amend or replace any prior packet, candidate, or handoff."
    - "Do not rewrite, delete, untrack, or ignore historical evidence."
    - "Do not merge main."
    - "Do not push."
    - "Do not update docs/ai/reviews/coordinator-ledger.yaml."
    - "Do not create any checkpoint tag."
