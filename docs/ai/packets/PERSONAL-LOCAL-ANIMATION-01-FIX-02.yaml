stop_gates:
  - id: "PLA01-FIX-02-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, the worktree is dirty, branch/parent/coordinator delta is wrong, required reads are incomplete, prior lineage cannot be resolved, or a locked version differs."
    action: "Stop before implementation and write a BLOCKED handoff only if it can be the sole authorized metadata change. Do not substitute a model, clean user work, amend, rebase, or widen scope."
  - id: "PLA01-FIX-02-STOP-02"
    condition: "A deterministic cause cannot be established with profiling and a cause-specific regression, the only available candidate would be empty or verification-only, or the failure can be addressed only by timing margin."
    action: "Stop BLOCKED before candidate creation and report the exact diagnostic gap. Do not create another empty candidate or claim ambient flakiness."
  - id: "PLA01-FIX-02-STOP-03"
    condition: "The proved cause requires a path outside the component, its test, or the explicitly named colocated test-support file, including a shared UI component, store, package, runner, configuration, dependency, lockfile, or global test setup."
    action: "Stop BLOCKED and report the exact owning path and packet needed. Do not widen this fixer or copy unrelated production code into test support."
  - id: "PLA01-FIX-02-STOP-04"
    condition: "A proposed correction increases a timeout or budget, sleeps, polls by delay, retries, reruns a failure, skips or filters coverage, uses only/todo, removes or weakens an assertion, swallows an error, fakes completion, reduces workers, disables file parallelism, serializes the suite, changes global Vitest/Vite/package configuration, splits verify to avoid its topology, or uses a wall-clock threshold as its sole regression proof."
    action: "Stop FAIL. Preserve the failure and do not authorize merge."
  - id: "PLA01-FIX-02-STOP-05"
    condition: "A test helper or mock bypasses the recipe flow, ingredient snapshot semantics, pack update behavior, Vietnamese presentation, store reset, async settlement, render cleanup, or the specific work identified as the cause."
    action: "Stop FAIL. The regression must exercise the cause and retain product behavior coverage."
  - id: "PLA01-FIX-02-STOP-06"
    condition: "Any correction changes user-visible nutrition behavior, introduces English nutrition presentation, permits stored nutrition snapshots to be rewritten, or changes a nutrition formula, provider, pack, persistence, schema, route, or API boundary."
    action: "Stop FAIL and preserve the Vietnamese-only nutrition boundary, informational/editable guidance, and immutable snapshots."
  - id: "PLA01-FIX-02-STOP-07"
    condition: "Any personal-local/release contract, storage, media, Settings behavior, exact-variant rule, zero-egress rule, backup exclusion, personal data, source/license/provenance gate, asset/content, build/precache behavior, or active-workout PWA deferral changes."
    action: "Stop FAIL, record the protected-path difference, and do not authorize merge."
  - id: "PLA01-FIX-02-STOP-08"
    condition: "Any focused, stress, verify:affected, or full-verify command or iteration fails or is not run; a failed iteration is retried; pnpm run verify is interrupted or split; an unexpected path changes; the candidate is empty or mutates during verification; temporary diagnostics remain; the worktree is dirty; optional evidence is invented; or the handoff is schema-invalid."
    action: "Record FAIL or BLOCKED with merge_authorized false. Do not amend or replace the candidate, merge, push, update the coordinator ledger, or create a checkpoint tag."

handoff:
  report_path: "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-FIX-02-handoff.yaml"
  candidate_commit_excludes_handoff_and_verification_metadata: true
  post_candidate_metadata_paths:
    - "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-FIX-02-handoff.yaml"
  metadata_commit_rule: "For PASS or post-candidate FAIL, add and commit only the FIX-02 handoff as the immutable candidate's direct child. For pre-candidate BLOCKED, add and commit only the handoff as the producer start commit's direct child. Never amend or replace any prior artifact or the FIX-02 candidate, and never name the handoff's own metadata commit inside the handoff."
  required_fields:
    - "schema_version"
    - "packet_id"
    - "status"
    - "producer_model"
    - "model_gate_evidence"
    - "subagents_used"
    - "base_commit"
    - "original_candidate_commit"
    - "original_handoff_commit"
    - "fix_01_coordinator_commit"
    - "fix_01_candidate_commit"
    - "fix_01_handoff_commit"
    - "producer_start_commit"
    - "candidate_parent_commit"
    - "candidate_commit"
    - "candidate_mode"
    - "branch"
    - "changed_paths"
    - "diagnostic_and_profiling_evidence"
    - "deterministic_cause"
    - "base_candidate_regression_evidence"
    - "finding_resolution"
    - "nutrition_behavior_evidence"
    - "stress_evidence"
    - "personal_local_release_backup_exact_variant_zero_egress_pwa_evidence"
    - "acceptance_evidence"
    - "checks"
    - "protected_path_audit"
    - "known_risks"
    - "optional_evidence"
    - "automated_verification"
    - "review_target"
  prohibited_fields:
    - "handoff_commit"
    - "metadata_commit"
    - "self_sha"
  candidate_mode_rule: "candidate_mode is exactly deterministic_fix for PASS. It requires a non-empty candidate, proved cause, base-failing/candidate-passing regression, and diff limited to authority.candidate_paths. Pre-candidate BLOCKED uses candidate_commit null and candidate_mode blocked_before_candidate. verification_only and empty candidates are forbidden."
  disclosure_rule: "Retain the disclosure that personal-local imports are unreviewed device-only material, absent from backup and transfer, and never eligible for distribution; strict release-grade source/license/provenance evidence remains mandatory for every committed or distributable byte."

automated_verification:
  required: true
  record_location: "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-FIX-02-handoff.yaml#automated_verification"
  schema:
    schema_version: 1
    packet_id: "PERSONAL-LOCAL-ANIMATION-01-FIX-02"
    candidate_commit: "40-character SHA or null only for pre-candidate BLOCKED"
    status: "PASS|FAIL|BLOCKED"
    checks:
      - command: "exact required command"
        result: "pass|fail|not_run"
        evidence: "exact output or immutable artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only PASS with all 26 required commands recorded exactly once as pass, candidate_mode deterministic_fix, a non-empty immutable candidate, proved profiling-supported cause, base-failing/candidate-passing deterministic regression, all stress and three full-verify iterations passed without retry, byte-identical protected paths, and no active stop gate may set merge_authorized true. FAIL or BLOCKED always sets merge_authorized false."
  optional_evidence_rule: "Cold, owner, independent, legal, visual, biomechanics, manual, named-reviewer, VoiceOver, and physical-device review are optional evidence only. They never complete, block, or authorize the candidate, and an unperformed optional check is never reported as passed."

optional_evidence:
  cold_review: "optional; no gate effect"
  owner_review: "optional; no gate effect"
  independent_review: "optional; no gate effect"
  named_reviewers: "optional; no gate effect"
  manual_review: "optional; no gate effect"
  physical_device_review: "optional; no gate effect"
  reporting_rule: "Keep optional_manual_evidence empty unless evidence was actually supplied. Never infer or claim PASS for an unperformed optional check."

merge:
  allowed_only_after: "automated_verification.status == PASS, all 26 exact automated command records are pass, candidate_mode is deterministic_fix, the candidate is non-empty, no stop gate is active, and automated_verification.merge_authorized == true"
  target: "main"
  method: "fast-forward"
  squash_policy: "forbidden"
  checkpoint_tag_after_merge: "checkpoint/personal-local-animation-01-fix-02-automated-pass"
  automated_checkpoint_rule: "Only after a PASS fast-forward merge, record the complete original-plus-FIX-01-plus-FIX-02 lineage and automated result in docs/ai/reviews/coordinator-ledger.yaml in a separate coordinator checkpoint commit, then create checkpoint/personal-local-animation-01-fix-02-automated-pass. Never create or reuse either earlier personal-local checkpoint tag for this lineage."
  next_packet_rule: "No downstream packet may consume the personal-local API until checkpoint/personal-local-animation-01-fix-02-automated-pass exists. Any later WORKOUT-INTEGRATION packet must preserve exact variant identity, release-pack separation, zero egress, backup exclusion, and active-workout PWA update deferral."
  current_coordinator_task_prohibitions:
    - "Do not diagnose or implement the timeout fix."
    - "Do not create a FIX-02 candidate or handoff."
    - "Do not amend or replace any prior packet, candidate, or handoff."
    - "Do not merge main."
    - "Do not push."
    - "Do not update docs/ai/reviews/coordinator-ledger.yaml."
    - "Do not create any checkpoint tag."
