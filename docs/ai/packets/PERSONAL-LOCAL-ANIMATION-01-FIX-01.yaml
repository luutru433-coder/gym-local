        evidence: "exact output or immutable artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only PASS with all 22 required commands recorded exactly once as pass, the exact immutable candidate, a valid candidate_mode, complete repeat/stress evidence, one uninterrupted full pnpm run verify pass, byte-identical protected paths, and no active stop gate may set merge_authorized true. FAIL or BLOCKED always sets merge_authorized false."
  optional_evidence_rule: "Cold, owner, independent, legal, visual, biomechanics, manual, named-reviewer, VoiceOver, and physical-device review are optional evidence only. They never complete, block, or authorize the candidate, and an unperformed optional check is never reported as passed."

optional_evidence:
