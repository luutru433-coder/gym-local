    - "One immutable candidate followed by one direct-child handoff-only commit."
  non_goals:
    - "No timeout increase, testTimeout or hookTimeout change, sleep, polling delay, retry, rerun-on-failure policy, skip, only, todo, assertion removal, swallowed error, fake pass, or timing-based workaround."
    - "No disabling file parallelism, reducing the repository's worker count, serializing the full suite, splitting pnpm run verify to avoid the failing topology, or changing Vitest/Vite/package configuration."
    - "No nutrition feature, formula, provider, pack, schema, snapshot, database, backup, catalog, route, copy, or locale change."
