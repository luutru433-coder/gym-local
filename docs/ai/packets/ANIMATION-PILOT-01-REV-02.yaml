implementation_requirements:
  assets_and_provenance:
    - "All geometry, rig, keyframes, materials, and props derive deterministically from committed project-authored declarative source."
    - "No downloaded, scraped, traced, marketplace, generative, texture, font, image, audio, or opaque asset byte is allowed."
    - "Each source and release sentinel records repository source path, author Gym Local contributors, MIT terms, offline redistribution, attribution, modifications, deterministic automation ID, and date."
    - "Materialize releases 1.0.0 and 1.0.1 twice in separate ignored roots and prove byte-identical assets/manifests/archives/descriptors per version."
  catalog_and_storage:
    - "Export an immutable 12-record mapping through public @gym/catalog without changing the 199-variant catalog seeds or catalog version."
    - "Add a public @gym/storage exact active-source read returning the parsed entry, asset descriptor, and verified Blob for the exact variant and animation only."
    - "Reject inactive/wrong pack, wrong version, case neighbor, equipment neighbor, entry/asset/path/size/hash/media/source/license mismatch, corruption, and cancellation without journal mutation."
  renderer:
    - "Implement only the automated benchmark winner in packages/media/src/gltf-renderer.ts and export it through public @gym/media."
    - "Draw the first static frame before ready; enforce exact clip/camera/mirror/speed/loop/reduced-motion semantics and bounded Blob reads."
    - "Pause work while hidden or paused, recover to text fallback on context loss, and dispose every owned CPU/GPU/DOM/timer/listener resource exactly once."
  pilot_harness:
    - "Use a compile-time pilot mode with local descriptor/ZIP file inputs, exact status, install/update/rollback/remove controls, and all 12 mappings."
    - "Normal production mode has no reachable pilot route or automatic renderer load; only compile-time-dead App composition may differ."
    - "No fetch, XHR, WebSocket, EventSource, CDN, remote font/model, analytics, or telemetry."
    - "No pack/source/evidence byte enters public, the default bundle, or service-worker precache."
  automated_evidence:
    - "Validate semantic GLB structure, exact counts/relations, deterministic hashes, license closure, renderer score, storage lifecycle, offline behavior, personal-data hashes, backup exclusion, responsive DOM/CSS, reduced motion, disposal counters, default/pilot bundles and precache."
    - "Record optional manual/device evidence as an empty list unless actually supplied; never claim it ran."

