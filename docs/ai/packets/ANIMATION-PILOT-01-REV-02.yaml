stop_gates:
  - id: "AP01R2-STOP-01"
    condition: "Required model, no-subagent rule, base/checkpoint/parent, target branch, cleanliness, required reads, locked versions, catalog counts, or protected baseline does not match."
    action: "Stop before implementation and write a BLOCKED handoff."
  - id: "AP01R2-STOP-02"
    condition: "A source or byte is scraped, externally generated, ownership-unclear, lacks machine-valid license/provenance/redistribution metadata, or a pinned dependency integrity/license differs."
    action: "Exclude it; stop BLOCKED if the exact matrix or renderer closure cannot be completed."
  - id: "AP01R2-STOP-03"
    condition: "Correctness needs a contract/schema/version/DB/backup/controller/shell/feature/PWA-update/public-asset change or another unlisted path."
    action: "Stop and issue a separate scoped packet; never widen this packet."
  - id: "AP01R2-STOP-04"
    condition: "Exact IDs/counts/relations fail, any lookup falls back across case/equipment/variant/version, or generated GLB is external, invalid, oversized, semantically incomplete, or non-deterministic."
    action: "Repair only authorized source/tooling or stop with exact failing IDs and hashes."
  - id: "AP01R2-STOP-05"
    condition: "No renderer passes the automated hard gates, workloads are incomparable, selection is non-deterministic, or disposal leaks remain."
    action: "Stop without selecting a renderer or runtime dependency."
  - id: "AP01R2-STOP-06"
    condition: "Install/update/failure/relaunch/rollback/remove loses exact journal identity, mutates personal/backup data, attempts runtime network, or pack bytes enter public/default/precache output."
    action: "Stop at the last safe state; do not weaken safety assertions."
  - id: "AP01R2-STOP-07"
    condition: "A required automated check fails or is not run, evidence is missing/nonfinite/circular, an unexpected path changes, or candidate/handoff lineage cannot be preserved."
    action: "Record FAIL or BLOCKED with merge_authorized false; do not invent evidence or merge."

handoff:
  report_path: "docs/ai/reviews/ANIMATION-PILOT-01-REV-02-handoff.yaml"
  candidate_commit_excludes_handoff_and_verification_metadata: true
  post_candidate_metadata_paths:
    - "docs/ai/reviews/ANIMATION-PILOT-01-REV-02-handoff.yaml"
  metadata_commit_rule: "After candidate_commit only report_path may change before merge; the handoff names the candidate but not its own commit."
  required_fields:
    - "schema_version"
    - "packet_id"
    - "status"
    - "producer_model"
    - "subagents_used"
    - "base_commit"
    - "coordinator_commit"
    - "candidate_commit"
    - "branch"
    - "changed_paths"
    - "versions"
    - "variant_matrix"
    - "release_artifacts"
    - "renderer_selection"
    - "dependency_and_license_evidence"
    - "acceptance_evidence"
    - "checks"
    - "protected_path_audit"
    - "known_risks"
    - "optional_evidence"
    - "automated_verification"
    - "review_target"

automated_verification:
  required: true
  record_location: "docs/ai/reviews/ANIMATION-PILOT-01-REV-02-handoff.yaml#automated_verification"
  schema:
    schema_version: 1
    packet_id: "ANIMATION-PILOT-01-REV-02"
    candidate_commit: "40-character SHA"
    status: "PASS|FAIL|BLOCKED"
    checks:
      - command: "exact required command"
        result: "pass|fail|not_run"
        evidence: "exact output or immutable artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only PASS with every required automated command recorded pass and no active safety stop gate may set merge_authorized true."

optional_evidence:
  cold_owner_independent_named_manual_device_reviews: "optional; no gate effect"
  reporting_rule: "Keep optional_manual_evidence empty unless supplied; never infer or claim execution."

merge:
  allowed_only_after: "automated_verification.status == PASS and every required automated command == pass and automated_verification.merge_authorized == true"
  target: "main"
  method: "fast-forward"
  checkpoint_tag_after_merge: "checkpoint/animation-pilot-01-rev-02-automated-pass"
  next_packet_gate: "No ANIMATION-WAVE packet until this checkpoint exists and measured automated license/complexity constraints are carried forward."
