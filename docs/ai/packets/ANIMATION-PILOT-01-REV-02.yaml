outcome:
  objective: "Produce and automatically verify a deterministic, licensed, 12-variant offline animation pilot before any production animation wave."
  user_visible_result: "Normal product routes remain unchanged. A compile-time pilot PWA installs local reviewed-format archives, loads exact variants from OPFS, renders offline, updates, rolls back, and removes the pack."
  deliverables:
    - "Exactly 12 immutable catalog references and 12 primary entries for each of releases 1.0.0 and 1.0.1."
    - "Project-authored declarative geometry, rig, motion, and prop sources plus a deterministic self-contained GLB materializer."
    - "Machine-valid source, MIT license, attribution, modification, redistribution, provenance, and compatibility review-field metadata for every generated byte."
    - "Reproducible GLB, manifest, ZIP, and descriptor bytes from two clean builds per release; generated release binaries remain ignored."
    - "Comparable automated desktop benchmarks for all pinned candidates and a deterministic winner recorded in ADR 0019."
    - "Production renderer adapter, exact storage source read, and mode-gated pilot PWA behind public module entry points."
    - "Automated exact-mapping, failure, offline, rollback, personal-data, backup, accessibility, responsive, disposal, bundle, precache, and performance evidence."
    - "One immutable candidate commit followed only by the handoff/automated-verification metadata commit."
  non_goals:
    - "No mapping or production animation for the other 187 variants."
    - "No normal CatalogPage, WorkoutPage, routine, plan, discovery, settings, or active-workout integration."
    - "No contract, schema, protocol, database, backup, app, or catalog version change."
    - "No remote index, CDN, runtime network, analytics, telemetry, upload, or publication."
    - "No third-party, scraped, traced, marketplace, generative, or ownership-unclear exercise asset."
    - "No release GLB, ZIP, manifest, or descriptor committed to public or service-worker precache."
    - "No claim that optional human, VoiceOver, visual, biomechanics, legal, or physical-device evidence ran."

decisions:
  contract_or_schema_change: "none"
  public_in_process_api_change: "Additive catalog mapping, storage exact-source read, and media renderer adapter only."
  version_decisions:
    - "Keep all locked_versions unchanged."
    - "Use immutable packId gym-local.animation-pilot-01 and releases 1.0.0 and 1.0.1."
  migration_or_rollback: "No migration; exercise the accepted active/previous OPFS journal."
  source_or_license_impact: "bundled_assets"
  review_compatibility_fields: "Populate existing required review-named contract fields with deterministic automation record IDs and dates; do not imply a human review."

