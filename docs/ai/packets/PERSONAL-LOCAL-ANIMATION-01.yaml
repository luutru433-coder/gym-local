  assumptions:
    - "Gym Local remains single-profile and account-free. Device/profile means the current browser origin storage for that one local profile; it is not a cloud, account, or cross-device identity."
    - "A user's personal or non-commercial intent is not redistribution permission. Local import eligibility never makes bytes eligible for Git, a release pack, backup, export, sync, upload, or publication."
