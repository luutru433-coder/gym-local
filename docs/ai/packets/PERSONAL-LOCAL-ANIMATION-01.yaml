    - "assert release pack contracts, validators, source/license/provenance gates, storage, builders, content, Wave 01 packet/handoff, source-acquisition packet, backup implementation, Vite PWA policy, and renderer implementation are byte-identical to e51e2661f5ea8562a84fedade5c31e0ef157e3a4"
    - "parse every YAML file under docs/ai and validate the handoff required fields, exact command records, candidate SHA, optional_manual_evidence, status, and merge_authorized consistency"
    - "assert candidate_commit remains unchanged before and after all post-candidate commands and git status --porcelain is empty"
  execution_rule: "Run commands 1 and 2 at preflight. After implementation, generate only deterministic metadata evidence and create the immutable candidate. Run commands 3 through 18 in order against that exact candidate with external network disabled. A failure, not_run result, candidate mutation, unexpected path, egress attempt, asset byte in Git/build/backup/cache, or release-gate change prevents PASS."
  evidence_paths:
    - "docs/adr/0022-personal-local-animation-imports.md"
    - "docs/ai/evidence/PERSONAL-LOCAL-ANIMATION-01/automated-report.json"
    - "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-handoff.yaml"
  optional_manual_or_device_checks: []

stop_gates:
  - id: "PLA01-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, the base/branch/parent/coordinator delta is wrong, required reads are incomplete, locked versions differ, or the worktree is dirty before implementation."
    action: "Stop before implementation and write a BLOCKED handoff only if the report path is the sole safe metadata change. Do not widen scope."
  - id: "PLA01-STOP-02"
    condition: "Correctness requires changing a release pack contract, source/license/provenance rule, production content, catalog mapping, stable release ID, release storage journal, builder, content validator, Wave 01 artifact, backup format, database schema, migration, renderer dependency, PWA policy, active-workout production UI, dependency, lockfile, configuration, or any unlisted path."
    action: "Stop BLOCKED and request a separate packet. Do not alter or reinterpret the protected release trust domain."
  - id: "PLA01-STOP-03"
    condition: "Any implementation path can export, download, share, upload, sync, telemeter, fetch, remotely import, publish, cache in CacheStorage, include in backup, copy into public/content/dist inputs, feed a release builder, or otherwise move personal-local bytes or metadata off the current origin storage."
    action: "Stop FAIL. Remove no evidence, do not claim a local-only lane, and do not authorize merge."
  - id: "PLA01-STOP-04"
    condition: "Any GLB is accepted without bounded structural validation, self-containment, byte-size and SHA-256 verification, exact one-clip metadata, atomic staging, or rejection of external URIs, unsafe extensions, corrupt/truncated/trailing payload, or quota/interruption failure."
    action: "Stop FAIL and preserve the failing synthetic case in source-only test form. Do not add a binary fixture."
  - id: "PLA01-STOP-05"
    condition: "A local source can be selected through aliasing, normalization, fuzzy matching, a neighboring equipment variant, catalog mutation, release-ID reuse, implicit precedence, or any request whose local animation ID and exact variant do not both match."
    action: "Stop FAIL. Do not substitute or weaken exact identity."
  - id: "PLA01-STOP-06"
    condition: "UI, media, contracts, or another module accesses IndexedDB or OPFS directly; storage imports catalog, media, UI, or app code; media imports storage; or modules bypass public @gym entry points."
    action: "Stop FAIL for a module-boundary violation. Do not add an exception."
  - id: "PLA01-STOP-07"
    condition: "Import, activation, recovery, removal, backup, or update handling mutates personal data, an installed release pack, routine/session/history/PR data, or activates a PWA update during an active workout."
    action: "Stop FAIL with before/after hashes, counts, and the exact failing phase."
  - id: "PLA01-STOP-08"
    condition: "Any required automated command fails or is not run, an evidence file is missing or schema-invalid, candidate/handoff lineage is wrong, an unexpected path changes, optional evidence is invented, or the candidate changes during verification."
    action: "Record FAIL or BLOCKED with merge_authorized false. Do not amend or replace the immutable candidate, merge, push, tag, or update the coordinator ledger."

handoff:
  report_path: "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-handoff.yaml"
  candidate_commit_excludes_handoff_and_verification_metadata: true
  post_candidate_metadata_paths:
    - "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-handoff.yaml"
  metadata_commit_rule: "For PASS or FAIL, add and commit only the handoff as the immutable candidate's direct child. For pre-candidate BLOCKED, add and commit only the handoff as the producer start commit's direct child. Never amend or replace the coordinator or candidate, and never put the handoff commit's own SHA in the handoff."
  required_fields:
    - "schema_version"
    - "packet_id"
    - "status"
    - "producer_model"
    - "model_gate_evidence"
    - "subagents_used"
    - "base_commit"
    - "producer_start_commit"
    - "candidate_parent_commit"
    - "candidate_commit"
    - "branch"
    - "changed_paths"
    - "versions"
    - "trust_domain_and_release_gate_evidence"
    - "contract_and_compatibility_evidence"
    - "opfs_atomicity_and_integrity_evidence"
    - "exact_variant_mapping_evidence"
    - "zero_egress_and_network_evidence"
    - "backup_build_and_precache_exclusion_evidence"
    - "personal_data_and_pwa_safety_evidence"
    - "accessibility_and_fallback_evidence"
    - "acceptance_evidence"
    - "checks"
    - "protected_path_audit"
    - "known_risks"
    - "optional_evidence"
    - "automated_verification"
    - "review_target"
  prohibited_fields:
    - "handoff_commit"
    - "metadata_commit"
    - "self_sha"
  disclosure_rule: "State that personal-local imports are unreviewed device-only material, are absent from backup and transfer, and never become eligible for distribution; strict release-grade source/license/provenance evidence remains mandatory for every committed or distributable byte."

automated_verification:
  required: true
  record_location: "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-handoff.yaml#automated_verification"
  schema:
    schema_version: 1
    packet_id: "PERSONAL-LOCAL-ANIMATION-01"
    candidate_commit: "40-character SHA or null only for pre-candidate BLOCKED"
    status: "PASS|FAIL|BLOCKED"
    checks:
      - command: "exact required command"
        result: "pass|fail|not_run"
        evidence: "exact output or immutable artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only PASS with all 18 required commands recorded exactly once as pass, the exact immutable candidate, a schema-valid handoff, byte-identical protected release gates, zero personal-local egress, and no active stop gate may set merge_authorized true. FAIL or BLOCKED always sets merge_authorized false."
  optional_evidence_rule: "Cold, owner, independent, legal, visual, biomechanics, manual, named-reviewer, VoiceOver, and physical-device review are optional evidence only. They never complete, block, or authorize the candidate, and an unperformed optional check is never reported as passed."

merge:
  allowed_only_after: "automated_verification.status == PASS, every one of the 18 exact automated command records is pass, no stop gate is active, and automated_verification.merge_authorized == true"
  target: "main"
  method: "fast-forward"
  squash_policy: "forbidden"
  checkpoint_tag_after_merge: "checkpoint/personal-local-animation-01-automated-pass"
  next_packet_rule: "A later WORKOUT-INTEGRATION packet may explicitly consume the public personal-local read API only after this checkpoint. It must preserve exact variant identity, release-pack separation, zero egress, backup exclusion, and active-workout PWA deferral."
  current_coordinator_task_prohibitions:
    - "Do not implement the personal-local lane."
    - "Do not add or inspect user animation bytes."
    - "Do not alter historical packets or handoffs."
    - "Do not merge main."
    - "Do not push."
    - "Do not update docs/ai/reviews/coordinator-ledger.yaml."
    - "Do not create any checkpoint tag."
