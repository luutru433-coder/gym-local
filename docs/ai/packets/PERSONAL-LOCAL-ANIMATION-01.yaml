outcome:
  objective: "Implement an additive, device-only lane that lets the user explicitly import, validate, bind, preview, activate, list, and remove a bounded self-contained GLB for one exact existing exercise-equipment variant without creating any path for those bytes to leave local OPFS or qualify for distribution."
  user_visible_result: "Settings provides bilingual controls for a user-selected local GLB, exact variant selection, local-only disclosure, structural validation, preview, activation, status, and removal. The lane remains separate from production packs and does not yet mount animations in the active workout."
  deliverables:
    - "ADR 0022 and a master-plan update defining two non-interchangeable trust domains: release-grade distributable packs and personal-local imports."
    - "A new dependency-free personal-local schema v1 with strict parsing, stable immutable local IDs, exact variant binding, content SHA-256, byte size, clip/camera/loop metadata, origin assertion, personal_local_only scope, imported timestamp, and literal no-egress policy."
    - "A separate @gym/storage OPFS namespace and atomic registry for staged import, verification, exact read, per-variant activation, listing, recovery, and removal; no IndexedDB table, migration, backup field, release-pack journal, or exported raw-byte/download API."
    - "A player-source adapter or additive controller union that preserves all release-pack validation while accepting only a structurally verified personal-local source with the same exact request variant and immutable local animation ID."
    - "A bilingual Settings card that requires explicit local file selection, exact catalog variant selection, user acknowledgement of local-only use, and origin classification as user-supplied or permissively sourced; it never accepts a URL or initiates network access."
    - "A preview using the existing renderer, reduced-motion behavior, written fallback, accessible native controls, and clear labeling that local imports are unreviewed and are not part of backup or cross-device transfer."
    - "Automated evidence for bounded GLB parsing, self-containment, content integrity, exact mapping, atomic crash/quota behavior, cleanup, backup exclusion, zero egress, build/precache exclusion, personal-data immutability, release-gate preservation, accessibility, and deferred PWA updates during an active workout."
    - "One immutable candidate commit followed by one handoff-only direct-child commit with complete automated PASS evidence."
  non_goals:
    - "No committed, bundled, generated, copied, downloaded, transformed, or distributed animation asset."
    - "No relaxation of source, license, attribution, provenance, checksum, deterministic-build, or redistribution evidence for any committed or distributable pack."
    - "No retry or implementation of ANIMATION-WAVE-01 or its source-acquisition packet and no claim that a local import is eligible input to either packet."
    - "No URL import, remote source discovery, provider integration, scraping, media conversion, ZIP import, release descriptor import, archive export, local-byte download, sharing, upload, sync, telemetry, analytics, or service-worker caching."
    - "No catalog record, stable release pack ID, release animation ID, workout record, history, PR, routine, session, custom exercise, nutrition record, pantry item, saved plan, database schema, backup schema, package dependency, or renderer dependency change."
    - "No automatic mapping, alias, fuzzy match, case normalization, equipment fallback, neighboring-variant reuse, or silent substitution."
    - "No active-workout player integration; that remains a separately coordinated WORKOUT-INTEGRATION packet."

decisions:
  contract_or_schema_change: "additive personal-local schema v1 plus compatibility tests; release pack schema/protocol/catalog remain version 1 and byte-identical"
  app_version_change: "none; retain 0.7.0 for this bounded lane"
  database_or_migration: "none; personal-local bytes and metadata live only in a separate OPFS layout owned by @gym/storage"
  backup_version_change: "none; backup v5 remains byte-identical and excludes all personal-local bytes and metadata"
  catalog_change: "none; the UI selects an existing exact immutable variant ID and stores a separate local binding"
  source_or_license_impact: "local origin assertion only; no release-grade rights claim and no distributable eligibility"
  accepted_file_format: "Exactly one model/gltf-binary GLB no larger than 16 MiB, with valid GLB 2.0 structure, exactly one finite animation clip, bounded node/accessor/buffer/image counts, no external URI, no script or extension requiring remote execution, and no trailing or hidden payload."
  identity_rule: "Generate an immutable personal-local animation ID at successful import. Replacement creates a new ID; it never reuses or mutates a release animation ID. Every read and playback request must match both that ID and its exact case-sensitive exerciseVariantId."
  selection_rule: "At most one personal-local record is active for an exact variant. A local record may be activated or removed only explicitly. It does not overwrite an installed release pack; no source is selected for another variant and no fallback crosses equipment variants."
  egress_rule: "Personal-local bytes and metadata are never committed, bundled, exported, downloaded by the app, backed up, restored from backup, uploaded, synced, telemetered, sent through fetch/XHR/beacon/socket, written to CacheStorage, copied to public, included in service-worker precache, or passed into release builders."
  trust_domain_rule: "The personal-local parser and registry must not construct, impersonate, or satisfy AnimationPackReleaseDescriptor, AnimationPackManifest, AnimationLicenseRecord, AnimationSourceRecord, Wave 01 acquisition, or release provenance fields. Promotion to a release is impossible through this API and requires a future release-grade packet with the unchanged strict gates."
  precedence_rule: "The Settings preview uses the explicitly selected local record. No default product or active-workout precedence over release packs is introduced in this packet."
  privacy_rule: "Store only normalized local metadata required to replay the file; never store a full local filesystem path. Filename display is optional, sanitized, device-local, and excluded from backup and logs."

