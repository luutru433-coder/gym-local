acceptance_tests:
  - { id: "PLA01-AC-01", requirement: "Lineage is exact: e51e2661 -> packet-only coordinator -> one immutable candidate -> handoff-only direct child, or a pre-candidate BLOCKED handoff-only direct child.", evidence: "Git parent, range, name-only, object, and clean-worktree assertions." }
  - { id: "PLA01-AC-02", requirement: "ADR 0022 and the master plan define personal-local imports as a separate non-distributable trust domain and leave all production source/license/provenance gates strict.", evidence: "Policy assertions plus byte-identity audit of protected release files." }
  - { id: "PLA01-AC-03", requirement: "The additive schema rejects unknown fields, malformed IDs/timestamps/hashes, non-local scope, mutable identity, missing no-egress literals, and any attempt to represent a release descriptor, manifest, source, license, or provenance approval.", evidence: "Contract parser positive, boundary, and adversarial tests." }
  - { id: "PLA01-AC-04", requirement: "Import accepts only an explicitly selected bounded self-contained GLB 2.0 with one finite clip and rejects JSON glTF, ZIP, corrupt/truncated/oversized/trailing data, external URIs, unsafe extensions, unbounded structures, and hidden payloads.", evidence: "Storage parser tests using in-memory synthetic bytes only." }
  - { id: "PLA01-AC-05", requirement: "OPFS staging, verification, activation, recovery, quota failure, interruption, concurrent operations, integrity recheck, and cleanup are atomic and cannot mutate release-pack storage or personal IndexedDB data.", evidence: "Deterministic backend and OPFS tests with before/after hashes and counts." }
  - { id: "PLA01-AC-06", requirement: "Every local source read and player request matches the same immutable local ID and exact case-sensitive exercise-equipment variant; no alias, normalization, neighbor, fuzzy, or cross-variant fallback exists.", evidence: "Exhaustive exact/mismatch mapping tests." }
  - { id: "PLA01-AC-07", requirement: "Import, list, preview, activate, read, recover, and remove perform zero fetch/XHR/beacon/socket/background-sync/CacheStorage operations and expose no export, share, upload, sync, or raw-byte download UI/API.", evidence: "Instrumented zero-egress tests and public-export/static-call-graph audit." }
  - { id: "PLA01-AC-08", requirement: "A backup created after local import contains neither bytes, content hash, immutable local ID, exact local metadata, filename sentinel, nor OPFS registry state, and backup restore neither imports nor deletes the local lane.", evidence: "Real backup-v5 ZIP inspection and storage state comparison." }
  - { id: "PLA01-AC-09", requirement: "Neither normal build output nor the service-worker precache contains a synthetic local-byte sentinel, local import record, raw asset, public asset, test fixture, or runtime caching route for the personal-local namespace.", evidence: "Production build and generated service-worker manifest audit." }
  - { id: "PLA01-AC-10", requirement: "The bilingual Settings experience requires file, exact variant, origin assertion, and local-only acknowledgement; provides accessible status/preview/remove controls; preserves reduced motion and written fallback; and never implies rights review or distribution eligibility.", evidence: "RTL/jsdom semantic, keyboard, error, reduced-motion, and disclosure tests." }
  - { id: "PLA01-AC-11", requirement: "Existing release-pack contracts, storage, builder, validators, content, source-acquisition packet, Wave 01 packet/handoff, database/backup versions, catalog mappings, renderer dependency, and PWA policy are byte-identical.", evidence: "Protected object and locked-version assertions." }
  - { id: "PLA01-AC-12", requirement: "The complete automated suite passes, including the existing rule that a PWA update is not activated during an active workout.", evidence: "Exact required command records against the immutable candidate." }
  - { id: "PLA01-AC-13", requirement: "The schema-valid handoff names the exact immutable candidate, records all commands as pass, contains no active stop gate, sets automated_verification.status PASS, and sets merge_authorized true.", evidence: "docs/ai/reviews/PERSONAL-LOCAL-ANIMATION-01-handoff.yaml." }

