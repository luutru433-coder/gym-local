outcome:
  objective: "Implement a dependency-reviewed, deterministic animation-pack v1 source validator and builder that turns one reviewed source tree into byte-identical canonical manifest JSON, a deterministic ZIP archive, and a separate external release descriptor, with only tiny project-authored synthetic fixture evidence."
  user_visible_result: "None yet; later storage and player packets receive reproducible, integrity-bound test release artifacts without any install, renderer, UI, or production animation behavior."
  deliverables:
    - "scripts/animation-pack-v1.mjs exports pure bounded validation, canonicalization, build, and built-artifact verification functions for reviewed v1 source trees."
    - "scripts/build-animation-pack-v1.mjs exposes explicit validate-only and build CLI modes, has no network path, and exits nonzero without partial success on any failure."
    - "scripts/animation-pack-v1.test.mjs uses the Node test runner and fresh temporary directories to prove determinism and trust-boundary failures."
    - "A tiny textual fixture set represents one project-authored MIT/Gym Local GLB-compatible asset as reviewable Base64 plus reviewed source/license/release metadata; tests decode it only into fresh temporary source trees."
    - "One candidate commit contains only candidate_implementation_paths, followed by a separate direct-child metadata commit containing only docs/ai/reviews/FOUNDATION-03-handoff.yaml."
  non_goals:
    - "No storage, OPFS, IndexedDB, database, migration, install, staging-at-runtime, activation, rollback, quota, or personal backup implementation."
    - "No renderer, player, decoder dependency, playback controller, app UI, accessibility shell, exercise page, or media integration."
    - "No real exercise animation, production asset wave, catalog mapping, catalog lookup, content pack, user routine, workout, nutrition, progress, or historical-data change."
    - "No network download, authenticated descriptor delivery, release publishing, PWA/service-worker cache, public payload, or external-video change."
    - "No dependency addition, update, transitive import assumption, package script, package manifest, lockfile, compiler, test configuration, lint configuration, or version change."
    - "No committed ZIP, generated manifest, generated release descriptor, golden binary, golden checksum, output directory, unclear binary, scraped media, or third-party asset."

