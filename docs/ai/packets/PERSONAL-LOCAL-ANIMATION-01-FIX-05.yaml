stop_gates:
  - id: "PLA01-FIX-05-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, the worktree is dirty, branch/parent/coordinator delta is wrong, required reads are incomplete, prior lineage cannot be resolved, the quarantine cannot be inspected read-only, or a locked version differs."
    action: "Stop before implementation and write a BLOCKED handoff only if it can be the sole authorized metadata change. Do not substitute a model, mutate the quarantine, clean user state, amend, rebase, or widen scope."
  - id: "PLA01-FIX-05-STOP-02"
    condition: "The FIX-04 quarantine differs from its committed recovery record, is mutated or used as output, or validation would require a write, move, restore, delete, parent scan, wildcard, or unrelated filesystem access."
    action: "Stop BLOCKED without changing the quarantine. Record the exact mismatch and do not perform cleanup or recovery."
  - id: "PLA01-FIX-05-STOP-03"
    condition: "The fresh profile does not complete, its full output is not durably captured before candidate creation, its manifest/hash/read-only state is incomplete, exact phase evidence is missing, or a producer proposes to rerun a failed profile."
    action: "Stop BLOCKED before candidate creation. Preserve the exact capture and failure; do not retry, summarize from memory, delete evidence, or proceed from truncated tool output."
  - id: "PLA01-FIX-05-STOP-04"
    condition: "The failing-before oracle uses regex-only block matching, cannot identify exactly one target with deterministic parser/locator/helper evidence, does not prove the base work bound, or fails for an oracle/bootstrap reason."
    action: "Stop BLOCKED before candidate creation. Preserve the oracle output; do not retry, fall back to regex, or create a speculative candidate."
  - id: "PLA01-FIX-05-STOP-05"
    condition: "A deterministic correction requires any path outside the four candidate paths, including package scripts, global test setup, runner/configuration, product code, NutritionPage, historical evidence, or the FIX-04 quarantine."
    action: "Stop BLOCKED and report the exact owning path and separate packet needed. Do not widen this fixer."
  - id: "PLA01-FIX-05-STOP-06"
    condition: "The proposed fix increases a timeout or budget; adds sleep, polling delay, retry, rerun, skip, only, todo, failure swallowing, or wall-clock-only proof; reduces workers/file parallelism; serializes, filters, or splits the suite; changes global configuration; or hides a failure with cleanup."
    action: "Stop FAIL. The contention defect remains unresolved."
  - id: "PLA01-FIX-05-STOP-07"
    condition: "A deterministic fixture or contract test replaces, stubs, reduces, or mocks the separately required complete renderer workload; any FIX-03 assertion is removed or weakened; or a separate end-to-end command is missing or does not use production code and real candidates/assets."
    action: "Stop FAIL. Default-suite speed cannot weaken behavioral or release-gate coverage."
  - id: "PLA01-FIX-05-STOP-08"
    condition: "FIX-03 production isolation regresses; benchmark workload, scores, selection, timing, network, disposal, leak, or report bytes change; a non-explicit path touches historical evidence; or the durable profiling capture changes after finalization."
    action: "Stop FAIL and preserve exact evidence/root state. Do not restore, delete, ignore, normalize, or hide it."
  - id: "PLA01-FIX-05-STOP-09"
    condition: "FIX-02 Nutrition objects or semantics change, Vietnamese-only nutrition changes, or any personal-local/release contract, storage, media, Settings, backup, exact-variant, zero-egress, personal data, source/license/provenance, offline, build/precache, module-boundary, or active-workout PWA invariant changes."
    action: "Stop FAIL, record the protected-object or behavioral difference, and do not authorize merge."
  - id: "PLA01-FIX-05-STOP-10"
    condition: "Any required command or iteration fails or is not run; a failure is retried; pnpm run verify is interrupted or split; an immediate clean-state assertion is omitted; an unexpected path changes; the candidate is empty or mutates; a producer-owned root leaks; optional evidence is invented; or the handoff is schema-invalid."
    action: "Record FAIL or BLOCKED with merge_authorized false. Do not amend or replace the candidate, merge, tag, push, update the coordinator ledger, delete evidence, mutate the quarantine, or clean/restore failed-command state."

