stop_gates:
  - id: "F05-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, or authoritative invocation metadata cannot be verified."
    action: "Stop without model substitution and write a BLOCKED handoff."
  - id: "F05-STOP-02"
    condition: "Branch, exact base HEAD, cleanliness, instructions, required reads, package graph, or protocol/version preflight does not match this packet."
    action: "Stop before editing and report exact mismatch; do not clean, rebase, amend, or guess."
  - id: "F05-STOP-03"
    condition: "Correctness requires a contract/schema/version change, storage/catalog mapping, feature-page integration, PWA change, app store change, or any path outside allowed candidate files."
    action: "Stop without widening scope and name the required owning packet."
  - id: "F05-STOP-04"
    condition: "A production renderer, GLB decoder, browser polyfill, dependency/package/lock/config change, external CDN, network call, object URL, binary asset, or source/license record is required."
    action: "Stop and defer the renderer/asset decision to the animation pilot benchmark."
  - id: "F05-STOP-05"
    condition: "The controller can publish a contract-invalid state, silently resolve another variant/animation, accept mismatched asset metadata, or allow a stale async callback after new load/detach/dispose."
    action: "Stop with exact reproduction; do not weaken exact identity, parser, cancellation, or disposal tests."
  - id: "F05-STOP-06"
    condition: "Reduced motion can start motion, the shell autoplays, written fallback is absent, native keyboard/VoiceOver semantics fail, focus is stolen, or 320 px structure requires horizontal scrolling due to component-owned fixed width."
    action: "Stop and correct only within authorized media/component/CSS/test files; if another UI owner is needed, write BLOCKED handoff."
  - id: "F05-STOP-07"
    condition: "Existing external video, storage, personal data, backup, exact-variant history, workout UI, PWA update deferral, service-worker payload, nutrition, or protected object changes."
    action: "Stop and preserve the last safe checkpoint; do not accept a regression for the player shell."
  - id: "F05-STOP-08"
    condition: "A required check fails beyond allowed repair, candidate needs multiple implementation commits, an unexpected path changes, or exact handoff evidence would be circular/unresolved."
    action: "Stop before candidate completion and write a BLOCKED handoff; do not amend, widen scope, or invent evidence."

