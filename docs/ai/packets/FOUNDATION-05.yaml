outcome:
  objective: "Implement a public @gym/media animation player controller with exact-identity loading and deterministic state transitions, plus an accessible responsive web shell and controllable test renderer, without choosing or bundling a production renderer."
  user_visible_result: "No production route changes yet; the tested player shell is ready for the animation pilot and later catalog/workout composition while existing optional video remains unchanged."
  deliverables:
    - "ADR 0018 records controller/renderer/source ownership, exact identity, lifecycle cancellation, reduced-motion, accessibility, failure fallback, and the deferred production-renderer benchmark."
    - "@gym/media exports a renderer-neutral player controller, injected exact asset loader/renderer interfaces, immutable state subscription, attach/load/play/pause/seek/retry/dispose operations, and no storage or network implementation."
    - "A test-only renderer fixture deterministically controls load, frame, ended, and failure events and records every renderer/session call."
    - "ExerciseAnimationPlayer provides bilingual loading/ready/playing/paused/failed/reduced-motion states, native keyboard controls, VoiceOver labels, progress control, retry, and always-available written fallback."
    - "Component CSS has no fixed minimum viewport width, wraps controls, uses at least 44 px targets, and disables nonessential motion under prefers-reduced-motion."
    - "One candidate commit contains only candidate paths and one direct-child metadata commit contains only the handoff."
  non_goals:
    - "No Three.js, Babylon.js, model-viewer, WebGL/WebGPU/canvas production renderer, GLB decoder, new dependency, dynamic CDN, object URL, production asset, source/license record, or animation quality claim."
    - "No storage install/read change, OPFS access, catalog mapping, exercise discovery, routine/workout integration, active-workout UI change, service-worker/PWA change, network fetch, external-video change, or release-index authentication."
    - "No physical iPhone performance, battery, thermal, memory, first-frame, biomechanics, or production visual-quality claim; the animation pilot owns those gates."
    - "No contract/schema/version/database/backup/catalog/nutrition change and no cross-variant fallback."

