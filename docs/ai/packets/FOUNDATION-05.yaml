implementation_requirements:
  module_boundaries:
    - "animation-player.ts imports player/entry/asset/error types and parsers only from public @gym/contracts. It imports no storage, catalog, UI, app, network, filesystem, or renderer library."
    - "The asset loader is injected and returns one contract-shaped entry, asset descriptor, and verified Blob for the exact request. The controller never searches, redirects, lowercases, aliases, or substitutes variant/animation IDs."
    - "The renderer adapter is injected and receives the attached HTMLElement, exact Blob, entry, asset descriptor, and immutable request. The renderer session owns render resources and must dispose them."
    - "ExerciseAnimationPlayer imports only React, existing lucide-react, public @gym/contracts, and public @gym/media. It never imports OPFS, IndexedDB, storage internals, catalog internals, or network APIs."
    - "Existing ExerciseVideoPlayer and online video behavior remain byte-identical."
    - "Every new TypeScript and CSS file uses the repository MIT header for Gym Local contributors; do not copy the generic skill's MyCompany Apache header."
  exact_identity:
    - "Validate every request with parseAnimationPlayerRequest before publishing loading."
    - "Require resolved entry.exerciseVariantId and entry.animationId to equal request exactly, entry.assetId/path to equal the asset descriptor exactly, duration and media type to be protocol-compatible, and reject any mismatch before renderer mount."
    - "Variant mismatch maps to missing_variant, animation/asset mismatch maps to missing_asset, malformed input maps to activation_failed, and no failure path retries a similar identity."
    - "Renderer calls receive request playbackSpeed, cameraPreset, mirrorMode, and reducedMotion unchanged except that the web shell may only strengthen reducedMotion from false to true when the OS preference is active."
  state_machine:
    - "Initial state is the exact contract idle state. Every published state must pass parseAnimationPlayerState; invalid internal state is a hard activation_failed text fallback, never silently published."
    - "attach is required before load and binds one viewport. Reattach/detach/load/dispose cancels obsolete work, disposes stale sessions exactly once, and prevents stale loader/renderer callbacks from changing current state."
    - "load publishes loading synchronously, then ready only after exact source and renderer session succeed. It never autoplays."
    - "play is allowed only from ready/paused and calls the current session once; pause is allowed only while playing; seek clamps to [0,duration], updates the session, and publishes a valid paused/playing position."
    - "Renderer time updates are finite, clamped, generation-scoped, and cannot move state backward after detach/new load. Ended publishes paused at duration so replay can seek to zero explicitly."
    - "retry reloads only the last exact request when the current failure is recoverable. dispose is idempotent and leaves exact idle state with no live listener/session/loader generation."
    - "Loader public AnimationPackError values are preserved. Unknown load failures map to missing_asset; renderer/session failures map to activation_failed. Failed states always use offlineFallback text."
  reduced_motion:
    - "A reducedMotion request may load/mount a static first frame but play is disabled and no renderer play call occurs. Ready state uses text fallback and the shell announces static-reference mode."
    - "The web shell observes matchMedia('(prefers-reduced-motion: reduce)') when available, combines it with request.reducedMotion using logical OR, and reloads only when the effective value changes."
    - "Turning OS reduced motion off never overrides an explicit request.reducedMotion=true."
  accessibility_shell:
    - "Use useSyncExternalStore or an equivalent tear-free subscription; do not mirror controller state through polling."
    - "The figure/group has a bilingual accessible name; viewport has a meaningful role/label; loading and failures use a polite live region without repeated per-frame announcements."
    - "Play/pause/replay/retry are native buttons with localized accessible names and visible text or tooltips. The seek control is a labeled native range with localized current/total time text."
    - "Controls are disabled when semantically unavailable, focus is not stolen on state changes, keyboard behavior remains native, and no global key handler captures typing or workout input."
    - "Written fallback content is present in the DOM for every state and visibly emphasized for failed or reduced-motion states. Failure text never exposes filesystem paths or arbitrary exception strings."
    - "No animation auto-starts on mount, load, online event, route render, or active-workout render."
  responsive_css:
    - "Component styles are locally prefixed exercise-animation, use width:100%, min-width:0, overflow containment, wrapped controls, and no fixed width greater than 320 px."
    - "Interactive controls have min-height and min-width at least 44 px, visible :focus-visible outlines, adequate dark-surface contrast, and range input remains operable at 320 px."
    - "At max-width:390px metadata and controls stack/wrap without horizontal scrolling. At prefers-reduced-motion:reduce transitions/animations and smooth motion are disabled."
    - "Unit/CSS evidence proves DOM state and source constraints; physical 320/390 Safari rendering remains an explicit pilot gate and must not be claimed here."
  test_renderer_fixture:
    - "The fixture lives only in animation-player.test-renderer.ts, is not re-exported by @gym/media, performs no WebGL/canvas/network/object-URL work, and allocates no production asset."
    - "It exposes deterministic deferred mount, frame, ended, and failure controls plus exact call/dispose counters needed by tests."
    - "Fixture behavior is not used as evidence that GLB decoding, clip playback, camera behavior, biomechanics, or iPhone performance works."

acceptance_tests:
  - id: "F05-AC-01"
    requirement: "ADR 0018 records ownership, exact identity, state, cancellation, reduced motion, accessibility, fallback, and renderer benchmark deferral without changing protocol versions."
    evidence: "ADR review plus unchanged contract/version/package objects."
  - id: "F05-AC-02"
    requirement: "A valid exact source loads idle -> loading -> ready without autoplay and passes every request field unchanged to the renderer."
    evidence: "Controller test with deferred test renderer and exact call assertions."
  - id: "F05-AC-03"
    requirement: "Variant, animation, asset ID/path, duration/media, and malformed-request mismatches fail before renderer mount with stable public errors and text fallback."
    evidence: "Mismatch matrix and zero renderer-mount calls."
  - id: "F05-AC-04"
    requirement: "Play, pause, seek, frame updates, ended, replay, and renderer failure produce only contract-valid deterministic states."
    evidence: "State history assertions parsed again with parseAnimationPlayerState."
  - id: "F05-AC-05"
    requirement: "Overlapping loads, detach, reattach, and dispose cannot publish stale state and dispose every obsolete renderer session exactly once."
    evidence: "Deferred loader/mount race matrix and call counters."
  - id: "F05-AC-06"
    requirement: "Reduced motion never calls renderer play, shows static/text fallback, follows OS preference changes, and never weakens an explicit reducedMotion request."
    evidence: "Controller and component matchMedia tests."
  - id: "F05-AC-07"
    requirement: "The shell exposes bilingual group/viewport/status/control/range labels, native keyboard controls, no focus theft, and written fallback in every state."
    evidence: "Testing Library role/name/focus/user-event assertions in Vietnamese and English."
  - id: "F05-AC-08"
    requirement: "Loading, ready, playing, paused, failed recoverable/nonrecoverable, retry, ended, and static-reference UI states render correctly without arbitrary error text."
    evidence: "Component state matrix with controlled public controller/test double."
  - id: "F05-AC-09"
    requirement: "CSS satisfies bounded responsive/touch/focus/reduced-motion rules and component markup has no horizontal-width assumption."
    evidence: "Source assertions plus manual 320/390 DOM/CSS review; no physical Safari claim."
  - id: "F05-AC-10"
    requirement: "The test renderer is deterministic, test-only, not publicly re-exported, and makes no production renderer or decoding claim."
    evidence: "Import/export audit and fixture tests."
  - id: "F05-AC-11"
    requirement: "Existing online video, storage, exact variants, personal data, backup, PWA update deferral, and service-worker payload boundaries remain unchanged."
    evidence: "Protected object hashes plus existing media/storage/App/Workout/PWA regression tests and build precache audit."
  - id: "F05-AC-12"
    requirement: "No dependency/contract/version/config change or production renderer/asset/network path exists."
    evidence: "Git object/import/lock/license audits and no forbidden API matches."
  - id: "F05-AC-13"
    requirement: "Focused tests, regressions, lint, typecheck, architecture and full verify pass on immutable candidate bytes."
    evidence: "Exact command output recorded in handoff."
  - id: "F05-AC-14"
    requirement: "One candidate direct child changes only eight candidate paths, followed by one handoff-only direct child with exact non-circular facts."
    evidence: "Git parent/range/name-only/YAML assertions and clean worktree."

