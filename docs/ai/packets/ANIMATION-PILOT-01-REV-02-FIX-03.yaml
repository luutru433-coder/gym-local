  - id: "AP01R2-FIX-03-STOP-02"
    condition: "The repair requires a path outside authority.candidate_paths or any product/runtime, renderer adapter, storage, contract, schema, version, database, backup, catalog, route, PWA, dependency, package, lockfile, pack-builder, source asset, or generated release payload change."
    action: "Stop without widening scope and identify the separate owning packet required."
  - id: "AP01R2-FIX-03-STOP-03"
    condition: "Any implementation can recursively delete outside its exact validated invocation-owned generated root, can delete another invocation's or foreign/pre-existing state, releases root ownership/serialization before the consumer's last read, or uses a lock without bounded timeout, ownership proof, safe stale-state behavior, and guaranteed cleanup."
    action: "Stop with FAIL; do not accept unsafe cleanup as race prevention."
  - id: "AP01R2-FIX-03-STOP-04"
    condition: "The proposed fix relies on retry, sleep/backoff, failure swallowing, removed/weakened assertions, output populated by an earlier command, disabled file parallelism, or suite-wide serialization rather than invocation isolation or safe cross-worker serialization."
    action: "Stop with FAIL and keep AP01R2-FIX-02-STOP-08 active."
  - id: "AP01R2-FIX-03-STOP-05"
    condition: "Any of the three pinned candidates no longer executes the real comparable two-release, 12-variant, ten-cycle workload, or pass/trace/controller/disposal/leak/closure/timing/score evidence is replaced by a literal, mock-only, synthetic, detached, or reduced-workload substitute."
    action: "Stop with FAIL; concurrency safety cannot weaken benchmark validity."
  - id: "AP01R2-FIX-03-STOP-06"
    condition: "A committed field, hard gate, score, ordering key, tie-break, or renderer selection again depends on raw wall-clock timing, scheduler variation, host load, random data, current time, or another nonreproducible value; or the truthful noncommitted timing diagnostic is removed or fabricated."
    action: "Stop with FAIL and preserve FIX-02's timing reproducibility fix."
  - id: "AP01R2-FIX-03-STOP-07"
    condition: "The concurrency regression does not start clean, does not overlap real consumers, does not execute the exact three-file group in an explicit file-parallel threads pool five times, can pass with shared-root leakage, or omits deterministic byte/score/selection and cleanup assertions."
    action: "Stop with FAIL; one nonparallel or single-run pass is insufficient."
  - id: "AP01R2-FIX-03-STOP-08"
    condition: "A legitimate regeneration changes renderer-benchmark.json bytes, any deterministic candidate score, or three-direct selection without an operation-derived and packet-authorized reason, or either dedicated rerun/stress execution leaves tracked state dirty."
    action: "Stop with FAIL, record expected/actual hashes and diff, and do not amend the candidate."
  - id: "AP01R2-FIX-03-STOP-09"
    condition: "Any of the 27 inherited FIX-02 commands or 3 additional FIX-03 commands fails or is not run, an unexpected path changes, candidate/handoff lineage cannot be preserved, or the handoff cannot satisfy the automated-verification schema."
    action: "Record FAIL or BLOCKED with merge_authorized false; do not invent evidence, amend or replace the candidate, merge, push, update the ledger, or create a checkpoint."

handoff:
  report_path: "docs/ai/reviews/ANIMATION-PILOT-01-REV-02-FIX-03-handoff.yaml"
  candidate_commit_excludes_handoff_and_verification_metadata: true
  post_candidate_metadata_paths:
    - "docs/ai/reviews/ANIMATION-PILOT-01-REV-02-FIX-03-handoff.yaml"
  metadata_commit_rule: "After the single immutable candidate passes every command, add and commit only the FIX-03 handoff as its direct child. Do not amend or replace the candidate and do not name the handoff's own metadata commit inside the handoff."
  required_fields:
    - "schema_version"
    - "packet_id"
    - "status"
    - "producer_model"
    - "model_gate_evidence"
    - "subagents_used"
    - "base_commit"
    - "failed_candidate_commit"
    - "failed_metadata_commit"
    - "producer_start_commit"
    - "candidate_parent_commit"
    - "candidate_commit"
    - "branch"
    - "changed_paths"
    - "finding_resolution"
    - "output_isolation_design"
    - "destructive_cleanup_safety"
    - "parallel_stress_evidence"
    - "state_leak_and_cleanup_evidence"
    - "workload_preservation_evidence"
    - "timing_reproducibility_evidence"
    - "benchmark_rerun_evidence"
    - "acceptance_evidence"
    - "checks"
    - "protected_path_audit"
    - "known_risks"
    - "optional_evidence"
    - "automated_verification"
    - "review_target"
  prohibited_fields:
    - "handoff_commit"
    - "metadata_commit"
    - "self_sha"

automated_verification:
  required: true
  record_location: "docs/ai/reviews/ANIMATION-PILOT-01-REV-02-FIX-03-handoff.yaml#automated_verification"
  schema:
    schema_version: 1
    packet_id: "ANIMATION-PILOT-01-REV-02-FIX-03"
    candidate_commit: "40-character SHA"
    status: "PASS|FAIL|BLOCKED"
    checks:
      - command: "exact required command"
        result: "pass|fail|not_run"
        evidence: "exact output or immutable artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only PASS with all 30 required commands recorded pass, one immutable candidate, byte-identical tracked evidence, race-free five-iteration parallel stress, no leaked invocation state, Git clean, and no active stop gate may set merge_authorized true."

optional_evidence:
  cold_review: "optional; no gate effect"
  owner_review: "optional; no gate effect"
  independent_review: "optional; no gate effect"
  named_reviewers: "optional; no gate effect"
  manual_review: "optional; no gate effect"
  physical_device_review: "optional; no gate effect"
  reporting_rule: "Keep optional_manual_evidence empty unless evidence was actually supplied. Never infer or claim PASS for unperformed human, cold, owner, independent, named, manual, VoiceOver, visual, biomechanics, legal, or physical-device checks."

merge:
  allowed_only_after: "automated_verification.status == PASS and all 30 required command results == pass and automated_verification.merge_authorized == true and the immutable candidate, byte-identical renderer evidence, race-free parallel stress, and cleanup assertions are proven"
  target: "main"
  method: "fast-forward"
  squash_policy: "forbidden"
  checkpoint_tag_after_merge: "checkpoint/animation-pilot-01-rev-02-fix-03-automated-pass"
  automated_checkpoint_rule: "Only after a PASS fast-forward merge, record the FIX-03 lineage and automated result in docs/ai/reviews/coordinator-ledger.yaml in a separate coordinator checkpoint commit, then create checkpoint/animation-pilot-01-rev-02-fix-03-automated-pass. Do not update the ledger or create any checkpoint for FIX-01, FIX-02, FAIL, BLOCKED, or optional-only evidence."
  next_packet_gate: "No ANIMATION-WAVE packet may start until checkpoint/animation-pilot-01-rev-02-fix-03-automated-pass exists."
