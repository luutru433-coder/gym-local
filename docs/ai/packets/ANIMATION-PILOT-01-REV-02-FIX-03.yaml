outcome:
  objective: "Resolve only AP01R2-FIX-02-STOP-08 by preventing concurrent reproducePilot() invocations from deleting, replacing, reading, or cleaning one another's generated output while preserving FIX-02 timing reproducibility and the complete real three-renderer workload."
  user_visible_result: "None. Product/runtime behavior, storage, contracts, database, backup, catalog, routes, source animation assets, pack format, and renderer selection remain unchanged."
  deliverables:
    - "Each potentially concurrent reproduction/benchmark/test consumer either owns an isolated validated output root for its complete materialize-through-last-read lifetime or participates in cross-worker serialization held for that complete lifetime with bounded timeout, explicit ownership, and safe finally cleanup."
    - "Destructive cleanup is restricted to the exact invocation-owned generated root; it cannot delete the shared outputs directory, another invocation's root, tracked evidence, source assets, or a foreign/pre-existing path."
    - "Default CLI commands remain usable, and parallel tests do not rely on outputs/animation-pilot having been populated by a previous command."
    - "FIX-02's noncommitted timing-diagnostic policy, deterministic score vector, three-direct selection, two-release/12-variant/ten-cycle workload, operation counts, hard gates, and zero-network behavior remain intact."
    - "A regression test proves isolated roots or serialization ownership, deterministic artifact/report results, failure-safe cleanup, and absence of shared-state leakage."
    - "The exact three-file required-check group runs in explicit parallel worker mode repeatedly without ENOENT, source_changed, staging identity errors, dirty tracked state, changed benchmark bytes, or leaked invocation artifacts."
    - "All 27 FIX-02 required commands are rerun in full, followed by all additional FIX-03 concurrency commands, against one immutable candidate."
    - "One immutable candidate commit followed by one direct-child FIX-03 handoff-only commit."
  non_goals:
    - "No retry loop, timing sleep, probabilistic backoff, assertion removal, failure swallowing, pre-existing-output dependency, or whole-suite/file-parallelism disablement as the fix."
    - "No reduction or mocking away of releases, variants, cycles, parsed assets, mounted assets, operation coverage, renderer candidates, dependency-closure inspection, failure/disposal exercise, or hard gates."
    - "No modification of FIX-02's accepted timing reproducibility design except the minimum output-root propagation required for isolation."
    - "No product/runtime, renderer adapter, storage, contract, schema, version, database, backup, catalog, route, PWA, dependency, package, lockfile, pack-builder, source asset, or generated release payload change."
    - "No optional human, cold, owner, independent, named, manual, VoiceOver, visual, biomechanics, legal, or physical-device review is required or may substitute for automated evidence."

