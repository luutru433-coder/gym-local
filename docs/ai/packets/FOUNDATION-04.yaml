outcome:
  objective: "Implement a storage-owned, offline animation-pack store that stages and verifies a v1 archive, activates it failure-safely, retains one previous verified pack, rolls back, handles quota and interruption, and never mutates personal data."
  user_visible_result: "No UI yet; later player/UI packets can install, inspect, read, remove, and roll back verified offline animation packs through the public @gym/storage boundary."
  deliverables:
    - "ADR 0017 records the no-DB6 decision, OPFS content-addressed object layout, two-slot pointer journal, recovery semantics, quota policy, and backup exclusion."
    - "A bounded STORE-only ZIP reader validates terminal EOCD, central/local records, CRC32, canonical paths, entry uniqueness, descriptor-selected manifest identity, and safe Blob slices without extracting untrusted paths."
    - "A pure animation-pack store verifies descriptor, archive, manifest, compatibility, every asset, exact archive inventory, license/source relations, and staged object metadata before activation."
    - "An OPFS backend streams archive bytes to storage, persists content-addressed objects, uses an ownership marker for cleanup, and implements a two-slot checksummed generation journal."
    - "Public @gym/storage exports expose status, install, asset read, rollback, remove, and recovery without exposing IndexedDB, OPFS handles, or network access to UI code."
    - "Deterministic tests cover normal install/update/rollback/relaunch plus corruption, interruption, quota, alias/path, cleanup, and personal-data isolation cases."
    - "One candidate commit contains only candidate implementation paths, followed by one direct-child handoff-only metadata commit."
  non_goals:
    - "No UI, renderer, player state machine, animation catalog mapping, exercise discovery, workout integration, production animation, network fetch, release-index authentication, service-worker change, or PWA precache entry."
    - "No DB6, Dexie table, database migration, backup-version change, app/catalog/pack version bump, contract change, personal preference, or backup payload change."
    - "No archive format change, DEFLATE support, ZIP64 support, encrypted ZIP support, data descriptor support, external URI support, or best-effort compatibility with arbitrary ZIP tools."
    - "No reuse of the nutrition-pack worker, SQLite pack format, or UI-side storage access."

decisions:
  contract_or_schema_change: "none"
  version_decisions:
    - "Keep app 0.7.0, database 5, backup 5, catalog 3, animationPackSchemaVersion 1, animationPlayerProtocolVersion 1, and animationCatalogVersion 1."
    - "Introduce only an internal animation storage layout version 1 in packages/storage; it is not a public contract version."
  migration_or_rollback: "implementation"
  migration_decision:
    db6_required: false
    rationale: "A dedicated DB table would place reproducible public pack state inside the personal IndexedDB lifecycle and force an unnecessary migration. A storage-owned OPFS registry remains outside PersonalDataSnapshot and backup while still providing durable activation pointers."
    database_schema_validation: "Not applicable: no SQL file or Dexie schema is authorized. APP_VERSIONS.database remains 5."
  source_or_license_impact: "metadata_only"
  storage_layout:
    root: "gym-local/animation-packs/v1"
    objects: "objects/<pack-id>/<version>/<archive-sha256>/"
    transient_archive: "The verified STORE ZIP remains the installed object; manifest and assets are read as bounded Blob slices so assets are not duplicated on iPhone storage."
    object_metadata:
      - "descriptor.json"
      - "manifest.json"
      - "archive-index.json"
      - "verified.json"
      - "owner.json"
      - "animation-pack.zip"
    journal_slots:
      - "registry/slot-a.json"
      - "registry/slot-b.json"
    journal_rule: "Each canonical checksummed record has a safe-integer generation plus active and optional previous pointer. Readers select the highest fully valid generation. Writers replace only the inactive/older slot, close, reread, and verify before it becomes selectable; a torn slot leaves the older valid generation authoritative."
    retention_rule: "Never delete current active or current previous before a new journal generation commits. After commit, best-effort delete only unreferenced owned objects; retain the new active and immediately prior active as previous."

