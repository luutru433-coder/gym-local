implementation_requirements:
  module_boundaries:
    - "archive.ts is pure container parsing and byte verification; it knows no OPFS, UI, database, backup, nutrition, or network API."
    - "store.ts owns install/update/rollback/remove/recovery policy against an injected backend; it imports animation types and validators only from public @gym/contracts."
    - "opfs.ts is the sole browser filesystem adapter; store tests use an in-memory backend and do not require real user storage."
    - "animation-pack/index.ts composes and exports only stable storage-facing APIs; packages/storage/src/index.ts re-exports that public boundary."
    - "Every new TypeScript source/test file uses the repository MIT header for Gym Local contributors, not any external template owner."
  trust_order:
    - "Parse and approve the supplied trusted descriptor before accepting archive bytes."
    - "Preflight quota when StorageManager.estimate is available; an uncertain estimate must not replace actual write failure handling."
    - "Stage archive bytes while enforcing exact descriptor byte count and incremental SHA-256; never buffer the complete archive solely for hashing."
    - "Open only the staged verified archive, structurally validate its STORE ZIP index, and locate exactly descriptor.manifestPath."
    - "Verify manifest byte size and SHA-256 before strict UTF-8/JSON parsing."
    - "Parse manifest with public contracts and validate descriptor/manifest/app compatibility."
    - "Require archive inventory to equal exactly the descriptor-selected manifest plus every declared asset; reject undeclared, duplicate, colliding, directory, special, or extra entries."
    - "Verify every asset byte size, SHA-256, CRC32, source/license/review relation, and every entry-to-asset exact path before writing verified object metadata."
    - "Reread descriptor, manifest, archive index, verified marker, and object identity from the backend before journal activation."
    - "Commit the next journal generation only after all verification; any earlier failure leaves the previous journal authoritative."
  archive_policy:
    - "Locate a unique structurally terminal EOCD, reject comments/trailing bytes/multi-disk/ZIP64/encryption/data descriptors/extras and non-STORE methods."
    - "Validate central and local signatures, counts, sizes, CRC32, offsets, flags, fixed names, non-overlap, and exact central-to-local agreement."
    - "Accept canonical relative POSIX file paths only; reject backslashes, dot segments, absolute paths, controls, percent-encoded ambiguity, Unicode normalization collisions, ASCII case collisions, reserved device names, duplicate entries, and directory entries."
    - "Expose entry bytes only as bounded immutable Blob slices after structure verification; never call an extraction API with archive-controlled paths."
    - "Enforce descriptor archive limits and contract manifest/asset limits before reads and allocations; no test may allocate an unbounded declared size."
  lifecycle_policy:
    - "First install produces active with no previous. Update produces new active plus old active as previous. A second update deletes only the oldest unreferenced object after the new generation commits."
    - "Rollback revalidates the previous object, swaps active and previous in a new journal generation, and never silently selects a different pack or equipment variant."
    - "Recovery ignores torn/invalid lower-quality slots, validates the selected active object, promotes the verified previous object only when active is invalid, and otherwise returns a stable text-fallback-compatible unavailable/error state."
    - "Remove commits an empty registry generation before best-effort object cleanup; cleanup failure may leave unreferenced bytes but never a live pointer or personal-data change."
    - "Cleanup requires exact expected object path, non-alias identity, readable matching owner marker, and current journal non-reference. Missing, unreadable, mismatched, or foreign ownership preserves bytes and reports a bounded cleanup warning."
    - "QuotaExceededError and equivalent backend quota signals map to AnimationPackError code quota_exceeded; all verification or activation failures map to stable public error codes without leaking arbitrary filesystem paths."
    - "Operations serialize per store instance so concurrent installs, rollback, remove, and recovery cannot race journal generations."
  personal_data_policy:
    - "Do not import Dexie or GymDatabase in implementation files, add any table, touch settings, sessions, routines, custom variants, nutrition, pantry, meal plans, recovery points, or backup payloads."
    - "Do not add InstalledAnimationPack to PersonalDataSnapshot, AppSettings, backup manifests, service-worker precache, or PWA update state."
    - "Tests snapshot representative personal DB data and prove all install/update/failure/rollback/remove paths leave it byte-equivalent; the test may use existing storage exports but implementation may not."

acceptance_tests:
  - id: "F04-AC-01"
    requirement: "ADR 0017 records the no-DB6 OPFS journal decision, exact layout, trust order, recovery, quota, retention, and backup exclusion."
    evidence: "ADR review plus unchanged APP_VERSIONS, GymDatabase versions, backup source, and package/lock files."
  - id: "F04-AC-02"
    requirement: "A valid FOUNDATION-03 v1 fixture installs from a trusted descriptor and reports a verified active InstalledAnimationPack through public @gym/storage exports."
    evidence: "Focused install test using byte-identical deterministic fixture artifacts."
  - id: "F04-AC-03"
    requirement: "Archive size and incremental SHA-256 are checked before any ZIP/manifest trust, with overrun and underrun rejected while staging."
    evidence: "Chunked stream tests for exact, too short, too long, empty, throwing, cancelled, and post-limit unread behavior."
  - id: "F04-AC-04"
    requirement: "STORE ZIP structure and paths are validated without path extraction."
    evidence: "EOCD/local/central/CRC/offset/count/flag/method/comment/extra/trailing/ZIP64/encryption/data-descriptor/path/collision corruption matrix."
  - id: "F04-AC-05"
    requirement: "Descriptor-selected manifest size/SHA-256, strict JSON/contracts, identity, review approval, and compatibility are verified before assets."
    evidence: "Manifest mismatch, malformed UTF-8/JSON, unknown field, incompatible schema/protocol/catalog/app, identity, and review tests."
  - id: "F04-AC-06"
    requirement: "Archive inventory equals the manifest plus every declared asset exactly, and every asset relation/size/SHA-256/CRC is verified."
    evidence: "Missing/extra/duplicate/colliding asset, wrong path, size/hash/CRC, source/license/review, and entry relation tests."
  - id: "F04-AC-07"
    requirement: "Activation uses a checksummed two-slot monotonically generated journal and never exposes an unverified object."
    evidence: "Slot alternation and failure injection before/during/after stage, metadata, slot write, close, reread, and selection."
  - id: "F04-AC-08"
    requirement: "A torn, malformed, checksum-invalid, stale, or single missing journal slot recovers the newest fully valid generation deterministically."
    evidence: "Relaunch matrix with each slot independently corrupted and generation ties/overflow rejected."
  - id: "F04-AC-09"
    requirement: "Update retains new active and immediately prior active only after commit; failed update retains the old active and previous unchanged."
    evidence: "Three-version lifecycle tests with failures at every commit phase and exact retained object inventory."
  - id: "F04-AC-10"
    requirement: "Rollback revalidates and swaps only the exact previous verified object; corrupt previous never replaces active."
    evidence: "Successful, absent, corrupt, incompatible, and interrupted rollback tests."
  - id: "F04-AC-11"
    requirement: "Quota preflight and write-time quota failure preserve current state and return quota_exceeded."
    evidence: "Estimate unavailable/sufficient/insufficient plus quota failure at archive and metadata writes; no current pointer mutation."
  - id: "F04-AC-12"
    requirement: "Owned staging cleanup is bounded; foreign, aliased, markerless, mismatched, unreadable, or referenced objects are preserved."
    evidence: "Ownership/identity/reference cleanup matrix with foreign sentinel assertions."
  - id: "F04-AC-13"
    requirement: "Concurrent lifecycle calls are serialized and result in one deterministic journal history without lost generations."
    evidence: "Deferred-promise concurrency tests covering install/install, install/rollback, install/remove, and recovery/install."
  - id: "F04-AC-14"
    requirement: "Public asset reads return only the exact active pack's verified Blob slice and reject stale, previous-only, unknown, or path-substituted requests."
    evidence: "Exact byte and negative pointer/path tests; no cross-variant or cross-pack fallback API exists."
  - id: "F04-AC-15"
    requirement: "Install, update, recovery, rollback, failure, and removal do not mutate personal records or backups."
    evidence: "Representative PersonalDataSnapshot/database before-after byte equivalence and unchanged backup source/range."
  - id: "F04-AC-16"
    requirement: "Animation pack payloads remain outside service-worker precache and runtime code contains no fetch/network path."
    evidence: "Import/API audit, production PWA build, precache inventory, and unchanged apps/public/media ranges."
  - id: "F04-AC-17"
    requirement: "Current animation/contracts, nutrition-pack behavior, DB1-DB5 migration, backup v1-v5, and workout update deferral remain passing."
    evidence: "Focused contracts/storage/backup/app tests and full verify."
  - id: "F04-AC-18"
    requirement: "The candidate and handoff commits have exact parents and path scopes, and all new files carry the repository MIT header where applicable."
    evidence: "Git range assertions, YAML parse, header/license audit, and clean worktree."

