stop_gates:
  - id: "F04-STOP-01"
    condition: "gpt-5.6-sol is unavailable, authoritative model metadata cannot be verified, or a subagent would be required."
    action: "Stop before implementation and write a BLOCKED handoff; do not substitute another model."
  - id: "F04-STOP-02"
    condition: "The branch is not codex/foundation-04, HEAD is not exact base commit ce39902a705aeb59615dcbbf6a78006b254c9c07, the worktree is dirty, or required instructions/inputs are missing."
    action: "Stop before editing and write a BLOCKED handoff with exact preflight evidence; do not clean, rebase, amend, or guess."
  - id: "F04-STOP-03"
    condition: "Implementation requires any file outside authority.candidate_implementation_paths or changes a protected blob/tree."
    action: "Stop without widening scope and write a BLOCKED handoff naming the required owning packet/path."
  - id: "F04-STOP-04"
    condition: "The existing public animation contracts cannot express the required verified active/previous state, errors, descriptor/manifest compatibility, or exact asset read boundary without a contract change."
    action: "Stop and request a separate additive contract packet; do not edit packages/contracts here."
  - id: "F04-STOP-05"
    condition: "Durable failure-safe activation cannot be implemented outside personal IndexedDB and would require DB6, SQL, Dexie schema, AppSettings, PersonalDataSnapshot, or backup changes."
    action: "Stop and write a migration decision blocker; do not add a table or version bump implicitly."
  - id: "F04-STOP-06"
    condition: "OPFS semantics or supported browser APIs cannot provide the two-slot journal guarantees without rename assumptions, private APIs, polyfills, or UI-side storage access."
    action: "Stop with the exact browser/API gap; preserve the no-DB6 decision for explicit reconsideration."
  - id: "F04-STOP-07"
    condition: "A new dependency, package/lock/config change, DEFLATE/ZIP64/encryption compatibility, archive extraction library, or Node-only runtime API is required."
    action: "Stop without adding it; record the bounded dependency/format decision needed."
  - id: "F04-STOP-08"
    condition: "The implementation would need to fetch or authenticate a release descriptor, use network access, bundle production media, or change source/license content."
    action: "Stop at the trusted-input boundary and defer distribution/content to a later packet."
  - id: "F04-STOP-09"
    condition: "Any failure, quota path, cleanup, rollback, recovery, or concurrent operation can replace/delete the current verified object, referenced previous object, foreign bytes, or personal data before a valid journal commit."
    action: "Stop and write a BLOCKED handoff with the exact phase/reproduction; do not weaken atomicity or tests."
  - id: "F04-STOP-10"
    condition: "Any required check fails, a new regression cannot be resolved within allowed paths, the candidate needs multiple implementation commits, or exact handoff evidence would be circular or unresolved."
    action: "Stop before candidate completion and write a BLOCKED handoff; do not amend, widen scope, or report success."

