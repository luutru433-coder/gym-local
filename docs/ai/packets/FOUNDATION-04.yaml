    - "Review path handling using raw and Unicode-normalized comparisons; prove no archive-controlled extraction or filesystem path join occurs."
    - "Review memory behavior: hashing and staging are chunked; manifest and individual asset reads are bounded; the complete archive is not duplicated in JavaScript memory or OPFS."
    - "Confirm no DB6 or SQL exists. The schema-validator skill is not run because the packet authorizes no SQL schema file; any need for one triggers STOP-05."
    - "Confirm no production animation/license content is bundled and existing fixture licensing remains unchanged."
    - "Confirm the owner waiver is recorded as OWNER_WAIVED rather than PASS and no cold-review report is fabricated."
  evidence_paths:
