    - "Confirm no existing negative assertion was removed, inverted, or weakened."

stop_gates:
  - id: "F04-FIX-02-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, or branch/parent/cleanliness/coordinator-delta preflight fails."
    action: "Stop and write a BLOCKED handoff; do not substitute a model, clean, amend, rebase, or guess."
  - id: "F04-FIX-02-STOP-02"
    condition: "A fix needs any path outside the six candidate files or requires a dependency, contract/schema/version, DB/backup, config, archive-format, UI, or network change."
    action: "Stop without widening scope and record the exact owning packet needed."
  - id: "F04-FIX-02-STOP-03"
    condition: "FileSystemHandle.isSameEntry cannot provide the specified last-moment identity check in supported TypeScript/browser APIs."
    action: "Stop with the exact API gap; do not polyfill, use private APIs, or weaken cleanup safety."
  - id: "F04-FIX-02-STOP-04"
    condition: "A foreign replacement can still be deleted in the deterministic race, or active/previous/referenced/personal bytes can be removed before a valid journal commit."
    action: "Stop with exact reproduction and preserve questionable bytes."
  - id: "F04-FIX-02-STOP-05"
    condition: "Any finding remains, inherited gate regresses, exact boundary needs unsafe allocation, or a required check fails beyond authorized repair."
    action: "Stop before candidate completion; do not weaken tests or redefine the format."
  - id: "F04-FIX-02-STOP-06"
    condition: "The candidate needs multiple implementation commits, contains an unexpected path, or the handoff cannot state exact non-circular evidence."
    action: "Stop without amend/rebase and write the authorized BLOCKED handoff."

