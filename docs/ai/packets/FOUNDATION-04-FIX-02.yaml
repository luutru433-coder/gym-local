decision_resolution:
  blocker: "FOUNDATION-04-FIX-01 required a nonexistent resource_limit AnimationPackErrorCode."
  resolved_public_error: "corrupt_archive"
  rationale:
    - "The 64 MiB aggregate declared-asset ceiling is part of the accepted deterministic v1 archive/manifest format, so an archive whose declared inventory exceeds it is invalid input."
    - "corrupt_archive already exists in AnimationPackErrorCode and parseAnimationPackError, requires no cast or contract change, and is already used for invalid archive structure/policy."
    - "quota_exceeded is not used because the rejection is deterministic format validation before storage quota or write failure."
    - "asset_size_mismatch is not used because each declared asset may individually match its bytes while the aggregate inventory is still invalid."

outcome:
  objective: "Resolve the three coordinator findings using only the six storage implementation/test files while preserving every original FOUNDATION-04 invariant and public contract."
  non_goals:
    - "No UI, renderer, catalog, media, workout, nutrition, production asset, network, dependency, contract, schema, DB6, backup, service-worker, or PWA change."
    - "No DEFLATE, ZIP64, encryption, arbitrary ZIP compatibility, cross-tab coordinator, or changed archive format."

implementation_requirements:
  eocd:
    - "Use the final fixed 22 bytes as the version-1 EOCD because comments and trailing bytes are forbidden."
    - "Validate terminal signature, zero comment, single-disk fields, entry counts, central size/offset, and exact central adjacency before parsing central/local records."
    - "Ignore PK 05 06 bytes inside asset payloads; keep every real EOCD, topology, count, offset, gap, overlap, comment, and trailing-byte rejection."
  opfs_cleanup:
    - "Retain the originally resolved owned directory handle. Immediately before removeEntry, relookup the current entry and require await current.isSameEntry(original) to be true."
    - "Reread exact owner.json from that current same entry immediately before removal. Any missing API, lookup failure, type mismatch, alias, replacement, marker failure, or mismatch preserves bytes and reports a bounded cleanup warning."
    - "Use standards-shaped fake handles and a deterministic pre-remove replacement hook in tests; export no production test-only hook."
  aggregate_budget:
    - "Enforce exactly 64 * 1024 * 1024 bytes across manifest.assets[].byteSize only, excluding the descriptor-selected manifest."
    - "Use safe-integer arithmetic and reject the first declaration that crosses the boundary before its Blob slice is read or SHA-256 is calculated."
    - "Accept exactly 64 MiB and reject 64 MiB plus one byte with AnimationPackStoreError code corrupt_archive."
  preservation:
    - "All original FOUNDATION-04 F04-AC-01 through F04-AC-18 and the original 115 focused cases remain satisfied."
    - "No public contract, stable ID, version, OPFS layout, journal format, backup boundary, exact-variant behavior, or other error-code mapping changes."

acceptance_tests:
  - id: "F04-FIX-02-AC-01"
    requirement: "A valid STORE archive whose stored asset contains EOCD signature bytes parses and installs."
    evidence: "Positive payload-lookalike test plus retained archive corruption matrix."
  - id: "F04-FIX-02-AC-02"
    requirement: "Malformed actual terminal EOCD, comment, trailing bytes, count/offset/size corruption, and invalid central topology remain rejected."
    evidence: "Focused archive tests with explicit terminal-record mutations."
  - id: "F04-FIX-02-AC-03"
    requirement: "Cleanup removes only the exact same directory identity that passed owner checks immediately before removal."
    evidence: "isSameEntry success plus deterministic replacement-race test preserving foreign bytes."
  - id: "F04-FIX-02-AC-04"
    requirement: "Missing/failing isSameEntry, lookup/type changes, and missing/unreadable/changed owner marker preserve bytes and warn."
    evidence: "Expanded OPFS cleanup matrix."
  - id: "F04-FIX-02-AC-05"
    requirement: "Declared assets totaling exactly 64 MiB pass using bounded test doubles rather than retained 64 MiB allocations."
    evidence: "Instrumented entry stubs and read/hash counters."
  - id: "F04-FIX-02-AC-06"
    requirement: "64 MiB plus one byte returns corrupt_archive before the first crossing asset is read or hashed."
    evidence: "Exact error assertion and unchanged crossing-entry counter."
  - id: "F04-FIX-02-AC-07"
    requirement: "Every original FOUNDATION-04 test, regression, DB1-DB5, backup v1-v5, offline, architecture, and PWA gate remains passing."
    evidence: "Fresh immutable-candidate command outputs and protected-object assertions."
  - id: "F04-FIX-02-AC-08"
    requirement: "One candidate changes only finding-scoped files; its direct child adds only the non-circular FIX-02 handoff."
    evidence: "Exact parent/range/name-only/diff/YAML assertions and clean status."

