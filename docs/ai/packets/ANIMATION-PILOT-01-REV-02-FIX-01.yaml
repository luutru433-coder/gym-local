outcome:
  objective: "Resolve only AP01R2-AC-06, AP01R2-AC-10, AP01R2-AC-11, AP01R2-AC-12, AP01R2-AC-13, AP01R2-STOP-05, and AP01R2-STOP-07 by replacing literal or detached claims with automated evidence derived from real benchmark, OPFS lifecycle, renderer, backup, responsive, and resource operations."
  user_visible_result: "No product route or normal app behavior changes. The pilot remains compile-time gated, but its automated evidence becomes merge-authorizing only when measured from real operations."
  deliverables:
    - "Renderer benchmark JSON and ADR 0019 report comparable executed workloads for every pinned renderer candidate rather than literal pass/fail, leak, dependency, or score fields."
    - "Offline lifecycle evidence installs, relaunches, reads, renders, and plays all 12 verified Blob sources through an OPFS backend with zero request attempts."
    - "Personal-data table hashes/counts and backup-v5 pack-byte exclusion are measured before and after each real lifecycle phase."
    - "Responsive DOM/browser automation executes at both 320 and 390 CSS px and records both widths."
    - "Retained-archive multiplier and resource-leak metrics are derived from store/backend state and renderer diagnostics produced by the executed tests."
    - "One immutable candidate commit followed by one direct-child FIX-01 handoff metadata commit."
  non_goals:
    - "No new animation assets, variants, catalog mappings, pack releases, public schemas, controller protocols, database version, backup version, production PWA route, service-worker strategy, or normal workout integration."
    - "No change to implementation files that already passed AC-01 through AC-05, AC-07 through AC-09, and AC-14 unless listed in authority.candidate_paths."
    - "No optional human, cold, owner, independent, named, manual, VoiceOver, visual, biomechanics, legal, or physical-device review is required or may substitute for automated evidence."

