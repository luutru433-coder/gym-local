stop_gates:
  - id: "AP01R2-FIX-01-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, required reads are incomplete, the branch/parent/coordinator delta is wrong, or the worktree is dirty before implementation."
    action: "Stop before implementation and write a BLOCKED handoff at the FIX-01 report path if that is the only safe metadata change."
  - id: "AP01R2-FIX-01-STOP-02"
    condition: "A repair needs a path outside authority.candidate_paths, a contract/schema/version/DB/backup implementation change, new asset/content bytes, a normal app route change, or a PWA-update behavior change."
    action: "Stop without widening scope and name the separate owning packet required."
  - id: "AP01R2-FIX-01-STOP-03"
    condition: "Any renderer candidate cannot be resolved to the exact pinned package, integrity, license, and source metadata, or comparable workload execution would require scraping, CDN, runtime network, unpinned packages, or unsupported browser APIs."
    action: "Stop with BLOCKED or FAIL evidence; do not replace candidate execution with literals."
  - id: "AP01R2-FIX-01-STOP-04"
    condition: "Benchmark hard gates, controller/disposal claims, leak counts, dependency closure, or scores are still literal constants rather than derived from observed operations and measured package metadata."
    action: "Stop with FAIL and keep AP01R2-STOP-05 active."
  - id: "AP01R2-FIX-01-STOP-05"
    condition: "Offline lifecycle does not use OpfsAnimationPackBackend, does not relaunch through OPFS state, does not render/play all 12 verified Blobs, attempts network, or falls back across case/equipment/variant/version."
    action: "Stop with FAIL; do not weaken exact-source or offline assertions."
  - id: "AP01R2-FIX-01-STOP-06"
    condition: "Personal table hashes/counts or backup-v5 isolation are detached from the lifecycle, mutate user data, omit a lifecycle phase, or fail to prove pack bytes and identities are absent from backup output."
    action: "Stop with FAIL and record exact phase and artifact."
  - id: "AP01R2-FIX-01-STOP-07"
    condition: "Responsive automation runs at only one width, omits 320 or 390 CSS px, overlaps or clips required controls, or loses keyboard, semantic, reduced-motion, failure, or written-fallback behavior."
    action: "Stop with FAIL and record the failing width."
  - id: "AP01R2-FIX-01-STOP-08"
    condition: "Retained-archive multiplier or resource-leak metrics are hard-coded, nonfinite, circular, or not derived from actual store/backend and renderer diagnostics after operations."
    action: "Stop with FAIL and keep AP01R2-STOP-07 active."
  - id: "AP01R2-FIX-01-STOP-09"
    condition: "A required automated command fails or is not run, an unexpected path changes, candidate/handoff lineage cannot be preserved, or the handoff cannot satisfy the automated-verification schema."
    action: "Record FAIL or BLOCKED with merge_authorized false; do not invent evidence, amend the candidate, or merge."

