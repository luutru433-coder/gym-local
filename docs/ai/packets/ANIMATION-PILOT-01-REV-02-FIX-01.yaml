  - id: "AP01R2-FIX-01-F02"
    closes_acceptance: "AP01R2-AC-10"
    triggered_stop_gate: "AP01R2-STOP-07"
    requirement: "Run a network-disabled install, relaunch, exact-source read, render, and play lifecycle over all 12 verified Blob sources using the OPFS backend rather than the memory backend."
  - id: "AP01R2-FIX-01-F03"
    closes_acceptance: "AP01R2-AC-11"
    triggered_stop_gate: "AP01R2-STOP-07"
    requirement: "Measure personal table hashes/counts and backup-v5 pack-byte exclusion from the same real lifecycle phases, not from detached sentinels or generic tests."
  - id: "AP01R2-FIX-01-F04"
    closes_acceptance: "AP01R2-AC-12"
    triggered_stop_gate: "AP01R2-STOP-07"
    requirement: "Execute automated DOM/browser responsive coverage at both 320 and 390 CSS px, with keyboard, semantics, reduced-motion, failure, and text fallback assertions still passing."
  - id: "AP01R2-FIX-01-F05"
    closes_acceptance: "AP01R2-AC-13"
    triggered_stop_gate: "AP01R2-STOP-07"
    requirement: "Compute retained-archive and resource-leak metrics from store/backend object state and renderer diagnostics produced by executed operations."

acceptance_tests:
  - id: "AP01R2-FIX-01-AC-01"
    requirement: "Lineage is exact: failed metadata commit -> packet-only coordinator -> one fixer candidate -> handoff-only metadata; the failed candidate is not merged as-is."
    evidence: "Git parent, range, name-only, diff, and clean-worktree assertions."
  - id: "AP01R2-FIX-01-AC-02"
    requirement: "AP01R2-AC-06 passes because each renderer candidate executes a comparable workload and no benchmark pass, controller, disposal, leak, dependency, closure, or score value is a literal substitute for measurement."
    evidence: "renderer-benchmark.json, ADR 0019, benchmark source audit, and benchmark tests showing per-candidate operation traces, counters, dependency closure provenance, measured failures, and deterministic selection."
  - id: "AP01R2-FIX-01-AC-03"
    requirement: "AP01R2-AC-10 passes because the offline lifecycle uses OpfsAnimationPackBackend, disables network, relaunches, reads all 12 exact active sources, mounts and plays all 12 verified Blobs through the renderer boundary, and preserves text fallback."
    evidence: "offline-rollback.json plus OPFS/media tests recording backend kind, playedBlobCount 12, verifiedBlobCount 12, exact variant IDs, renderer frame events, and networkRequestAttempts 0."
  - id: "AP01R2-FIX-01-AC-04"
    requirement: "AP01R2-AC-11 passes because every lifecycle phase records real personal table hash/count before and after, no phase mutates personal data, and backup v5 produced after lifecycle contains no pack bytes, manifest bytes, descriptor bytes, archive bytes, pack identity, or animation asset payload."
    evidence: "personal-data-isolation.json plus tests deriving hashes/counts and backup assertions from the lifecycle state."
  - id: "AP01R2-FIX-01-AC-05"
    requirement: "AP01R2-AC-12 passes because automated responsive coverage runs at 320 and 390 CSS px and retains keyboard, semantic group/status, reduced-motion static frame, failure fallback, and written-fallback assertions."
    evidence: "AnimationPilotApp tests and accessibility-automation.json record both executed widths."
  - id: "AP01R2-FIX-01-AC-06"
    requirement: "AP01R2-AC-13 passes because bundle budgets remain measured, retained-archive multiplier is computed from active/previous/archive object state after install/update/rollback/remove, and resourceLeaks is computed from renderer diagnostics after executed lifecycle cycles."
    evidence: "performance-report.json, renderer-benchmark.json, performance-report source audit, and tests tracing measured counters."
  - id: "AP01R2-FIX-01-AC-07"
    requirement: "Previously passing AP01R2-AC-01 through AC-05, AC-07 through AC-09, and AC-14 remain passing, including exact 12/199 mappings, deterministic releases, license/provenance, storage exact-source rejection, default-build exclusion, PWA deferral, nutrition separation, and locked versions."
    evidence: "Complete original automated command set rerun on the immutable fixer candidate plus protected-object assertions."
  - id: "AP01R2-FIX-01-AC-08"
    requirement: "Every required automated command records result pass, automated_verification.status is PASS, optional_manual_evidence is present and empty unless actually supplied, and merge_authorized is true only for PASS."
    evidence: "Schema-valid FIX-01 handoff at docs/ai/reviews/ANIMATION-PILOT-01-REV-02-FIX-01-handoff.yaml."

