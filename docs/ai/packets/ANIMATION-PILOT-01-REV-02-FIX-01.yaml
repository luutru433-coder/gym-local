automated_verification:
  required: true
  record_location: "docs/ai/reviews/ANIMATION-PILOT-01-REV-02-FIX-01-handoff.yaml#automated_verification"
  schema:
    schema_version: 1
    packet_id: "ANIMATION-PILOT-01-REV-02-FIX-01"
    candidate_commit: "40-character SHA"
    status: "PASS|FAIL|BLOCKED"
    checks:
      - command: "exact required command"
        result: "pass|fail|not_run"
        evidence: "exact output or immutable artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only PASS with every required automated command recorded pass and no active safety stop gate may set merge_authorized true."

optional_evidence:
  cold_review: "optional; no gate effect"
  owner_review: "optional; no gate effect"
  independent_review: "optional; no gate effect"
  named_reviewers: "optional; no gate effect"
  manual_review: "optional; no gate effect"
  physical_device_review: "optional; no gate effect"
  reporting_rule: "Keep optional_manual_evidence empty unless evidence was actually supplied. Never infer or claim PASS for unperformed human, cold, owner, independent, named, manual, VoiceOver, visual, biomechanics, legal, or physical-device checks."

merge:
  allowed_only_after: "automated_verification.status == PASS and every required automated command result == pass and automated_verification.merge_authorized == true"
  target: "main"
  method: "fast-forward"
  checkpoint_tag_after_merge: "checkpoint/animation-pilot-01-rev-02-fix-01-automated-pass"
  automated_checkpoint_rule: "After a PASS merge, record the lineage and automated result in docs/ai/reviews/coordinator-ledger.yaml in a separate coordinator checkpoint commit; do not create the checkpoint for FAIL, BLOCKED, or optional-only evidence."
  next_packet_gate: "No ANIMATION-WAVE packet may start until the FIX-01 automated PASS checkpoint exists."
