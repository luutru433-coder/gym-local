acceptance_tests:
  - id: "AP01R2-FIX-02-AC-01"
    requirement: "Lineage is exact: invalidated FIX-01 handoff d6f44707 -> packet-only FIX-02 coordinator -> one FIX-02 candidate -> one direct-child handoff-only commit; FIX-01 is not merged, checkpointed, or entered in the ledger."
    evidence: "Git parent, range, name-only, diff, tag, ledger, and clean-worktree assertions."
  - id: "AP01R2-FIX-02-AC-02"
    requirement: "All three exact pinned renderer candidates still execute the same two-release, 12-variant, ten-cycle Blob workload with 240 parsed assets, 240 mounted assets, 130 trace entries, failure coverage, disposal coverage, measured closure metadata, and zero remote requests per candidate."
    evidence: "Benchmark source, regression test, renderer-benchmark.json, and source-to-evidence derivation audit; no literal or synthetic substitute is accepted."
  - id: "AP01R2-FIX-02-AC-03"
    requirement: "Every field committed to renderer-benchmark.json and every value used by score ordering or selection is independent of raw wall-clock variation. Real timing, if measured, is diagnostic only and cannot decide committed bytes, score, hard gates, or selection unless its committed encoding is proven reproducible."
    evidence: "Source audit tracing every committed field and score operand to stable operation counters/package metadata, plus regression tests that perturb or vary timing without changing scores or selected renderer."
  - id: "AP01R2-FIX-02-AC-04"
    requirement: "The selected renderer remains three-direct, its selection comes from the documented deterministic rule among real hard-gate passers, and all candidate scores remain identical across repeated runs from one immutable candidate."
    evidence: "Byte-identical tracked report, score vector comparison, selected ID comparison, ADR 0019, and two benchmark rerun records."
  - id: "AP01R2-FIX-02-AC-05"
    requirement: "An automated regression test executes the benchmark repeatedly and fails if either rerun changes the tracked renderer-benchmark.json bytes, changes any deterministic candidate score, or changes the three-direct selection."
    evidence: "scripts/animation-pilot-evidence.test.mjs test name/output and a source audit confirming the assertion is execution-based rather than comparing literals to literals."
  - id: "AP01R2-FIX-02-AC-06"
    requirement: "From the same immutable candidate, benchmark rerun 1 and rerun 2 each exit 0, hash to the exact renderer-benchmark.json blob committed at HEAD, and leave git status --porcelain empty immediately after the run."
    evidence: "Exact output and HEAD/evidence blob hashes from both additional reproducibility commands."
  - id: "AP01R2-FIX-02-AC-07"
    requirement: "All 22 FIX-01 commands pass unchanged, all additional FIX-02 reproducibility commands pass, the candidate remains immutable and Git-clean, and previously accepted source-to-evidence, lifecycle, product, license, mapping, offline, backup, PWA, and safety assertions remain passing without edits outside candidate_paths."
    evidence: "Complete exact command records, candidate SHA before and after verification, clean status, and in-scope diff."
  - id: "AP01R2-FIX-02-AC-08"
    requirement: "The handoff is schema-valid, records every required command exactly, contains optional_manual_evidence, and sets automated PASS and merge_authorized true only when all commands passed and no stop gate is active."
    evidence: "FIX-02 handoff at docs/ai/reviews/ANIMATION-PILOT-01-REV-02-FIX-02-handoff.yaml."

