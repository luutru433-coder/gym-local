stop_gates:
  - id: "AP01R2-FIX-02-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, required reads are incomplete, branch/parent/coordinator delta is wrong, or the worktree is dirty before implementation."
    action: "Stop before implementation and write a BLOCKED handoff at the FIX-02 report path only if that is the sole safe metadata change."
  - id: "AP01R2-FIX-02-STOP-02"
    condition: "A repair requires a path outside authority.candidate_paths or any product behavior, renderer production, storage, contract, schema, version, database, backup, catalog mapping, animation asset, pack release, route, PWA, dependency, package, or lockfile change."
    action: "Stop without widening scope and identify the separate owning packet required."
  - id: "AP01R2-FIX-02-STOP-03"
    condition: "Any of the three pinned candidates no longer executes the real comparable two-release, 12-variant, ten-cycle workload, or pass/trace/controller/disposal/leak/closure/timing/score evidence is replaced by a literal, mock-only, synthetic, detached, or reduced-workload substitute."
    action: "Stop with FAIL; do not trade benchmark validity for byte stability."
  - id: "AP01R2-FIX-02-STOP-04"
    condition: "A committed field, hard gate, score, ordering key, tie-break, or renderer selection depends directly on raw wall-clock timing, scheduler variation, host load, random data, current time, or another value that is not proven reproducible."
    action: "Stop with FAIL and keep AP01R2-FIX-01-STOP-09 active."
  - id: "AP01R2-FIX-02-STOP-05"
    condition: "Real timing is presented as deterministic benchmark evidence while being dropped from the workload without an explicit diagnostic policy, or timing is normalized/fabricated in a way that weakens or misrepresents the benchmark."
    action: "Stop with FAIL; timing may be a truthful noncommitted/nonselection diagnostic or use a proven reproducible representation, but it must not be invented."
  - id: "AP01R2-FIX-02-STOP-06"
    condition: "The regression test does not execute reruns, can pass while tracked renderer-benchmark.json or a candidate score changes, compares literals to literals, or does not assert three-direct selection."
    action: "Stop with FAIL and preserve the audit finding."
  - id: "AP01R2-FIX-02-STOP-07"
    condition: "Either immutable-candidate benchmark rerun changes the HEAD blob hash, changes any candidate score or selection, leaves Git dirty, or cannot prove byte identity immediately after the run."
    action: "Stop with FAIL, record both expected and actual hashes plus the exact diff, do not amend the candidate, and do not create an automated-pass handoff."
  - id: "AP01R2-FIX-02-STOP-08"
    condition: "Any of the 22 original FIX-01 commands or 5 additional FIX-02 commands fails or is not run, an unexpected path changes, source-to-evidence derivation is weakened, candidate/handoff lineage cannot be preserved, or the handoff cannot satisfy the automated-verification schema."
    action: "Record FAIL or BLOCKED with merge_authorized false; do not invent evidence, amend or replace the candidate, merge, update the ledger, or create a checkpoint."

