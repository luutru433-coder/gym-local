outcome:
  objective: "Resolve only AP01R2-FIX-01-STOP-09 by making committed renderer benchmark evidence, deterministic score, and three-direct selection byte-stable across repeated execution of the real three-candidate workload."
  user_visible_result: "None. Product behavior, routes, renderer production code, storage, contracts, database, backup, catalog mappings, and animation assets remain unchanged."
  deliverables:
    - "The same real two-release, 12-variant, ten-cycle workload still executes for all three exact pinned renderer candidates and still derives traces, controller observations, failures, leaks, closure, hard gates, and score from actual operations and package metadata."
    - "Committed benchmark bytes and deterministic selection/score do not depend directly on performance.now(), wall-clock elapsed duration, process scheduling, CPU load, or another run-variable timing value."
    - "If real elapsed timing is retained, it is either an explicitly noncommitted, nonselection diagnostic or uses a mechanism whose committed representation is proven byte-reproducible without weakening the executed workload."
    - "An automated regression test fails if a benchmark rerun changes tracked renderer-benchmark.json, changes a deterministic score, or selects anything other than three-direct under the unchanged workload."
    - "Two benchmark reruns from the same immutable candidate each reproduce the candidate's tracked renderer-benchmark.json byte-for-byte and leave Git clean."
    - "All 22 FIX-01 required commands plus the additional FIX-02 reproducibility commands pass against the immutable candidate."
    - "One immutable candidate commit followed by one direct-child FIX-02 handoff-only commit."
  non_goals:
    - "No literal or synthetic pass, trace, controller, disposal, leak, closure, timing, or score substitute."
    - "No reduction of releases, variants, cycles, parsed assets, mounted assets, operation coverage, dependency-closure inspection, offline enforcement, failure exercise, disposal exercise, or hard gates."
    - "No product behavior, renderer production, storage, contract, schema, version, database, backup, catalog mapping, animation asset, pack release, PWA route, service-worker, or normal app change."
    - "No optional human, cold, owner, independent, named, manual, VoiceOver, visual, biomechanics, legal, or physical-device review is required or may substitute for automated evidence."

