stop_gates:
  - id: "F03-FIX-01-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, or authoritative invocation metadata cannot be verified."
    action: "Stop without substitution and write a BLOCKED handoff at the authorized metadata path."
  - id: "F03-FIX-01-STOP-02"
    condition: "Branch, clean state, producer start HEAD, exact parent 5433a32ccd81147eb2ac0b87f6758a8774a84979, ancestry, or exact two-file coordinator delta does not match execution.producer_start_rule."
    action: "Stop before implementation and write a BLOCKED handoff with exact branch, HEAD, parent, status, ancestry, and unexpected paths; do not clean, rebase, amend, or guess."
  - id: "F03-FIX-01-STOP-03"
    condition: "Any correction requires scripts/build-animation-pack-v1.mjs, a fixture, contract, dependency, package/lock/config, license/notice, app/package/content/public module, or any path outside the two candidate files."
    action: "Stop without widening scope and write a BLOCKED handoff naming the required owning path or packet."
  - id: "F03-FIX-01-STOP-04"
    condition: "Real containment, stable source/output identities, or ownership-safe cleanup cannot be proved on Windows without deleting, overwriting, following an untrusted alias, or weakening atomic publication."
    action: "Stop and write a BLOCKED handoff with the exact filesystem case; preserve questionable staging and unrelated state."
  - id: "F03-FIX-01-STOP-05"
    condition: "Node 22.13 compatibility requires an internal contract import, copied/generated contract bridge, new dependency/configuration, package engine change, or API unavailable at the repository floor."
    action: "Stop and write a BLOCKED handoff; do not change contracts, dependency metadata, configuration, or the engine floor."
  - id: "F03-FIX-01-STOP-06"
    condition: "The official Node 22.13.0 archive and SHASUMS256 cannot be obtained and verified under the exact temporary test-setup authority, or exact validate and build smoke evidence cannot be produced safely."
    action: "Stop and write a BLOCKED handoff; do not claim Node 22.13 compatibility from a newer runtime, mocks, types, documentation, or unverified binary."
  - id: "F03-FIX-01-STOP-07"
    condition: "Any of the nine former defects remains reproducible, any of the original 16 acceptance criteria or inherited negative matrices regress, or artifact bytes/meaning, stable IDs, versions, public contracts, exact-variant behavior, or license boundaries change."
    action: "Stop before candidate handoff and write a BLOCKED report with exact reproduction; do not weaken tests or redefine the format."
  - id: "F03-FIX-01-STOP-08"
    condition: "The candidate contains anything beyond the two authorized scripts, its parent is not exact, or the post-candidate commit contains anything beyond the new FIX-01 handoff."
    action: "Stop without amending, rebasing, cleanup commits, or additional implementation commits; record the exact boundary failure if the authorized handoff remains the sole safe metadata change."
  - id: "F03-FIX-01-STOP-09"
    condition: "Exact candidate, handoff, metadata, or cold-review attestation would require circular SELF/self-SHA evidence or leave an immutable range endpoint unresolved."
    action: "Stop and write a BLOCKED handoff describing the evidence gap; do not use placeholders, inferred SHAs, or circular metadata."

handoff:
  report_path: "docs/ai/reviews/FOUNDATION-03-FIX-01-handoff.yaml"
  candidate_commit_excludes_handoff_metadata_commit: true
  metadata_commit_rule: "After candidate_commit, add and commit only docs/ai/reviews/FOUNDATION-03-FIX-01-handoff.yaml as the direct child without amending the candidate. The handoff cannot name its own metadata commit."
  required_fields:
    - "packet_id"
    - "status"
    - "producer_model"
    - "model_gate_evidence"
    - "subagents_used"
    - "lineage_base_commit"
    - "review_base_commit"
    - "failed_candidate_commit"
    - "failed_metadata_commit"
    - "coordinator_parent_commit"
    - "producer_start_commit"
    - "candidate_parent_commit"
    - "candidate_commit"
    - "branch"
    - "changed_paths"
    - "finding_resolution"
    - "inherited_acceptance_evidence"
    - "inherited_negative_matrix_evidence"
    - "node_22_13_runtime_evidence"
    - "checks"
    - "licenses"
    - "source_and_unrelated_mutation_audit"
    - "known_risks"
    - "review_target"
  prohibited_fields:
    - "handoff_commit"
    - "metadata_commit"
    - "self_sha"
  exact_fact_requirements:
    - "Use review.foundation-03-fixture for the actual fixture and release review unless the immutable fixture itself says otherwise; do not repeat nonexistent review IDs."
    - "Distinguish the output file animation-pack-manifest.json from its ZIP path manifest/animation-pack.json and record raw archive order exactly as produced."
    - "List only implemented fault phases and semantically valid verification points; do not claim after-rename failure cleanup coverage unless such behavior is explicitly safe and tested."

cold_review:
  required: true
  new_independent_task_required: true
  model: "gpt-5.6-sol"
  subagents_allowed: false
  inherits_producer_explanation: false
  may_edit_files: false
  allowed_verdicts:
    - "PASS"
    - "FAIL"
    - "BLOCKED"
  report_path: "docs/ai/reviews/FOUNDATION-03-FIX-01-cold-review.yaml"
  exact_metadata_attestation_required: true
  immutable_ranges:
    complete_updated_candidate: "538eb0f701e1a31ecf17740c075f9d18c650a7e8..candidate_commit"
    fixer_implementation: "producer_start_commit..candidate_commit; exactly two authorized scripts"
    handoff_metadata: "candidate_commit..metadata_commit; FIX-01 handoff only; metadata_commit recorded by cold review after it exists"
  required_independent_actions:
    - "Independently reproduce all nine former defects against the failed candidate and prove each no longer reproduces against the fixer candidate."
    - "Independently rerun every original FOUNDATION-03 F03-AC-01 through F03-AC-16 requirement and the complete inherited negative matrix, not merely producer-added tests or handoff claims."
    - "Exercise Windows realpath/identity/junction/symlink races, complete inventory and pack-source races, ownership-marker and staging-identity failures, deterministic readdir failures, structured terminal EOCD, strict GLB padding, and pre-read cumulative budgets."
    - "Use the safe official temporary-runtime procedure to independently run exact Node 22.13.0 validate/build smokes; verify SHASUMS256, avoid install/system/repository mutation, and clean the unique temp directory."
    - "Run focused Node tests, scoped lint, typecheck, architecture/content gates, full pnpm run verify, current CLI smokes, exact git/YAML/blob/tree/license/import assertions, and review the new handoff facts against actual bytes and hooks."
    - "Attest the exact metadata SHA and all parent/ranges; return only PASS, FAIL, or BLOCKED, with merge_authorized true only for PASS."

merge:
  allowed_only_after: "PASS"
  target: "main"
  squash_policy: "Keep the coordinator FAIL review/fixer packet, fixer candidate, FIX-01 handoff metadata, and fresh cold-review commit distinct through review; merge policy is decided only after recorded PASS."
