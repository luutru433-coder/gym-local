  - id: "F03-FIX-01-F03"
    severity: "P1"
    requirement: "Preserve staging on missing, unreadable, or mismatched owner proof, retain the created staging directory identity, and safely handle marker removal immediately before rename."
  - id: "F03-FIX-01-F04"
    severity: "P1"
    requirement: "Remove registerHooks and load the public contracts on Node 22.13 using only authorized files, direct dependencies, and Node built-ins; prove validate and build with an official checksum-verified temporary Node 22.13.0 runtime."
  - id: "F03-FIX-01-F05"
    severity: "P2"
    requirement: "Parse a structurally valid terminal EOCD and allow arbitrary EOCD-signature bytes inside stored GLB payloads."
  - id: "F03-FIX-01-F06"
    severity: "P2"
    requirement: "Allow required GLB JSON space padding only and reject NUL padding."
  - id: "F03-FIX-01-F07"
    severity: "P2"
    requirement: "Preflight stable sizes and cumulative budget, rejecting before read/store of the first exceeding asset with observable unread-excess evidence."
  - id: "F03-FIX-01-F08"
    severity: "P2"
    requirement: "Leave the old handoff immutable and make the new handoff record only exact actual review IDs, archive paths/order, fault phases, SHAs, ranges, and meaningful publication coverage."
  - id: "F03-FIX-01-F09"
    severity: "P3"
    requirement: "Make first-failure selection independent of filesystem readdir order using the raw comparator or deterministic sorted failure collection."

