stop_gates:
  - id: "PLA01-FIX-04-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, the worktree is dirty, branch/parent/coordinator delta is wrong, required reads are incomplete, prior lineage cannot be resolved, preserved roots are missing before validation, or a locked version differs."
    action: "Stop before implementation and write a BLOCKED handoff only if it can be the sole authorized metadata change. Do not substitute a model, clean unvalidated state, amend, rebase, or widen scope."
  - id: "PLA01-FIX-04-STOP-02"
    condition: "Either preserved root fails exact canonical-path, real-directory, non-reparse, strict-boundary, marker/sentinel, bounded-tree, or foreign-entry validation; cleanup cannot be recoverable; or cleanup would touch a parent, wildcard, sibling, unrelated worktree path, tracked file, or other root."
    action: "Stop BLOCKED before cleanup. Preserve both roots exactly and report the failed ownership fact. Never use broad deletion or hide the state."
  - id: "PLA01-FIX-04-STOP-03"
    condition: "Phase-level profiling cannot establish a deterministic repeated-work/contention cause, the failing-before regression is absent, or correctness requires a path outside the four candidate paths."
    action: "Stop BLOCKED before candidate creation and report the exact diagnostic or ownership gap. Do not create an empty, timing-only, or speculative candidate."
  - id: "PLA01-FIX-04-STOP-04"
    condition: "The proposed fix increases any timeout or budget; adds sleep, polling delay, retry, rerun, skip, only, todo, failure swallowing, or wall-clock-only proof; reduces workers/file parallelism; serializes, filters, or splits the suite; changes global runner/configuration; or hides a failure with cleanup."
    action: "Stop FAIL. The contention defect remains unresolved."
  - id: "PLA01-FIX-04-STOP-05"
    condition: "A deterministic fixture or contract test replaces, stubs, reduces, or mocks the separately required complete renderer workload; an existing FIX-03 assertion is removed or weakened; or the separate end-to-end command is missing or does not use production code and real candidates/assets."
    action: "Stop FAIL. Contract speed cannot weaken behavioral or release-gate coverage."
  - id: "PLA01-FIX-04-STOP-06"
    condition: "The benchmark changes its two-release, 12-variant, ten-cycle, 240-asset-per-candidate, 130-trace-entry-per-candidate workload; candidates, package closure, score vector, three-direct selection, timing policy, zero-network policy, disposal/leak derivation, or deterministic report bytes change."
    action: "Stop FAIL. Performance of verification may change only by separating contract and end-to-end execution, never by weakening the benchmark."
  - id: "PLA01-FIX-04-STOP-07"
    condition: "FIX-03 production semantics regress: a test benchmark can write without validated invocation ownership, ordinary build reporting mutates historical evidence, explicit committed regeneration becomes nondeterministic, cleanup can target a foreign/shared root, or any tracked evidence byte/mtime is touched by a non-explicit path."
    action: "Stop FAIL and preserve exact evidence/root state. Do not restore, delete, ignore, or normalize it."
  - id: "PLA01-FIX-04-STOP-08"
    condition: "Candidate bcc3a88f's NutritionPage source/test objects or regression semantics change, Vietnamese-only nutrition changes, or any personal-local/release contract, storage, media, Settings, backup, exact-variant, zero-egress, personal data, source/license/provenance, offline, build/precache, module-boundary, or active-workout PWA invariant changes."
    action: "Stop FAIL, record the protected-object or behavioral difference, and do not authorize merge."
  - id: "PLA01-FIX-04-STOP-09"
    condition: "Any required iteration lacks its immediate candidate, historical-evidence, Git, old-root, and new-owned-root assertions; a producer-owned root, staging path, owner marker, lock artifact, or unrecorded quarantine remains after an iteration; or a command requires cleanup before the next iteration."
    action: "Stop FAIL at that iteration without retry or cleanup. Record the exact remaining state and leave merge_authorized false."
  - id: "PLA01-FIX-04-STOP-10"
    condition: "Any of the 35 required commands or an iteration fails or is not run; a failed command is retried; pnpm run verify is interrupted or split; an unexpected path changes; the candidate is empty or mutates; optional evidence is invented; or the handoff is schema-invalid."
    action: "Record FAIL or BLOCKED with merge_authorized false. Do not amend or replace the candidate, merge, tag, push, update the coordinator ledger, or clean/restore failed-command state."

