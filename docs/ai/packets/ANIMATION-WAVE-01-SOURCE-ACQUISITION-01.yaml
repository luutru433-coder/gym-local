  user_visible_result: "None in the app. This prerequisite produces a verified, content-addressed acquisition set that a separately coordinated Wave 01 retry may consume."
  deliverables:
    - "Exactly 18 qualified acquisition records, one for each fixed Wave 01 variant and animation ID, with no pilot or out-of-wave substitution."
    - "For every record: stable exact source landing URL, exact download URL and resolved URL, exact license/terms URL and resolved URL, author/rightsholder, source title/version, required attribution and notices, explicit offline redistribution permission, explicit modification permission, retrieval status, media type, byte size, and lowercase SHA-256."
