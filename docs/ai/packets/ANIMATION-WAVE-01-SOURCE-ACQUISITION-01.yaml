    - "Machine-readable retrieval, rights, provenance, attribution, and exact movement/equipment suitability evidence for all 18 records."
    - "A focused validator and tests for the acquisition schema, exact matrix, hashes, rights booleans, URL policy, provenance graph, disallowed origins, pilot inequality, and asset-input suitability."
    - "One immutable candidate commit followed by one handoff-only direct-child commit with complete automated PASS evidence, or a pre-candidate BLOCKED handoff identifying every unresolved record without partial eligibility claims."
  non_goals:
    - "No Wave 01 manifest, release descriptor, ZIP archive, release version, production pack build, install, playback, update, rollback, performance, PWA, or service-worker work."
    - "No app, runtime, contract, schema, catalog, storage, database, backup, UI, route, dependency, package, lockfile, configuration, ADR, or existing shared validator change."
    - "No acquisition for pilot variants, Wave 02, or any of the other 181 catalog variants."
    - "No generated, generative, synthetic, placeholder, pilot-derived, generic stand-in, or cross-variant asset used to fill a missing record."
    - "No scraping, provider-restricted media, ownership-unclear media, marketplace-only redistribution restriction, editorial-only asset, personal-use-only asset, no-derivatives asset requiring modification, or URL whose rights cannot be tied to the exact bytes."
    - "No assertion that optional legal, owner, cold, visual, biomechanics, manual, named-reviewer, VoiceOver, or physical-device review ran or passed."

