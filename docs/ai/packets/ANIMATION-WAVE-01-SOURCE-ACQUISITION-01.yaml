source_acquisition_record_schema:
  index:
    required_fields:
      - "schemaVersion == 1"
      - "packetId == ANIMATION-WAVE-01-SOURCE-ACQUISITION-01"
      - "matrixCount == 18"
      - "records is an array of exactly 18 unique records in the packet-declared matrix order"
  record:
    required_fields:
      - "recordId: immutable unique string"
      - "exerciseVariantId: exact packet-declared ID"
      - "animationId: exact packet-declared ID"
      - "qualification: qualified"
      - "movement.clipName and movement.requirement"
      - "movement.expectedEquipmentProps and movement.forbiddenSubstitutions"
      - "source.title, source.version, source.author, and source.rightsholder"
      - "source.landingPageUrl, source.downloadUrl, and source.resolvedDownloadUrl as absolute HTTPS URLs"
      - "source.retrievedAtUtc, source.httpStatus, source.mediaType, source.fileName, source.byteSize, and source.sha256"
      - "source.retrievedPath pointing to the tracked content-hash-matched bytes"
      - "license.licenseId, license.name, license.version, and license.spdxExpression when applicable"
      - "license.termsUrl and license.resolvedTermsUrl as absolute HTTPS URLs"
      - "license.retrievedAtUtc, license.httpStatus, license.evidencePath, license.evidenceByteSize, and license.evidenceSha256"
      - "license.offlineRedistributionAllowed == true"
      - "license.modificationAllowed == true"
      - "license.repositoryStorageAllowed == true"
      - "license.providerRuntimeRequired == false"
      - "license.restrictions and license.obligations as explicit arrays"
      - "attribution.required, attribution.text, attribution.placement, and attribution.noticeLines"
      - "transformations: ordered array covering the complete retrieved-to-candidate hash chain; an unchanged source still has one identity step"
      - "candidate.path, candidate.mediaType == model/gltf-binary, candidate.byteSize, and candidate.sha256"
      - "provenance.sourceRecordId, provenance.licenseRecordId, provenance.retrievalAuditRecordId, provenance.rightsAuditRecordId, and provenance.assetAuditRecordId"
      - "suitability.exactMovement == true, suitability.exactEquipment == true, suitability.crossVariantSubstitution == false"
      - "suitability.pilotDerived == false, suitability.placeholder == false, suitability.generative == false, and suitability.synthetic == false"
      - "suitability.selfContainedGlb == true and suitability.externalUris is an empty array"
      - "validation.recordId, validation.validatedAtUtc, validation.method == automated, and validation.result == pass"
  transformation_step:
    required_fields:
      - "sequence: contiguous integer beginning at 1"
      - "operation, tool, toolVersion, parameters, and purpose"
      - "inputPath, inputByteSize, and inputSha256"
      - "outputPath, outputByteSize, and outputSha256"
      - "rightsBasisLicenseId and deterministic == true"
    rules:
      - "Each step input hash equals the previous step output hash; the first input equals source.sha256 and the last output equals candidate.sha256."
      - "Record commands or normalized parameters without secrets or unstable machine-local paths."
  retrieval_event:
    required_fields:
      - "eventId, purpose, requestedUrl, method, startedAtUtc, completedAtUtc, httpStatus, resolvedUrl, redirectChain, mediaType, byteSize, sha256, and result"
    rules:
      - "result is pass only for an exact authorized URL with a bounded recorded redirect chain and content-hash-matched tracked evidence or bytes."
      - "Search discovery events may be logged but never satisfy source, license, or byte evidence fields."

evidence_schema:
  common_required_fields:
    - "schemaVersion == 1"
    - "packetId == ANIMATION-WAVE-01-SOURCE-ACQUISITION-01"
    - "result: PASS|FAIL|BLOCKED"
    - "recordCount == 18 for PASS"
    - "records: exactly the 18 recordId/exerciseVariantId/animationId triples"
    - "failures: array, empty only for PASS"
  retrieval_audit_required_per_record:
    - "source and terms retrieval event IDs"
    - "requested, resolved, and redirect URLs"
    - "HTTP statuses, media types, retrieval timestamps, byte sizes, and lowercase SHA-256 values"
    - "tracked path hash recomputation results"
  rights_audit_required_per_record:
    - "rightsholder resolution and exact license-to-byte binding"
    - "offline redistribution, modification, repository storage, attribution, notices, restrictions, and obligations decisions"
    - "provider restriction, revocation, expiry, login, paywall, and runtime dependency checks"
    - "decision == qualified and reasons for PASS"
  asset_input_audit_required_per_record:
    - "retrieved-to-candidate transformation-chain verification"
    - "candidate byte size and SHA-256 recomputation"
    - "GLB header, glTF version, self-containment, external URI, clip, motion, rig, and equipment inspection results"
    - "exact-movement, exact-equipment, cross-variant, pilot-derived, placeholder, generative, and synthetic decisions"
  network_activity_required_fields:
    - "ordered retrieval events, bounded retry counts, allowed-host decisions, forbidden-action count == 0, and external-write count == 0"
    - "a declaration that no crawling, scraping, bulk harvesting, access-control bypass, credential capture, upload, or publication occurred"

preflight:
  report_before_editing:
    - "model_and_no_subagents"
    - "pilot_checkpoint_wave_coordinator_blocked_handoff_packet_parent_and_clean_worktree"
    - "allowed_candidate_paths_post_candidate_path_and_all_unlisted_paths_forbidden"
    - "required_reads_locked_versions_and_no_pack_implementation_scope"
    - "exact_199_12_18_169_counts_and_all_18_pairs"
    - "targeted_network_read_plan_and_zero_external_write_plan"
    - "per_record_source_rights_attribution_retrieval_hash_transformation_and_suitability_plan"
    - "applicable_stop_gates"
  required_conditions:
    clean_worktree: true
    branch_matches_target_branch: true
    head_is_packet_only_producer_start_commit: true
    producer_start_parent_matches_base_commit: true
    instructions_read: true
    exact_model_available: true
    subagents_unused: true
    required_inputs_present: true
    network_policy_accepted: true
    no_required_human_or_device_input: true

acceptance_tests:
  - { id: "AWSA01-AC-01", requirement: "Lineage is exact: Wave 01 blocked handoff -> packet-only coordinator -> one immutable candidate -> handoff-only direct child, or a pre-candidate BLOCKED handoff-only direct child.", evidence: "Git parent, range, name-only, object, and clean-worktree assertions." }
  - { id: "AWSA01-AC-02", requirement: "The acquisition matrix contains exactly the fixed 18 unique Wave 01 pairs, is disjoint from all 12 pilot variants, leaves 169 other variants, and has no partial PASS or substitution.", evidence: "Catalog-derived exhaustive matrix assertion and acquisition index." }
  - { id: "AWSA01-AC-03", requirement: "Every exact source landing, download, resolved-download, terms, and resolved-terms URL is machine-readable HTTPS, reachable during the bounded audit, and bound to content-hash-matched evidence or bytes.", evidence: "retrieval-audit.json, network-activity.json, and remote-audit command output." }
  - { id: "AWSA01-AC-04", requirement: "Every record resolves an author/rightsholder and exact rights that permit repository storage, modification, attribution-compliant offline redistribution, and use without provider runtime restrictions.", evidence: "rights-ledger.json, rights-audit.json, terms evidence, NOTICE, and automated rights checks." }
  - { id: "AWSA01-AC-05", requirement: "Every retrieved source and candidate GLB has a recomputed byte size and lowercase SHA-256, and every transformation step forms an unbroken content-hash chain.", evidence: "source-acquisition.json, transformation records, tracked bytes, and offline hash recomputation." }
  - { id: "AWSA01-AC-06", requirement: "Every candidate GLB matches the declared movement and equipment, is self-contained and structurally usable, and is neither cross-variant, pilot-derived, placeholder, generative, nor synthetic.", evidence: "asset-input-audit.json and semantic GLB tests." }
  - { id: "AWSA01-AC-07", requirement: "No scraping, bulk harvesting, access-control bypass, provider-restricted media, credential capture, or external write occurred.", evidence: "network-activity.json policy audit with zero forbidden actions and zero external writes." }
  - { id: "AWSA01-AC-08", requirement: "No Wave 01 pack, manifest, descriptor, archive, release, app, runtime, contract, storage, catalog, database, backup, UI, dependency, config, PWA, or shared-validator path changed.", evidence: "Exact candidate path subset and protected-path object audit." }
  - { id: "AWSA01-AC-09", requirement: "All required content, lint, test, affected-verification, YAML, scope, evidence, and immutability checks pass against the exact candidate.", evidence: "Exact command records in the handoff." }
  - { id: "AWSA01-AC-10", requirement: "The schema-valid handoff names the exact immutable candidate, records all required commands as pass, contains no active stop gate, sets automated_verification.status PASS, and sets merge_authorized true; optional evidence remains empty unless actually supplied.", evidence: "docs/ai/reviews/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01-handoff.yaml." }
  - { id: "AWSA01-AC-11", requirement: "The packet and handoff explicitly state that their existence alone proves no usage right and authorizes no Wave 01 retry; only the verified 18-record evidence and exact candidate bytes are eligible inputs for a separately coordinated retry.", evidence: "Packet assumptions, handoff eligibility statement, and automated schema assertion." }

required_checks:
  automated_commands:
    - "git status --short"
    - "assert producer start commit parent is 33471f11b64e0089423aaa227b5f91825f6e8f98 and its delta contains only docs/ai/packets/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01.yaml"
    - "node scripts/animation-wave-01-source-acquisition.mjs audit-remote"
    - "node scripts/animation-wave-01-source-acquisition.mjs validate --offline"
    - "pnpm exec vitest run scripts/animation-wave-01-source-acquisition.test.mjs"
    - "pnpm exec eslint scripts/animation-wave-01-source-acquisition.mjs scripts/animation-wave-01-source-acquisition.test.mjs --max-warnings=0"
    - "pnpm run content:validate"
    - "pnpm run content:audit"
    - "pnpm run verify:affected"
    - "git diff --check producer_start_commit..candidate_commit"
    - "assert candidate changed paths are a subset of authority.candidate_paths and every protected or forbidden path is byte-identical to 33471f11b64e0089423aaa227b5f91825f6e8f98"
    - "assert catalog-derived 199/12/18/169 counts, exact Wave 01 pairs, unique acquisition records, pilot disjointness, and zero cross-variant substitution"
    - "recompute all tracked retrieved, terms-evidence, transformation, and candidate byte sizes and SHA-256 values; validate every provenance edge and reject untracked or orphan bytes"
    - "audit all 18 exact source/download/terms URLs, redirect chains, authors/rightsholders, license-to-byte bindings, offline redistribution and modification rights, attribution, notices, provider restrictions, and network-policy records"
    - "audit all 18 candidate GLBs for exact movement/equipment, self-containment, clip and finite-motion suitability, pilot-hash inequality, and non-placeholder/non-generative/non-synthetic status"
    - "parse every YAML file under docs/ai and validate the handoff required fields, exact command records, candidate SHA, optional_manual_evidence, status, and merge_authorized consistency"
    - "assert candidate_commit remains unchanged before and after all post-candidate commands, all post-candidate checks are network-disabled, and git status --porcelain is empty"
  execution_rule: "Run commands 1 and 2 at preflight. Run command 3 only after all 18 proposed records and bytes exist and before candidate creation; it is the sole network-enabled required command and must not mutate external state. Create the immutable candidate only if commands 1 through 3 pass and no stop gate is active. Then run commands 4 through 17 in order against the exact candidate with network disabled. Any failure, not_run result, candidate mutation, unexpected path, or unresolved record prevents PASS."
  evidence_paths:
    - "content/animation-packs/animation-wave-01/source-acquisition/source-acquisition.json"
    - "content/animation-packs/animation-wave-01/source-acquisition/retrieved/**"
    - "content/animation-packs/animation-wave-01/source-acquisition/candidates/*.glb"
    - "content/animation-packs/animation-wave-01/source-acquisition/transformations/*.json"
    - "docs/licenses/animation-wave-01/source-acquisition/rights-ledger.json"
    - "docs/licenses/animation-wave-01/source-acquisition/NOTICE.md"
    - "docs/licenses/animation-wave-01/source-acquisition/terms/**"
    - "docs/ai/evidence/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01/retrieval-audit.json"
    - "docs/ai/evidence/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01/rights-audit.json"
    - "docs/ai/evidence/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01/asset-input-audit.json"
    - "docs/ai/evidence/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01/network-activity.json"
    - "docs/ai/reviews/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01-handoff.yaml"
  optional_manual_or_device_checks: []

stop_gates:
  - id: "AWSA01-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, the base/branch/parent/coordinator delta is wrong, required reads are incomplete, locked versions differ, or the worktree is dirty before implementation."
    action: "Stop before acquisition and write a BLOCKED handoff only if the report path is the sole safe metadata change. Do not widen scope."
  - id: "AWSA01-STOP-02"
    condition: "Any of the 18 records is missing, cannot be resolved without reducing or changing the matrix, or would require a pilot asset, another variant, a generic stand-in, or the same bytes reused across materially different equipment variants."
    action: "Stop BLOCKED and enumerate every missing or conflicting pair. Do not shrink the matrix or claim partial PASS."
  - id: "AWSA01-STOP-03"
    condition: "Any exact source, download, license/terms, or resolved URL is unreachable, unstable without content-hash evidence, redirected to login/search/viewer/unknown terms, or cannot be bound to the exact retrieved bytes."
    action: "Exclude the bytes and stop BLOCKED for the exact record, URL, status, and redirect chain. Do not replace it silently."
  - id: "AWSA01-STOP-04"
    condition: "Any author/rightsholder or license is unknown, ambiguous, revoked, contradictory, expired, provider-restricted, marketplace-restricted, editorial-only, personal-use-only, no-derivatives when modification is needed, or does not explicitly permit repository storage, modification, and offline redistribution with satisfiable attribution and notices."
    action: "Exclude the bytes and stop BLOCKED with the exact missing right or conflicting term. Packet text, a search result, or optional human opinion cannot substitute for the required record."
  - id: "AWSA01-STOP-05"
    condition: "Acquisition would require crawling, scraping, bulk harvesting, access-control or anti-bot bypass, credentials, purchase, click-through acceptance, undocumented APIs, external writes, uploads, publication, telemetry, or provider-runtime access."
    action: "Stop BLOCKED without performing the action and record the exact blocked source."
  - id: "AWSA01-STOP-06"
    condition: "Any asset is generative, synthetic, placeholder, pilot-derived, a preview or thumbnail, a generic equipment stand-in, a cross-variant substitution, mismatched to the declared movement/equipment, structurally unusable, externally dependent, or cannot form a complete retrieved-to-candidate hash chain."
    action: "Stop FAIL or BLOCKED for that record and retain exact hashes and suitability findings. Do not relabel or repair it by substitution."
  - id: "AWSA01-STOP-07"
    condition: "Correctness requires changing any contract, schema, stable ID, catalog mapping, runtime, renderer, storage, database, migration, backup, app, UI, route, dependency, package, lockfile, configuration, ADR, shared content validator, service worker, PWA policy, Wave 01 pack/release file, or any other unlisted path."
    action: "Stop BLOCKED and request a separate coordinate packet. Do not expand allowed paths in place."
  - id: "AWSA01-STOP-08"
    condition: "Any required automated command fails or is not run, an evidence file is missing or schema-invalid, a byte size or SHA-256 does not recompute, candidate or handoff lineage is wrong, an unexpected path changes, or the candidate changes during verification."
    action: "Record FAIL or BLOCKED with merge_authorized false. Do not amend or replace the immutable candidate, invent evidence, merge, push, update the ledger, or create a tag."

handoff:
  report_path: "docs/ai/reviews/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01-handoff.yaml"
  candidate_commit_excludes_handoff_and_verification_metadata: true
  post_candidate_metadata_paths:
    - "docs/ai/reviews/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01-handoff.yaml"
  metadata_commit_rule: "For PASS, add and commit only the handoff as the immutable candidate's direct child. For pre-candidate BLOCKED, add and commit only the handoff as the producer start commit's direct child. Never amend or replace the coordinator or candidate, and never put the handoff commit's own SHA in the handoff."
  required_fields:
    - "schema_version"
    - "packet_id"
    - "status"
    - "producer_model"
    - "model_gate_evidence"
    - "subagents_used"
    - "base_commit"
    - "producer_start_commit"
    - "candidate_parent_commit"
    - "candidate_commit"
    - "branch"
    - "changed_paths"
    - "variant_matrix"
    - "network_activity_summary"
    - "source_retrieval_evidence"
    - "license_rights_and_attribution_evidence"
    - "transformation_and_provenance_evidence"
    - "asset_input_suitability_evidence"
    - "acceptance_evidence"
    - "checks"
    - "protected_path_audit"
    - "eligibility_statement"
    - "known_risks"
    - "optional_evidence"
    - "automated_verification"
    - "review_target"
  prohibited_fields:
    - "handoff_commit"
    - "metadata_commit"
    - "self_sha"
  eligibility_statement_rule: "State verbatim that the packet and handoff do not themselves prove rights or authorize Wave 01 implementation; only the exact candidate bytes and all 18 records after automated PASS are eligible inputs to a separately coordinated Wave 01 retry."

automated_verification:
  required: true
  record_location: "docs/ai/reviews/ANIMATION-WAVE-01-SOURCE-ACQUISITION-01-handoff.yaml#automated_verification"
  schema:
    schema_version: 1
    packet_id: "ANIMATION-WAVE-01-SOURCE-ACQUISITION-01"
    candidate_commit: "40-character SHA or null only for pre-candidate BLOCKED"
    status: "PASS|FAIL|BLOCKED"
    checks:
      - command: "exact required command"
        result: "pass|fail|not_run"
        evidence: "exact output or immutable artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only PASS with all 17 required commands recorded exactly once as pass, all 18 records qualified, the exact immutable candidate, a schema-valid handoff, and no active stop gate may set merge_authorized true. FAIL or BLOCKED always sets merge_authorized false."
  optional_evidence_rule: "Cold, owner, independent, legal, visual, biomechanics, manual, named-reviewer, VoiceOver, and physical-device review are optional evidence only. They never complete, block, or authorize the candidate, and an unperformed optional check is never reported as passed."

merge:
  allowed_only_after: "automated_verification.status == PASS, every one of the 17 exact automated command records is pass, the 18-record acquisition set is complete, no stop gate is active, and automated_verification.merge_authorized == true"
  target: "main"
  method: "fast-forward"
  squash_policy: "forbidden"
  checkpoint_tag_after_merge: "checkpoint/animation-wave-01-source-acquisition-01-automated-pass"
  next_packet_rule: "Only after the acquisition candidate is merged and checkpointed may a separate coordinator create a bounded ANIMATION-WAVE-01 retry packet that consumes the exact verified candidate bytes and records. This acquisition packet never authorizes pack implementation by itself."
  current_coordinator_task_prohibitions:
    - "Do not search for, evaluate, retrieve, download, convert, or add any asset or license byte."
    - "Do not implement or retry ANIMATION-WAVE-01."
    - "Do not merge main."
    - "Do not push."
    - "Do not update docs/ai/reviews/coordinator-ledger.yaml."
    - "Do not create any checkpoint tag."
