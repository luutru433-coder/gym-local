    - "branch_and_start_commit"
    - "lineage_base_ancestry"
    - "coordinator_delta_from_lineage_base"
    - "dirty_files"
    - "allowed_paths"
    - "applicable_stop_gates"
    - "known_invariant_or_compatibility_conflicts"
  required_conditions:
    clean_worktree: true
    head_is_coordinator_packet_commit: true
    parent_lineage_contains_review_base: true
    only_coordinator_delta_is_packet: true
    instructions_read: true
    required_inputs_present: true
    model_is_gpt_5_6_sol: true
    subagents_unused: true

acceptance_tests:
  - id: "F02-AC-01"
    requirement: "The three animation version constants are independently exported as literal 1 values while every existing app/database/backup/catalog/nutrition/workout/package version remains byte-for-byte unchanged."
    evidence: "Focused constant tests, packages/contracts/src/index.ts boundary inspection, and candidate diff."
  - id: "F02-AC-02"
    requirement: "Unknown values can be parsed into every required descriptor, manifest, entry/asset/source/license/review record, installed-pack, player request/state, and stable error contract without dependency use or silent coercion."
    evidence: "Positive and negative table-driven tests in packages/contracts/src/animation-pack.test.ts plus package/typecheck evidence."
  - id: "F02-AC-03"
    requirement: "Only the external trusted descriptor accepts and owns archiveByteSize/archiveSha256 and descriptor-selected manifest path/size/hash; the in-archive manifest rejects whole-archive and self-reference fields."
    evidence: "Valid descriptor test and forbidden-field manifest tests for every prohibited field."
  - id: "F02-AC-04"
    requirement: "Descriptor and manifest compatibility accepts supported v1 and fails closed for each unknown future schema/protocol/catalog version, minimum-app incompatibility, and every bound identity mismatch."
    evidence: "Compatibility matrix tests with exact stable codes and issue paths."
  - id: "F02-AC-05"
    requirement: "Manifest validation enforces canonical IDs/hashes/dates/semver/paths, positive safe byte sizes, finite durations/camera/player values, valid loop windows, unique IDs and paths, source/license integrity, exact variant mapping, and at most one primary mapping per exact variant/catalog tuple."
    evidence: "Table-driven malformed and referential-integrity tests, including duplicate IDs, paths, mappings, missing references, and loop boundaries."
  - id: "F02-AC-06"
    requirement: "Validation failures are deterministic, serializable, path-addressable, non-mutating, and do not return a partial accepted value."
    evidence: "Tests repeat the same invalid parse, compare deep equality and JSON round-trip, assert issue codes/order/paths, and verify input equality."
  - id: "F02-AC-07"
    requirement: "No exact-variant lookup, parser, or compatibility function silently falls back or coerces across equipment variants."
    evidence: "Near-match and missing exact-variant tests prove stable missing_variant or mapping validation failure without alternate result."
  - id: "F02-AC-08"
    requirement: "InstalledAnimationPack and all player-state discriminants validate, including valid reduced-motion requests and idle/loading/ready/playing/paused/failed serializable states with recoverable and offline-fallback semantics."
    evidence: "Player/installed-state positive matrix and invalid discriminant/field-combination tests."
  - id: "F02-AC-09"
    requirement: "The complete stable AnimationPackError code set is exported through @gym/contracts and tests pin every required spelling."
    evidence: "Exact array/object equality test importing from packages/contracts/src/index.ts."
  - id: "F02-AC-10"
    requirement: "The candidate contains only the three authorized contract implementation paths; no package, dependency, storage, media, UI, backup, content, PWA, builder, fixture, or asset change exists."
    evidence: "git diff --name-only coordinator_packet_commit..candidate_commit and git diff --stat, recorded in handoff."
  - id: "F02-AC-11"
    requirement: "The complete review range starts at f20bf05d3f640b94e7df178a4303d0105134c492, includes the unchanged coordinator packet plus the implementation candidate, and the only post-candidate delta is the handoff report."
    evidence: "Immutable candidate and metadata range commands recorded with exact SHAs in the handoff."

required_checks:
  commands:
    - "pnpm exec vitest run packages/contracts/src/animation-pack.test.ts"
    - "pnpm run typecheck"
    - "pnpm run verify"
    - "git diff --check f20bf05d3f640b94e7df178a4303d0105134c492..candidate_commit"
    - "git diff --name-only coordinator_packet_commit..candidate_commit"
    - "git diff --name-only f20bf05d3f640b94e7df178a4303d0105134c492..candidate_commit"
    - "git diff --name-only candidate_commit..handoff_commit"
    - "Parse docs/ai/packets/FOUNDATION-02.yaml and docs/ai/reviews/FOUNDATION-02-handoff.yaml with the bundled Node runtime and repository js-yaml."
  timing:
    - "Run focused tests and typecheck during implementation and again at the final candidate bytes."
    - "Create the candidate commit before writing the handoff, then run pnpm run verify and immutable diff checks against that candidate commit."
    - "Write and commit only the handoff report after the candidate; do not amend the candidate."
  manual_reviews:
    - "Review against docs/code-review.md, emphasizing module scope, offline failure safety, exact equipment-variant semantics, and license/review metadata completeness."
    - "Inspect packages/contracts/src/index.ts and repository imports to confirm all new public contracts are reachable only through @gym/contracts and no consumer imports animation-pack.ts directly."
    - "Inspect the complete diff for any dependency, manifest, version, storage, media, app UI, backup, catalog content, PWA, builder, fixture, or asset change."
    - "Trace descriptor-only archive/manifest integrity ownership and confirm the manifest rejects forbidden self-reference fields."
    - "Trace every compatibility decision and confirm unknown or ambiguous values fail closed without cross-variant fallback."
  evidence_paths:
    - "docs/ai/reviews/FOUNDATION-02-handoff.yaml"

stop_gates:
  - id: "F02-STOP-01"
    condition: "gpt-5.6-sol is unavailable, a subagent would be required, or the active producer/reviewer cannot verify the mandated model."
    action: "Stop without substitution and write a BLOCKED handoff report at the authorized handoff path."
  - id: "F02-STOP-02"
    condition: "The producer start worktree is dirty, HEAD is not the supplied coordinator packet commit, f20bf05d3f640b94e7df178a4303d0105134c492 is absent from its parent lineage, or the pre-edit delta from that lineage base contains anything other than docs/ai/packets/FOUNDATION-02.yaml."
    action: "Stop before editing and write a BLOCKED handoff with exact branch, HEAD, status, ancestry, and unexpected paths; do not clean or rebase the worktree."
  - id: "F02-STOP-03"
    condition: "A dependency, package manifest, lockfile, configuration, or path outside authority.allowed_paths must change to implement or test the contracts."
    action: "Stop without widening scope and write a BLOCKED handoff naming the required change and why repository-native TypeScript is insufficient."
  - id: "F02-STOP-04"
    condition: "Correctness requires storage, archive, hashing, authentication, media, renderer, app UI, backup, catalog content, PWA, builder, fixture-pack, or asset implementation."
    action: "Stop and write a BLOCKED handoff; defer implementation to the owning later packet."
  - id: "F02-STOP-05"
    condition: "The trust root, descriptor authentication responsibility, approval semantics, or ownership of archive/manifest digest fields cannot be represented without allowing the archive or manifest to authenticate itself."
    action: "Stop and write a BLOCKED handoff describing the unresolved trust/authentication decision; never accept manifest-supplied archive expectations."
  - id: "F02-STOP-06"
    condition: "Any schema/protocol/catalog/minimum-app or descriptor/manifest compatibility ambiguity would require guessing, coercion, fallback, or acceptance of an unknown future or unsafe manifest."
    action: "Stop and write a BLOCKED handoff with the ambiguous field and rejected unsafe behavior; fail closed rather than silently accepting it."
  - id: "F02-STOP-07"
    condition: "Any validation or mapping design would silently substitute a different exercise/equipment variant or reuse an immutable stable ID."
    action: "Stop and write a BLOCKED handoff; do not implement cross-variant fallback or ID reuse."
  - id: "F02-STOP-08"
    condition: "A candidate or post-candidate diff contains an unexpected path, or the handoff cannot prove separate candidate and metadata commits."
    action: "Stop, do not amend or add unrelated cleanup, and write a BLOCKED handoff if the authorized report path is still the sole safe metadata change."

handoff:
  report_path: "docs/ai/reviews/FOUNDATION-02-handoff.yaml"
  candidate_commit_excludes_handoff_metadata_commit: true
  metadata_commit_rule: "After candidate_commit, only docs/ai/reviews/FOUNDATION-02-handoff.yaml may change before cold review, and it must be committed separately without amending candidate_commit."
  required_fields:
    - "packet_id"
    - "status"
    - "lineage_base_commit"
    - "coordinator_packet_commit"
    - "producer_start_commit"
    - "candidate_commit"
    - "handoff_commit"
    - "branch"
    - "changed_paths"
    - "acceptance_evidence"
    - "checks"
    - "licenses"
    - "known_risks"
    - "review_target"
  required_review_target:
    candidate: "f20bf05d3f640b94e7df178a4303d0105134c492..candidate_commit"
    producer_delta: "coordinator_packet_commit..candidate_commit"
    handoff_metadata: "candidate_commit..handoff_commit; docs/ai/reviews/FOUNDATION-02-handoff.yaml only"

cold_review:
  required: true
  new_independent_task_required: true
  model: "gpt-5.6-sol"
  subagents_allowed: false
  inherits_producer_explanation: false
  may_edit_files: false
  allowed_verdicts:
    - "PASS"
    - "FAIL"
    - "BLOCKED"
  report_path: "docs/ai/reviews/FOUNDATION-02-cold-review.yaml"
  immutable_ranges:
    candidate: "f20bf05d3f640b94e7df178a4303d0105134c492..candidate_commit"
    producer_implementation: "coordinator_packet_commit..candidate_commit"
    handoff_metadata: "candidate_commit..handoff_commit; docs/ai/reviews/FOUNDATION-02-handoff.yaml only"
  required_focus:
    - "Re-run or independently verify focused tests, typecheck, and pnpm run verify at candidate_commit."
    - "Review runtime validation strictness, deterministic issue ordering/paths, trust-boundary field ownership, compatibility failure behavior, exact-variant semantics, and public @gym/contracts exports."
    - "Confirm the packet is the only coordinator delta, implementation is limited to three contract paths, and the handoff is the only post-candidate delta."

merge:
  allowed_only_after: "PASS"
  target: "main"
  squash_policy: "Keep coordinator packet, candidate, and handoff commits distinct through cold review; merge policy is decided only after a recorded PASS."
