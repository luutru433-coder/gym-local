  assumptions:
    - "The trusted external release descriptor is authenticated before these validation contracts are called; authentication and transport are not designed or implemented here."
    - "The contract layer validates unknown JavaScript values without storage, network, archive extraction, hashing, rendering, or catalog lookup side effects."
    - "Exact exercise variant IDs are opaque stable IDs; this packet validates identity and mapping consistency within the supplied pack but does not query catalog content."

outcome:
  objective: "Publish executable, dependency-free TypeScript contracts and deterministic runtime validation for animation-pack descriptors, manifests, installation metadata, and player messages, with compatibility and malformed-input tests and no storage or player implementation."
  user_visible_result: "None yet; later builder, storage, and player packets can consume a reviewed @gym/contracts v1 boundary."
  deliverables:
    - "packages/contracts/src/animation-pack.ts defines the v1 public types, independent version constants, stable error codes, parsers/validators, and descriptor-to-manifest compatibility validation."
    - "packages/contracts/src/animation-pack.test.ts proves supported v1 data, strict malformed-input rejection, trust-boundary rules, exact mapping semantics, compatibility failures, deterministic serializable issues, and valid reduced-motion/player states."
    - "packages/contracts/src/index.ts publicly re-exports the animation-pack API; consumers need only @gym/contracts and no internal-path import."
    - "A candidate commit containing only implementation paths, followed by a separate schema-valid docs/ai/reviews/FOUNDATION-02-handoff.yaml metadata commit."
  non_goals:
    - "No storage, OPFS, IndexedDB, database schema, migration, activation, rollback, quota, archive extraction, download, hashing, authentication, or backup implementation."
    - "No media loader, renderer, playback controller, app UI, PWA, service-worker, catalog content, workout, nutrition, or progress behavior."
    - "No deterministic pack builder, ZIP generation, fixture pack, GLB/glTF file, binary, image, animation, or other asset."
    - "No dependency, package manifest, lockfile, test configuration, compiler configuration, or build configuration change; specifically do not use Zod or add a replacement dependency."
    - "No app, database, backup, workout catalog, nutrition-pack, or other existing version bump."

decisions:
  contract_or_schema_change: "runtime_change"
  version_decisions:
    - "Export animationPackSchemaVersion = 1 as an independent literal constant."
    - "Export animationPlayerProtocolVersion = 1 as an independent literal constant."
    - "Export animationCatalogVersion = 1 as an independent literal constant."
    - "Do not change APP_VERSIONS.app 0.7.0, APP_VERSIONS.database 5, APP_VERSIONS.catalog 3, APP_VERSIONS.backup 5, APP_VERSIONS.nutritionPackSchema 3, package.json version, or any workout/catalog/nutrition version."
    - "A pack release uses its own strict SemVer 2.0 version without a leading v; minimumAppVersion is also strict SemVer 2.0."
  migration_or_rollback: "not_applicable"
  source_or_license_impact: "metadata_only"

contract_surface:
  public_entry_point: "@gym/contracts"
  implementation_file: "packages/contracts/src/animation-pack.ts"
  export_rule: "Every new type, constant, stable error-code value, and runtime parser/validator is re-exported by packages/contracts/src/index.ts; tests may import only from ./index or @gym/contracts and no production consumer is added."
  implementation_constraints:
    - "Use repository-native TypeScript predicates/parsers over unknown input; no Zod and no new dependency."
    - "Do not silently coerce strings, numbers, booleans, dates, arrays, enum values, paths, versions, or hashes, and do not fill missing required fields with defaults."
    - "Runtime validation is pure and has no browser, storage, network, crypto, clock, locale, or random dependency."
  required_public_types:
    - "AnimationPackReleaseDescriptor"
    - "AnimationPackManifest"
    - "AnimationPackEntry"
    - "AnimationAssetDescriptor"
    - "AnimationSourceRecord"
    - "AnimationLicenseRecord"
    - "AnimationReviewRecord or an equivalently explicit typed review-metadata record"
    - "InstalledAnimationPack"
    - "AnimationPlayerRequest"
    - "AnimationPlayerState"
    - "AnimationPackError"
    - "AnimationPackValidationIssue"
    - "AnimationPackValidationResult<T>"
  required_runtime_entry_points:
    - "A public parser for each top-level trusted descriptor, manifest, installed-pack record, player request, and player state, each accepting unknown and returning AnimationPackValidationResult<T>."
    - "A public descriptor/manifest compatibility validator accepting already parsed values plus the current app SemVer and returning a deterministic validation result without throwing for untrusted input."
    - "Public type guards may be added, but must not replace path-addressable parser results."

validation_contract:
  result_shape:
    - "Success and failure are discriminated, plain-data results that survive JSON.stringify/JSON.parse without loss."
    - "Every issue contains a stable machine-readable code and a path represented as an ordered array of string or non-negative integer segments rooted at the supplied value; a concise message may be included but is not the identity of the error."
    - "For the same input, issue order, codes, and paths are identical across runs. Traverse object fields in declared schema order and arrays in ascending index order; never depend on object insertion order, locale sorting, Set/Map serialization, Error instances, or thrown exception text."
    - "Report all safely detectable structural and referential issues in deterministic order; do not return a partially accepted value or mutate the input."
  primitive_rules:
    stable_ids: "Required IDs are non-empty canonical strings from a documented conservative ASCII grammar, are compared byte-for-byte, and are unique in their declared namespace; no trimming or case folding."
    semver: "Pack version and minimumAppVersion are strict valid SemVer 2.0 strings without a leading v; comparisons handle prerelease precedence deterministically and do not use parseFloat."
    metadata_dates: "Release, creation, source-review, license-review, and approval-review dates use a documented canonical ISO-8601 form with real calendar validation; installed timestamps use a documented canonical RFC 3339 form. Malformed or impossible dates fail."
    hashes: "Every SHA-256 is exactly 64 lowercase hexadecimal characters; uppercase, prefixes, whitespace, and non-hex characters fail."
    byte_sizes: "Archive, manifest, and asset byte sizes are positive safe integers; zero, negative, fractional, non-finite, and unsafe integers fail."
    durations: "Durations and time-window values are finite; asset/clip duration is positive and loop bounds satisfy 0 <= start < end <= duration."
    player_numbers: "Playback speed and every loop/camera numeric component are finite and lie within explicitly documented safe v1 ranges; NaN and positive/negative Infinity fail."
    relative_paths: "manifestPath and asset paths are non-empty normalized POSIX relative paths: no leading slash, drive/URL scheme, backslash, empty segment, dot or dot-dot segment, query, fragment, NUL/control character, or percent-encoded traversal; the parser never normalizes an unsafe input into acceptance."
  trust_boundary:
    descriptor_owns_exclusively:
      - "archiveByteSize"
      - "archiveSha256"
      - "manifestPath"
      - "manifestByteSize"
      - "manifestSha256"
    descriptor_binds:
      - "immutable packId and pack SemVer version"
      - "animationPackSchemaVersion"
      - "animationPlayerProtocolVersion"
      - "animationCatalogVersion"
      - "minimumAppVersion"
      - "release date"
      - "reviewer identity or review-record reference"
      - "review date"
      - "explicit approval status"
    manifest_forbidden_fields:
      - "archiveByteSize"
      - "archiveSha256"
      - "manifestPath"
      - "manifestByteSize"
      - "manifestSha256"
    rule: "The in-archive manifest rejects forbidden whole-archive, descriptor-selected manifest, and self-digest fields rather than ignoring them. Per-asset byteSize and sha256 remain required in asset descriptors."
  manifest_integrity:
    - "Pack IDs, animation IDs, asset IDs, source IDs, license IDs, review IDs when present, asset paths, and mapping identities are unique in their namespaces; duplicate asset paths fail even if IDs differ."
    - "Every entry references one declared asset, source, and license through explicit IDs as applicable, and every asset/source licenseId resolves to exactly one declared license. Missing or ambiguous references fail."
    - "Every bundled asset has explicit author/source, license ID and terms URL, offline redistribution scope, attribution, modifications record including explicit none, and reviewed date; draft, missing, or unapproved release/review metadata cannot validate as an approved installable release."
    - "Each mapping binds one animationId to one exact exerciseVariantId and its declared animationCatalogVersion. No parser or compatibility function substitutes, redirects, case-folds, or falls back to a different variant."
    - "The exact tuple of exerciseVariantId and animationCatalogVersion may have at most one primary mapping. Duplicate mapping tuples and a second primary for the same exact tuple fail deterministically."
    - "Entry assetPath/assetId relationships, clip names, durations, loop windows, camera values, equipment props, accessibility fallback keys, source IDs, and license IDs must be structurally and referentially valid."
  compatibility:
    - "Supported v1 requires descriptor and manifest identity equality for packId, version, all three independent compatibility versions, and minimumAppVersion."
    - "Unknown future animation pack schema, player protocol, or animation catalog versions fail closed with distinct stable incompatibility codes; they are never treated as v1."
    - "A current app version lower than minimumAppVersion fails closed; equality and greater compatible SemVer values pass."
    - "Descriptor/manifest disagreement fails with a stable identity-mismatch code and path(s) that identify the mismatched field."
  installed_and_player_state:
    - "InstalledAnimationPack represents active, staged, and previous verification-safe pointer metadata and installed bytes/time without database handles, archive bytes, or personal data. Its discriminants and required/forbidden fields are validated."
    - "AnimationPlayerRequest requires exact exerciseVariantId plus animationId, finite positive bounded playback speed, an explicit camera preset, mirror mode, and reducedMotion boolean; reduced motion is preserved as requested and never changes variant identity."
    - "AnimationPlayerState is a serializable discriminated union for idle, loading, ready, playing, paused, and failed. Status-specific required and forbidden fields, offline fallback, recoverability, and stable AnimationPackError values are validated."

stable_error_codes:
  requirement: "Export a readonly stable code set and an AnimationPackError representation whose code is one of these values; spelling is compatibility surface and tests assert it. Validation-issue codes may be more granular but must also be stable."
  required_semantics:
    - "incompatible_schema"
    - "incompatible_player_protocol"
    - "incompatible_animation_catalog"
    - "incompatible_minimum_app"
    - "descriptor_manifest_identity_mismatch"
    - "archive_size_mismatch"
    - "archive_checksum_mismatch"
    - "manifest_size_mismatch"
    - "manifest_checksum_mismatch"
    - "asset_size_mismatch"
    - "asset_checksum_mismatch"
    - "corrupt_archive"
    - "missing_asset"
    - "missing_variant"
    - "missing_source"
    - "missing_license"
    - "quota_exceeded"
    - "activation_failed"

preflight:
  report_before_editing:
