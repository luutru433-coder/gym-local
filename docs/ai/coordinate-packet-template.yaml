schema_version: 3
packet:
  id: "PACKET-ID"
  title: "Short outcome"
  type: "foundation|implementation|content|review-fix|governance"
  status: "draft|ready|in_progress|candidate|automated_pass|failed|blocked|merged"

execution:
  model: "gpt-5.6-sol"
  subagents_allowed: false
  producer_task_handles_only_this_packet: true
  base_commit: "40-character commit SHA"
  target_branch: "codex/packet-branch"
  worktree_required: true
  sequential_after: []

authority:
  allowed_paths:
    - "exact/path/or/glob/**"
  candidate_paths:
    - "exact/candidate/path/or/glob/**"
  post_candidate_metadata_paths:
    - "docs/ai/reviews/PACKET-ID-handoff.yaml"
  forbidden_paths:
    - "path/outside/scope/**"
  external_writes_allowed: false
  dependency_changes_allowed: false
  generated_binary_assets_allowed: false

context:
  required_reads:
    - "AGENTS.md"
    - "docs/ai/master-plan.md"
    - "docs/ai/review-procedure.md"
    - "docs/ai/packets/PACKET-ID.yaml"
  accepted_adrs: []
  assumptions: []

outcome:
  objective: "One measurable outcome"
  user_visible_result: "What changes for the user, or 'none; design-only packet'"
  deliverables: []
  non_goals: []

preflight:
  report_before_editing:
    - "branch_and_base_commit"
    - "dirty_files"
    - "allowed_paths"
    - "applicable_stop_gates"
    - "known_invariant_conflicts"
  required_conditions:
    clean_worktree: true
    head_matches_base_commit: true
    instructions_read: true
    required_inputs_present: true

decisions:
  contract_or_schema_change: "none|proposal_only|runtime_change|governance_schema_only"
  version_decisions: []
  migration_or_rollback: "not_applicable|proposal|implementation"
  source_or_license_impact: "none|metadata_only|bundled_assets"

acceptance_tests:
  - id: "AC-01"
    requirement: "Machine-verifiable requirement"
    evidence: "Command output or immutable artifact expected"

required_checks:
  automated_commands: []
  evidence_paths: []
  optional_manual_or_device_checks: []

stop_gates:
  - id: "STOP-01"
    condition: "Code/data failure, unclear license or provenance, module-boundary violation, failed test, or another condition that invalidates safe continuation"
    action: "Stop without widening scope and write a FAIL or BLOCKED handoff"

handoff:
  report_path: "docs/ai/reviews/PACKET-ID-handoff.yaml"
  candidate_commit_excludes_handoff_and_verification_metadata: true
  post_candidate_metadata_paths:
    - "docs/ai/reviews/PACKET-ID-handoff.yaml"
  metadata_commit_rule: "After candidate_commit, only declared post_candidate_metadata_paths may change before merge."
  required_fields:
    - "packet_id"
    - "status"
    - "base_commit"
    - "candidate_commit"
    - "branch"
    - "changed_paths"
    - "acceptance_evidence"
    - "automated_verification"
    - "licenses"
    - "known_risks"
    - "review_target"

automated_verification:
  required: true
  record_location: "handoff.report_path#automated_verification"
  schema:
    schema_version: 1
    packet_id: "PACKET-ID"
    candidate_commit: "40-character SHA"
    status: "PASS|FAIL|BLOCKED"
    checks:
      - command: "exact command"
        result: "pass|fail|not_run"
        evidence: "exact output or artifact"
    optional_manual_evidence: []
    merge_authorized: false
  authorization_rule: "Only status PASS with every required automated command recorded as pass may set merge_authorized true."

optional_evidence:
  cold_review: "optional; no gate effect"
  owner_review: "optional; no gate effect"
  independent_review: "optional; no gate effect"
  named_reviewers: "optional; no gate effect"
  manual_review: "optional; no gate effect"
  physical_device_review: "optional; no gate effect"
  reporting_rule: "Never infer execution or PASS for absent or not_run optional evidence."

merge:
  allowed_only_after: "automated_verification.status == PASS and every required automated command result == pass and automated_verification.merge_authorized == true"
  target: "main"
  squash_policy: "packet-defined"
