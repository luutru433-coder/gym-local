<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2efe6" />
    <meta name="description" content="Gym Local — nhật ký tập luyện và dinh dưỡng riêng tư, chạy trên thiết bị của bạn." />
    <meta name="application-name" content="Gym Local" />
    <meta name="apple-mobile-web-app-title" content="Gym Local" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gym Local" />
    <meta property="og:description" content="Tập luyện, dinh dưỡng và tiến độ — riêng tư trên thiết bị của bạn." />
    <meta property="og:image" content="./og-gym-local.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./og-gym-local.png" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Gym Local</title>
    <script>
      // Sets the theme before the first paint; src/lib/theme.ts keeps it current afterwards.
      (function () {
        var theme;
        try { theme = localStorage.getItem("gym-local.theme"); } catch (error) { /* storage unavailable */ }
        if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#121410");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
